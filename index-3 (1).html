-ui)}\nsummary{cursor:pointer;font-weight:700}\ndetails p{margin:8px 0 0}\n\n.bodies{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}\n.bodies .btn{display:inline-flex;align-items:center;gap:8px;font-size:15px}\n.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}\n.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:600 14px/1.6 var(--ui);background:var(--surface2)}\n.card h5{margin:0 0 4px;font:800 13px var(--ui);display:flex;align-items:center;gap:8px}\n.card h5 i{width:10px;height:10px;border-radius:50%}\n.card b{font-weight:800}\n.flash{animation:fl .9s ease}\n@keyframes fl{0%{background:var(--brand-soft);border-color:var(--brand)}100%{background:var(--surface2)}}\n.selname{font:800 18px var(--ui);margin-bottom:10px}\n.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}\n.seg button{flex:1;font:700 13px var(--ui);padding:0 8px;min-height:40px;border:0;background:var(--surface2);color:var(--ink);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--brand);color:var(--brand-ink)}\n.mini{font:500 13.5px/1.5 var(--ui);color:var(--muted);margin:8px 0 0}\n\n.pair{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-bottom:14px}\n@media(min-width:700px){.pair{grid-template-columns:1fr 1fr}}\n.pair figure{margin:0}\n.pair figcaption{font:700 14px var(--ui);margin:8px 2px 0}\n.readout{font:700 15px/1.6 var(--ui);background:var(--surface2);border-radius:10px;padding:10px 14px;margin:10px 0}\n.readout.big{font-size:19px}\n.readout .l{color:var(--muted);font-weight:600}\n\n.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}\n.tasks li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font:500 15px/1.5 var(--ui);display:grid;gap:8px}\n.tasks .res{font-weight:700}\n.tasks .res.ok{color:var(--ok)}.tasks .res.bad{color:var(--bad)}\n.q{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;margin:12px 0;max-width:46rem}\n.q p{font:700 16px/1.45 var(--ui);margin:0 0 10px}\n.q .opts{display:grid;gap:8px}\n.q .opts button{text-align:left;font:600 15px var(--ui);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;min-height:44px}\n.q .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}\n.q .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}\n.q .exp{font:500 14.5px/1.55 var(--ui);color:var(--muted);margin-top:10px}\n.score{font:800 18px var(--ui);margin:14px 0}\n.summary li{margin:6px 0}\nfooter{margin-top:64px;border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font:500 14px/1.6 var(--ui)}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.flash{animation:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"wrap in\">\n    \u003ca class=\"brand\" href=\"#boshi\">Osmon koordinatalari\u003c/a>\n    \u003cnav aria-label=\"Dars bo‘limlari\">\n      \u003ca href=\"#l1\">1. Osmon sferasi\u003c/a>\n      \u003ca href=\"#l2\">2. Jism koordinatalari\u003c/a>\n      \u003ca href=\"#l3\">3. Ekvatorial sistema\u003c/a>\n      \u003ca href=\"#quiz\">Mustahkamlash\u003c/a>\n    \u003c/nav>\n    \u003cbutton class=\"iconbtn\" id=\"themeBtn\" type=\"button\" aria-label=\"Yorug‘ yoki qorong‘i mavzuni almashtirish\">◐ Mavzu\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"prog\">\u003c/div>\n\u003c/header>\n\n\u003cmain id=\"boshi\">\n\u003csection class=\"hero\">\n  \u003cdiv class=\"wrap in\">\n    \u003cdiv>\n      \u003cp class=\"kicker\">11-sinf · Astronomiya · Interaktiv dars\u003c/p>\n      \u003ch1>Osmon koordinatalari\u003c/h1>\n      \u003cp class=\"lead\">Osmondagi har bir yulduzning o‘rnini ikkita son bilan aytish mumkin. Bu darsda o‘sha sonlar qanday paydo bo‘lishini sferani aylantirib va sliderlarni siljitib o‘rganasiz.\u003c/p>\n      \u003col class=\"plan\">\n        \u003cli>\u003ca href=\"#l1\">Osmon koordinatalari haqida tushuncha va osmon sferasi\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#l2\">Osmon jismlarining koordinatalarini aniqlash va ulardan foydalanish\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#l3\">Ekvatorial koordinatalar sistemasi\u003c/a>\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"stage-wrap\">\u003ccanvas id=\"cHero\" role=\"img\" aria-label=\"Sekin aylanayotgan osmon sferasi modeli\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ===================== 1 ===================== -->\n\u003csection class=\"lesson\" id=\"l1\">\n\u003cdiv class=\"wrap\">\n  \u003ch2>1. Osmon sferasi\u003c/h2>\n  \u003cdiv class=\"prose\">\n    \u003cp>Kechasi osmonga qarasangiz, yulduzlar sizdan bir xil uzoqlikda, ulkan gumbazga yopishib turgandek tuyuladi. Aslida ular juda xil masofalarda joylashgan, ammo ko‘zimiz masofani sezmaydi: biz faqat \u003cem>yo‘nalishni\u003c/em> ko‘ramiz. Shuning uchun astronomlar jismlarning faqat yo‘nalishlarini o‘rganishda shartli model — osmon sferasidan foydalanadi.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"note model prose\">\u003cb>Osmon sferasi\u003c/b> — markazi kuzatuvchi turgan nuqtada bo‘lgan, radiusi ixtiyoriy (cheksiz katta deb olinadigan) xayoliy sfera. Osmon jismlari shu sferaning sirtiga proyeksiyalangan deb qaraladi.\u003c/div>\n  \u003cdiv class=\"prose\">\n    \u003cp>Bu haqiqiy jism emas, \u003cb>shartli model\u003c/b>: uning radiusi ahamiyatsiz, muhimi — kuzatuvchidan jismga yo‘nalish. Yulduzlargacha masofa Yer radiusidan million marta katta, shuning uchun Yerni sfera markazidagi nuqta deb olamiz. Kuzatuvchi ham, Yer ham sferaning markazida bo‘ladi.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>Osmon sferasining asosiy tushunchalari\u003c/h3>\n  \u003cdl class=\"terms\">\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#b99bff\">\u003c/i>Zenit va nadir\u003c/dt>\u003cdd>Otves chizig‘i (og‘irlik kuchi yo‘nalishi) osmon sferasini ikki nuqtada kesadi. Kuzatuvchi boshi tepasidagi nuqta — \u003cb>zenit (Z)\u003c/b>, uning ostidagi qarama-qarshi nuqta — \u003cb>nadir (Z′)\u003c/b>.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#f5bd54\">\u003c/i>Matematik gorizont\u003c/dt>\u003cdd>Sfera markazidan o‘tib, otves chizig‘iga perpendikulyar tekislikning sferani kesishidan hosil bo‘lgan katta aylana. U osmonni ko‘rinadigan va ko‘rinmaydigan yarim sharlarga bo‘ladi. Gorizont aylanasida shimol, janub, sharq va g‘arb nuqtalari bor.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#8fb2ff\">\u003c/i>Dunyo o‘qi va osmon qutblari\u003c/dt>\u003cdd>Yerning aylanish o‘qining davomi \u003cb>dunyo o‘qi\u003c/b> deyiladi. U sferani \u003cb>shimoliy (P)\u003c/b> va \u003cb>janubiy (P′)\u003c/b> osmon qutblarida kesadi. Qutblarning o‘rni yulduzlarga nisbatan deyarli o‘zgarmaydi: butun osmon shu o‘q atrofida aylangandek ko‘rinadi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#3fe0cc\">\u003c/i>Osmon ekvatori\u003c/dt>\u003cdd>Dunyo o‘qiga perpendikulyar, markazdan o‘tuvchi tekislikning sferani kesishidan hosil bo‘lgan katta aylana. U osmonni shimoliy va janubiy yarimsharlarga bo‘ladi va gorizontni sharq hamda g‘arb nuqtalarida kesadi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#ff8196\">\u003c/i>Osmon meridiani\u003c/dt>\u003cdd>Zenit, nadir va osmon qutblaridan o‘tuvchi katta aylana. U gorizontni shimol va janub nuqtalarida kesadi. Yulduz meridianni kesib o‘tganda eng baland (yoki eng past) holatda bo‘ladi.\u003c/dd>\u003c/div>\n  \u003c/dl>\n\n  \u003cp class=\"simhead\">Interaktiv simulyatsiya · Osmon sferasi modeli\u003c/p>\n  \u003cdiv class=\"sim\">\n    \u003cdiv class=\"stage-wrap\">\n      \u003ccanvas id=\"c1\" tabindex=\"0\" role=\"img\" aria-label=\"Osmon sferasining interaktiv modeli. Strelka tugmalari bilan aylantiring.\">\u003c/canvas>\n      \u003cdiv class=\"hint\">Sferani sichqoncha yoki barmoq bilan aylantiring\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch4>Modelda nimalar ko‘rinsin?\u003c/h4>\n      \u003cdiv class=\"chips\" id=\"chips1\">\u003c/div>\n      \u003cdiv class=\"defbox\" id=\"def1\" aria-live=\"polite\">\u003cstrong>Maslahat\u003c/strong>Biror elementni yoqing yoki o‘chiring — uning ta’rifi shu yerda chiqadi va chizmada qalinroq ko‘rsatiladi.\u003c/div>\n      \u003cdiv class=\"field\">\n        \u003clabel for=\"phi1\">Kuzatuvchining geografik kengligi φ \u003coutput id=\"phi1o\">\u003c/output>\u003c/label>\n        \u003cinput type=\"range\" id=\"phi1\" min=\"0\" max=\"90\" step=\"1\" value=\"41\">\n      \u003c/div>\n      \u003cdiv class=\"row\" id=\"phiPresets\">\n        \u003cbutton class=\"btn\" type=\"button\" data-phi=\"0\">Ekvator 0°\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" data-phi=\"41\">Toshkent 41°\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" data-phi=\"90\">Shimoliy qutb 90°\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton class=\"btn\" type=\"button\" id=\"play1\" aria-pressed=\"false\">▶ Sutkalik aylanish\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"reset1\">Ko‘rinishni tiklash\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdetails class=\"prose\">\n    \u003csummary>Tajriba: kenglikni o‘zgartiring va kuzating\u003c/summary>\n    \u003cp>φ = 0° (ekvator) bo‘lsa, osmon qutblari gorizontda yotadi, osmon ekvatori esa zenit orqali o‘tadi. φ = 90° (Shimoliy qutb) bo‘lsa, shimoliy osmon qutbi zenitda bo‘ladi, ekvator esa gorizont bilan ustma-ust tushadi. Demak, \u003cb>osmon qutbining gorizontdan balandligi kuzatuvchining geografik kengligiga teng\u003c/b>.\u003c/p>\n  \u003c/details>\n  \u003cdiv class=\"prose\">\n    \u003cp>\u003cb>Sutkalik aylanish.\u003c/b> Yer o‘z o‘qi atrofida g‘arbdan sharqqa aylanadi, shuning uchun osmon sferasi dunyo o‘qi atrofida sharqdan g‘arbga aylanayotgandek ko‘rinadi. «Sutkalik aylanish» tugmasini bosing: sariq yulduz gorizont ustidan chiqib, meridiandan o‘tadi va botadi. Uning yo‘li — osmon ekvatoriga parallel kichik aylana.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"note key prose\">\u003cb>Asosiy g‘oya.\u003c/b> Yer sirtidagi shaharni kenglik va uzunlik bilan aniqlaymiz. Osmon sferasidagi nuqtani ham ikkita burchak bilan aniqlash mumkin. Buning uchun sferada \u003cb>asosiy aylana\u003c/b> (masalan, gorizont yoki ekvator) va \u003cb>sanoq boshi\u003c/b> tanlanadi. Shu g‘oya keyingi bo‘limlarning asosi.\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- ===================== 2 ===================== -->\n\u003csection class=\"lesson\" id=\"l2\">\n\u003cdiv class=\"wrap\">\n  \u003ch2>2. Osmon jismlarining koordinatalari\u003c/h2>\n  \u003cdiv class=\"prose\">\n    \u003cp>Sferadagi nuqta ikki o‘lchamli sirtda yotadi, shuning uchun uning o‘rnini aniqlashga \u003cb>ikkita burchak\u003c/b> yetadi. Har qanday osmon koordinatalar sistemasi uchta narsadan iborat: asosiy aylana, undagi sanoq boshi nuqtasi va burchaklarni o‘lchash yo‘nalishi.\u003c/p>\n    \u003cp>Eng oddiy sistema — \u003cb>gorizontal\u003c/b>. Unda asosiy aylana matematik gorizont:\u003c/p>\n  \u003c/div>\n  \u003cdl class=\"terms\">\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#a9c8ff\">\u003c/i>Balandlik h\u003c/dt>\u003cdd>Gorizontdan jismgacha, vertikal doira bo‘ylab o‘lchanadigan burchak. Gorizont ustida 0°…+90°, gorizont ostida 0°…−90°. Ba’zan zenit masofa z = 90° − h ishlatiladi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#ffffff;border:1px solid #888\">\u003c/i>Azimut A\u003c/dt>\u003cdd>Janub nuqtasidan gorizont bo‘ylab g‘arbga qarab 0°…360° o‘lchanadigan burchak. (Bu dars darsligidagi odatga mos. Ba’zi manbalarda azimut shimoldan sharqqa qarab hisoblanadi.)\u003c/dd>\u003c/div>\n  \u003c/dl>\n  \u003cdiv class=\"note key prose\">\u003cb>Muhim farq.\u003c/b> Gorizontal koordinatalar \u003cb>kuzatuvchining joyiga va vaqtga bog‘liq\u003c/b>: Toshkentda yulduz balandligi bir xil bo‘lsa, Moskvada boshqacha bo‘ladi, bir soatdan keyin esa Toshkentda ham o‘zgaradi. Ekvatorial koordinatalar (α, δ) esa yulduzlar bilan birga «aylanadi» va kuzatuvchiga bog‘liq emas — bu haqda 3-bo‘limda.\u003c/div>\n\n  \u003ch3>Koordinatalar nega kerak?\u003c/h3>\n  \u003cul class=\"prose\">\n    \u003cli>\u003cb>Teleskopni yo‘naltirish:\u003c/b> yulduz yoki sayyorani topish uchun uning koordinatalari kerak.\u003c/li>\n    \u003cli>\u003cb>Navigatsiya:\u003c/b> Qutb yulduzining balandligi kuzatuvchi kengligiga teng, yulduzlarga qarab kema va samolyot yo‘nalishi aniqlangan.\u003c/li>\n    \u003cli>\u003cb>Vaqt va kalendar:\u003c/b> Quyosh va yulduzlarning o‘rniga qarab vaqt, fasllar va kun uzunligi aniqlanadi.\u003c/li>\n    \u003cli>\u003cb>Yulduz xaritalari va kataloglari:\u003c/b> yulduzlarning koordinatalari jadvallarda saqlanadi.\u003c/li>\n    \u003cli>\u003cb>Quyosh, Oy, sayyoralar:\u003c/b> ularning koordinatalari kundan kunga o‘zgaradi, shuning uchun har kun uchun hisoblangan jadvallar (efemeridalar) ishlatiladi. Yulduzlarniki esa deyarli o‘zgarmaydi.\u003c/li>\n  \u003c/ul>\n\n  \u003cp class=\"simhead\">Interaktiv simulyatsiya · Osmon jismlari va ularning koordinatalari\u003c/p>\n  \u003cdiv class=\"bodies\" id=\"bodies2\" role=\"group\" aria-label=\"Osmon jismini tanlang\">\u003c/div>\n  \u003cdiv class=\"sim\">\n    \u003cdiv class=\"stage-wrap\">\n      \u003ccanvas id=\"c2\" tabindex=\"0\" role=\"img\" aria-label=\"Osmon jismlari ko‘rsatilgan sfera. Jismni bosib tanlang.\">\u003c/canvas>\n      \u003cdiv class=\"hint\">Jismni bosing · sferani aylantiring\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"selname\" id=\"selName\">\u003c/div>\n      \u003cdiv class=\"cards2\">\n        \u003cdiv class=\"card\" id=\"cardH\">\u003ch5>\u003ci style=\"background:#8fa6d0\">\u003c/i>Gorizontal koordinata\u003c/h5>\n          \u003cdiv>A = \u003cb id=\"vA\">\u003c/b>\u003c/div>\u003cdiv>h = \u003cb id=\"vh\">\u003c/b>\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\" id=\"cardE\">\u003ch5>\u003ci style=\"background:#7fd45f\">\u003c/i>Ekvatorial koordinata\u003c/h5>\n          \u003cdiv>α = \u003cb id=\"vAlpha\">\u003c/b>\u003c/div>\u003cdiv>δ = \u003cb id=\"vDelta\">\u003c/b>\u003c/div>\u003cdiv>t = \u003cb id=\"vt\">\u003c/b>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Koordinatalarni qaysi sistema bo‘yicha o‘zgartirish\">\n        \u003cbutton type=\"button\" id=\"modeEq\" aria-pressed=\"true\">α va δ ni o‘zgartirish\u003c/button>\n        \u003cbutton type=\"button\" id=\"modeHor\" aria-pressed=\"false\">A va h ni o‘zgartirish\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"grpEq\">\n        \u003cdiv class=\"field\">\u003clabel for=\"sA\">To‘g‘ri chiqish α \u003coutput id=\"sAo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sA\" min=\"0\" max=\"1439\" step=\"1\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"sD\">Og‘ish δ \u003coutput id=\"sDo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sD\" min=\"-90\" max=\"90\" step=\"0.5\">\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"grpHor\" hidden>\n        \u003cdiv class=\"field\">\u003clabel for=\"sAz\">Azimut A \u003coutput id=\"sAzo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sAz\" min=\"0\" max=\"359\" step=\"1\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"sH\">Balandlik h \u003coutput id=\"sHo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sH\" min=\"-90\" max=\"90\" step=\"1\">\u003c/div>\n      \u003c/div>\n      \u003ch4 style=\"margin-top:16px\">Kuzatuvchi va vaqt\u003c/h4>\n      \u003cdiv class=\"field\">\u003clabel for=\"sPhi\">Kuzatuvchi kengligi φ \u003coutput id=\"sPhio\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sPhi\" min=\"0\" max=\"90\" step=\"1\" value=\"41\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"sS\">Mahalliy yulduz vaqti s \u003coutput id=\"sSo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"sS\" min=\"0\" max=\"1439\" step=\"1\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"btn\" type=\"button\" id=\"play2\" aria-pressed=\"false\">▶ Sutkalik harakat\u003c/button>\u003c/div>\n      \u003cdiv class=\"chips\" id=\"chips2\">\u003c/div>\n      \u003cp class=\"mini\">Kuzatuvchi kengligi φ yoki vaqt s ni o‘zgartiring: \u003cb>A va h o‘zgaradi, α va δ o‘zgarmaydi\u003c/b>. s — osmon sferasi sutka davomida qanchalik burilganini bildiradi; t = s − α jismning meridiandan burchak masofasi (soat burchagi).\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cp class=\"mini prose\" style=\"margin-top:-8px\">Quyosh, Oy va sayyoraning ko‘rsatilgan koordinatalari o‘quv maqsadida taxminiy olingan.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- ===================== 3 ===================== -->\n\u003csection class=\"lesson\" id=\"l3\">\n\u003cdiv class=\"wrap\">\n  \u003ch2>3. Ekvatorial koordinatalar sistemasi\u003c/h2>\n  \u003cdiv class=\"prose\">\n    \u003cp>Gorizontal koordinatalar kuzatuvchiga bog‘liq. Yulduz katalogini tuzish uchun esa yulduzlar bilan birga aylanadigan, har joyda bir xil qiymat beradigan sistema kerak. Bunday sistema — \u003cb>ekvatorial\u003c/b>. Unda asosiy aylana sifatida osmon ekvatori olinadi.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>Yer xaritasi bilan o‘xshashlik\u003c/h3>\n  \u003cdiv class=\"prose\">\n    \u003cp>Yer sirtidagi joyni \u003cb>geografik kenglik\u003c/b> va \u003cb>geografik uzunlik\u003c/b> bilan aniqlaymiz. Osmon sferasida ham xuddi shunday: kenglikka \u003cb>og‘ish δ\u003c/b>, uzunlikka \u003cb>to‘g‘ri chiqish α\u003c/b> mos keladi.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"tbl\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Yer sirti\u003c/th>\u003cth>Osmon sferasi\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>Yer ekvatori\u003c/td>\u003ctd>Osmon ekvatori\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Shimoliy va janubiy geografik qutblar\u003c/td>\u003ctd>Shimoliy (P) va janubiy (P′) osmon qutblari\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Geografik kenglik φ (−90°…+90°)\u003c/td>\u003ctd>Og‘ish δ (−90°…+90°)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Geografik uzunlik λ (Grinvich meridianidan)\u003c/td>\u003ctd>To‘g‘ri chiqish α (γ nuqtadan o‘tuvchi doiradan)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Grinvich (nolinchi) meridiani\u003c/td>\u003ctd>Boshlang‘ich og‘ish doirasi (γ nuqtadan o‘tadi)\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n\n  \u003cp class=\"simhead\">Interaktiv animatsiya · Yer va osmon sferasi yonma-yon\u003c/p>\n  \u003cdiv class=\"pair\">\n    \u003cfigure>\u003cdiv class=\"stage-wrap\">\u003ccanvas id=\"cEarth\" tabindex=\"0\" role=\"img\" aria-label=\"Yer globusi: geografik uzunlik va kenglik\">\u003c/canvas>\u003c/div>\u003cfigcaption>Yer: λ va φ\u003c/figcaption>\u003c/figure>\n    \u003cfigure>\u003cdiv class=\"stage-wrap\">\u003ccanvas id=\"cSky\" tabindex=\"0\" role=\"img\" aria-label=\"Osmon sferasi: to‘g‘ri chiqish va og‘ish\">\u003c/canvas>\u003c/div>\u003cfigcaption>Osmon: α va δ\u003c/figcaption>\u003c/figure>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"field\">\u003clabel for=\"lam\">Uzunlik λ ↔ to‘g‘ri chiqish α \u003coutput id=\"lamo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"lam\" min=\"0\" max=\"360\" step=\"1\" value=\"69\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"lat\">Kenglik φ ↔ og‘ish δ \u003coutput id=\"lato\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"lat\" min=\"-90\" max=\"90\" step=\"1\" value=\"41\">\u003c/div>\n    \u003cdiv class=\"row\" id=\"cityRow\">\n      \u003cbutton class=\"btn\" type=\"button\" data-l=\"69.3\" data-p=\"41.3\" data-n=\"Toshkent\">Toshkent\u003c/button>\n      \u003cbutton class=\"btn\" type=\"button\" data-l=\"0\" data-p=\"51.5\" data-n=\"London (Grinvich)\">Grinvich\u003c/button>\n      \u003cbutton class=\"btn\" type=\"button\" data-l=\"286\" data-p=\"40.7\" data-n=\"Nyu-York\">Nyu-York\u003c/button>\n      \u003cbutton class=\"btn\" type=\"button\" data-l=\"316.8\" data-p=\"-22.9\" data-n=\"Rio-de-Janeyro\">Rio-de-Janeyro\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"readout\" id=\"roEarth\">\u003c/div>\n    \u003cdiv class=\"readout\" id=\"roSky\">\u003c/div>\n    \u003cp class=\"mini\">Uzunlik sharq tomonga 0°…360° o‘lchanadi. G‘arbiy uzunlikdagi shaharlar (Nyu-York, Rio) uchun α = 360° − |λ|. Globusni sichqoncha yoki barmoq bilan aylantiring — ikkala chizma birga aylanadi. Yer sharini tashqaridan ko‘rsatganimiz kabi, osmon sferasi ham tashqaridan tasvirlangan.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>Asosiy tushunchalar\u003c/h3>\n  \u003cdl class=\"terms\">\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#3fe0cc\">\u003c/i>Osmon ekvatori\u003c/dt>\u003cdd>Asosiy aylana. Yer ekvatori kabi, osmonni shimoliy va janubiy yarimsharga bo‘ladi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#8fb2ff\">\u003c/i>Osmon qutblari\u003c/dt>\u003cdd>P va P′ — ekvatordan 90° uzoqlikdagi nuqtalar, osmon sferasi aylanadigan o‘q uchlari.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#ff8196\">\u003c/i>Og‘ish doirasi\u003c/dt>\u003cdd>Osmon qutblari va jism orqali o‘tuvchi katta aylana. Yerdagi meridianga o‘xshaydi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#f5bd54\">\u003c/i>Boshlang‘ich og‘ish doirasi\u003c/dt>\u003cdd>γ nuqtadan o‘tadigan og‘ish doirasi. Grinvich meridiani Yerda sanoq boshi bo‘lgani kabi, bu doira osmonda sanoq boshi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#9cf27d\">\u003c/i>γ — bahorgi tengkunlik nuqtasi\u003c/dt>\u003cdd>Quyosh yil davomida osmon ekvatorini janubdan shimolga kesib o‘tadigan nuqta (taxminan 21-mart). To‘g‘ri chiqish shu nuqtadan boshlab sanaladi.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#9cf27d\">\u003c/i>To‘g‘ri chiqish α\u003c/dt>\u003cdd>γ nuqtadan jismning og‘ish doirasigacha osmon ekvatori bo‘ylab sharq tomon (soat strelkasiga teskari) o‘lchanadigan yoy. Qiymati 0 soatdan 24 soatgacha.\u003c/dd>\u003c/div>\n    \u003cdiv class=\"term\">\u003cdt>\u003ci style=\"background:#ffd1ea\">\u003c/i>Og‘ish δ\u003c/dt>\u003cdd>Osmon ekvatoridan jismgacha og‘ish doirasi bo‘ylab o‘lchanadigan burchak: shimolga \u003cb>+\u003c/b>, janubga \u003cb>−\u003c/b>. Ekvatorda δ = 0°, shimoliy qutbda +90°, janubiy qutbda −90°.\u003c/dd>\u003c/div>\n  \u003c/dl>\n\n  \u003ch3>O‘lchov birliklari\u003c/h3>\n  \u003cdiv class=\"prose\">\n    \u003cp>Og‘ish graduslarda ifodalanadi (1° = 60′, 1′ = 60″). To‘g‘ri chiqish esa odatda \u003cb>soat o‘lchovida\u003c/b> beriladi, chunki Yer 1 soatda 15° buriladi va osmon sferasining burilishi vaqt bilan bog‘liq.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"tbl\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Soat o‘lchovi\u003c/th>\u003cth>Gradus o‘lchovi\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>24 soat\u003c/td>\u003ctd>360°\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>1 soat\u003c/td>\u003ctd>15°\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>1 daqiqa\u003c/td>\u003ctd>15′\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>1 soniya\u003c/td>\u003ctd>15″\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"note prose\">\u003cb>Misol.\u003c/b> α = 5 soat 30 daqiqa bo‘lsa, gradusda: 5,5 × 15° = \u003cb>82,5°\u003c/b>. Demak, yulduz γ nuqtadan sharq tomon 82,5° uzoqlikda joylashgan.\u003c/div>\n\n  \u003cp class=\"simhead\">Interaktiv simulyatsiya · Ekvatorial koordinatalar\u003c/p>\n  \u003cdiv class=\"sim\">\n    \u003cdiv class=\"stage-wrap\">\n      \u003ccanvas id=\"c3\" tabindex=\"0\" role=\"img\" aria-label=\"Ekvatorial koordinatalar sferasi: yulduzning to‘g‘ri chiqishi va og‘ishi\">\u003c/canvas>\n      \u003cdiv class=\"hint\">Sferani aylantiring · sliderlarni siljiting\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003cdiv class=\"readout big\" id=\"roMain\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"mA\">To‘g‘ri chiqish α \u003coutput id=\"mAo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"mA\" min=\"0\" max=\"1439\" step=\"1\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"mD\">Og‘ish δ \u003coutput id=\"mDo\">\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"mD\" min=\"-90\" max=\"90\" step=\"1\">\u003c/div>\n      \u003ch4 style=\"margin-top:14px\">Haqiqiy yulduzlar\u003c/h4>\n      \u003cdiv class=\"row\" id=\"starRow\">\u003c/div>\n      \u003cdiv class=\"chips\" id=\"chips3\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003ch3>Ekvatorial sistemaning ahamiyati\u003c/h3>\n  \u003cul class=\"prose\">\n    \u003cli>α va δ yulduzlar bilan birga aylanadi, shuning uchun kuzatuvchi joyi va sutka vaqtiga bog‘liq emas. Yulduzlar katalogi va xaritalari shu koordinatalarda tuziladi.\u003c/li>\n    \u003cli>Teleskoplarning ekvatorial o‘rnatmasi dunyo o‘qiga qaratiladi: yulduzni kuzatish uchun faqat bitta o‘q atrofida bir tekis aylantirish yetadi.\u003c/li>\n    \u003cli>To‘g‘ri chiqish yulduz vaqti bilan bog‘liq: yulduz meridiandan o‘tayotganda yulduz vaqti uning α siga teng.\u003c/li>\n    \u003cli>Pretsessiya tufayli γ nuqta asta siljiydi (taxminan 50″ yiliga), shuning uchun kataloglarda koordinatalar qaysi davrga tegishli ekani yoziladi (masalan, J2000.0).\u003c/li>\n  \u003c/ul>\n\n  \u003ch3>Amaliy topshiriqlar\u003c/h3>\n  \u003cdiv class=\"prose\">\u003cp>Yuqoridagi simulyatsiyada sliderlar yordamida yulduzni talab qilingan joyga qo‘ying va «Tekshirish» tugmasini bosing.\u003c/p>\u003c/div>\n  \u003col class=\"tasks\" id=\"tasks\">\u003c/ol>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- ===================== quiz ===================== -->\n\u003csection class=\"lesson\" id=\"quiz\">\n\u003cdiv class=\"wrap\">\n  \u003ch2>Bilimni mustahkamlash\u003c/h2>\n  \u003cdiv id=\"quizBox\">\u003c/div>\n  \u003cdiv class=\"score\" id=\"score\" aria-live=\"polite\">\u003c/div>\n\n  \u003ch3>Dars xulosasi\u003c/h3>\n  \u003cul class=\"prose summary\">\n    \u003cli>Osmon sferasi — yo‘nalishlarni o‘rganish uchun shartli model; uning markazida kuzatuvchi turadi.\u003c/li>\n    \u003cli>Osmon qutbining balandligi kuzatuvchi kengligiga teng: h\u003csub>P\u003c/sub> = φ.\u003c/li>\n    \u003cli>Gorizontal koordinatalar (A, h) kuzatuvchiga va vaqtga bog‘liq.\u003c/li>\n    \u003cli>Ekvatorial koordinatalar: to‘g‘ri chiqish α (0…24 soat, γ nuqtadan sharqqa) va og‘ish δ (−90°…+90°). 1 soat = 15°.\u003c/li>\n  \u003c/ul>\n\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cfooter>\u003cdiv class=\"wrap\">11-sinf astronomiya · «Osmon koordinatalari» · interaktiv dars materiali\u003c/div>\u003c/footer>\n\n\u003cscript>\n(function(){\n'use strict';\nconst D2R=Math.PI/180,R2D=180/Math.PI,TAU=Math.PI*2;\nconst clamp=(x,a,b)=>Math.min(b,Math.max(a,x));\nconst mod=(x,m)=>((x%m)+m)%m;\nconst $=(s,r=document)=>r.querySelector(s);\nconst reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst UIFONT='Manrope, system-ui, -apple-system, \"Segoe UI\", sans-serif';\nconst C={teal:'#3fe0cc',amber:'#f5bd54',rose:'#ff8196',violet:'#b99bff',blue:'#8fb2ff',gold:'#ffd36b',white:'#eef1ff',lime:'#9cf27d',pink:'#ffd1ea',sky:'#a9c8ff'};\n\n/* ---------- formatting ---------- */\nfunction hm(h){const t=Math.round(mod(h,24)*60)%1440;return [Math.floor(t/60),t%60];}\nconst fmtRAhtml=h=>{const [H,M]=hm(h);return H+'\u003csup>h\u003c/sup>'+String(M).padStart(2,'0')+'\u003csup>m\u003c/sup>';};\nconst fmtRAtext=h=>{const [H,M]=hm(h);return H+' soat '+M+' daq';};\nconst fmtRAlong=h=>{const [H,M]=hm(h);return H+' soat '+M+' daqiqa';};\nconst num=(x,dec=1)=>x.toFixed(dec).replace('.',',');\nconst fmtDeg=(x,dec=0)=>{const v=Math.abs(x);const r=+v.toFixed(dec);if(r===0)return '0°';return (x\u003c0?'−':'+')+num(v,dec)+'°';};\n\n/* ---------- astronomy math (horizon frame: X east, Y north, Z up) ---------- */\nfunction eqToHor(tDeg,dDeg,phi){\n  const t=tDeg*D2R,d=dDeg*D2R,ux=Math.cos(d)*Math.cos(t),uy=Math.cos(d)*Math.sin(t),uz=Math.sin(d);\n  const sp=Math.sin(phi*D2R),cp=Math.cos(phi*D2R);\n  const S=ux*sp-uz*cp,W=uy,Z=ux*cp+uz*sp;\n  return [-W,-S,Z];\n}\nfunction horToEq(A,h,phi){\n  const a=A*D2R,hh=h*D2R,S=Math.cos(hh)*Math.cos(a),W=Math.cos(hh)*Math.sin(a),Z=Math.sin(hh);\n  const sp=Math.sin(phi*D2R),cp=Math.cos(phi*D2R);\n  const ux=S*sp+Z*cp,uy=W,uz=-S*cp+Z*sp;\n  return {t:Math.atan2(uy,ux)*R2D,d:Math.asin(clamp(uz,-1,1))*R2D};\n}\nfunction vecToAh(v){const S=-v[1],W=-v[0];return {A:mod(Math.atan2(W,S)*R2D,360),h:Math.asin(clamp(v[2],-1,1))*R2D};}\nfunction P3(a,d){const ar=a*D2R,dr=d*D2R;return [Math.cos(dr)*Math.cos(ar),Math.cos(dr)*Math.sin(ar),Math.sin(dr)];}\nfunction circ(u,v,n=96,a0=0,a1=TAU){const o=[];for(let i=0;i\u003c=n;i++){const t=a0+(a1-a0)*i/n,c=Math.cos(t),s=Math.sin(t);o.push([u[0]*c+v[0]*s,u[1]*c+v[1]*s,u[2]*c+v[2]*s]);}return o;}\nconst scale3=(p,k)=>[p[0]*k,p[1]*k,p[2]*k];\n\nfunction rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\nconst BG=(()=>{const r=rng(7),a=[];for(let i=0;i\u003c130;i++){a.push({t:r()*360,d:Math.asin(r()*2-1)*R2D,m:r()});}return a;})();\n\n/* ---------- stage engine ---------- */\nconst stages=[],hooks=[];\nconst touch=S=>{S.v=(S.v||0)+1;};\nconst wrapPi=x=>((x+Math.PI)%TAU+TAU)%TAU-Math.PI;\n\nfunction proj(st,p){\n  const r=st.rot,cy=Math.cos(r.yaw),sy=Math.sin(r.yaw),cp=Math.cos(r.pitch),sp=Math.sin(r.pitch);\n  const x1=p[0]*cy-p[1]*sy,y1=p[0]*sy+p[1]*cy,z1=p[2];\n  const y2=y1*cp-z1*sp,z2=y1*sp+z1*cp;\n  return {x:st.w/2+x1*st.scale,y:st.h/2-z2*st.scale,d:y2};\n}\n\nfunction createStage(canvas,o){\n  const st={canvas,ctx:canvas.getContext('2d'),rot:o.rot||{yaw:o.yaw!==undefined?o.yaw:0.5,pitch:o.pitch!==undefined?o.pitch:0.4,v:0,user:false,drag:false,follow:null},\n    w:300,h:300,scale:100,dpr:1,dirty:true,visible:true,q:[],hits:[],draw:o.draw,auto:o.auto||0,watch:o.watch||[],seen:[],rv:-1,onPick:o.onPick,home:{yaw:o.yaw,pitch:o.pitch}};\n  st.seen=st.watch.map(()=>-1);\n  function resize(){\n    const r=canvas.getBoundingClientRect();if(!r.width)return;\n    const dpr=Math.min(window.devicePixelRatio||1,2);\n    canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);\n    st.w=r.width;st.h=r.height;st.dpr=dpr;st.scale=Math.min(r.width,r.height)*(o.zoom||0.36);st.dirty=true;\n  }\n  new ResizeObserver(resize).observe(canvas);\n  new IntersectionObserver(es=>{st.visible=es[0].isIntersecting;if(st.visible)st.dirty=true;}).observe(canvas);\n  let drag=null;\n  canvas.addEventListener('pointerdown',e=>{\n    canvas.setPointerCapture(e.pointerId);\n    drag={x:e.clientX,y:e.clientY,moved:0,yaw:st.rot.yaw,pitch:st.rot.pitch};\n    st.rot.drag=true;st.rot.user=true;st.rot.follow=null;\n  });\n  canvas.addEventListener('pointermove',e=>{\n    if(!drag)return;\n    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));\n    st.rot.yaw=drag.yaw+dx*0.009;st.rot.pitch=clamp(drag.pitch+dy*0.009,-1.2,1.45);st.rot.v++;\n  });\n  const end=e=>{\n    if(!drag)return;\n    st.rot.drag=false;\n    if(drag.moved\u003c5&&st.onPick){const r=canvas.getBoundingClientRect();st.onPick(e.clientX-r.left,e.clientY-r.top);}\n    drag=null;\n  };\n  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);\n  canvas.addEventListener('keydown',e=>{\n    const k={ArrowLeft:[-.1,0],ArrowRight:[.1,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key];\n    if(!k)return;e.preventDefault();st.rot.user=true;st.rot.follow=null;\n    st.rot.yaw+=k[0];st.rot.pitch=clamp(st.rot.pitch+k[1],-1.2,1.45);st.rot.v++;\n  });\n  stages.push(st);return st;\n}\n\nlet lastT=performance.now();\nfunction frame(now){\n  const dt=Math.min(64,now-lastT);lastT=now;\n  for(const h of hooks)h(dt);\n  for(const st of stages){\n    const r=st.rot;\n    if(st.visible){\n      if(st.auto&&!r.user&&!reduce&&r.at!==now){r.at=now;r.yaw+=st.auto*dt;r.v++;}\n      if(r.follow!==null&&!r.drag&&r.fAt!==now){\n        r.fAt=now;const d=wrapPi(r.follow-r.yaw);r.yaw+=d*(reduce?1:Math.min(1,dt/170));\n        if(Math.abs(d)\u003c0.003)r.follow=null;r.v++;\n      }\n      if(st.rv!==r.v){st.rv=r.v;st.dirty=true;}\n      for(let i=0;i\u003cst.watch.length;i++){if(st.watch[i].v!==st.seen[i]){st.seen[i]=st.watch[i].v;st.dirty=true;}}\n      if(st.dirty&&st.w>0){st.dirty=false;render(st);}\n    }\n  }\n  requestAnimationFrame(frame);\n}\nfunction render(st){\n  st.ctx.setTransform(st.dpr,0,0,st.dpr,0,0);st.q=[];st.hits=[];st.draw(st);\n}\nfunction flushLayer(st,l){for(const it of st.q)if(it[0]===l)it[1]();}\n\n/* ---------- drawing primitives ---------- */\nfunction curve(st,pts,color,lw,o={}){\n  const P=pts.map(p=>proj(st,p)),ctx=st.ctx;\n  const seg=back=>()=>{\n    ctx.save();ctx.beginPath();let pen=false;\n    for(let i=0;i\u003cP.length-1;i++){\n      const a=P[i],b=P[i+1],isBack=(a.d+b.d)/2>0;\n      if(isBack!==back){pen=false;continue;}\n      if(!pen){ctx.moveTo(a.x,a.y);pen=true;}\n      ctx.lineTo(b.x,b.y);\n    }\n    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';\n    ctx.globalAlpha=(o.alpha===undefined?1:o.alpha)*(back?0.3:1);\n    ctx.setLineDash(back?[3,5]:(o.dash||[]));\n    if(o.glow&&!back){ctx.shadowColor=color;ctx.shadowBlur=10;}\n    ctx.stroke();ctx.restore();\n  };\n  st.q.push([0,seg(true)]);st.q.push([1,seg(false)]);\n}\nfunction fillPoly(st,pts,color){\n  const P=pts.map(p=>proj(st,p)),ctx=st.ctx;\n  st.q.push([0,()=>{ctx.save();ctx.beginPath();P.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}]);\n}\nfunction dot(st,p,color,r,o={}){\n  const q=proj(st,p),ctx=st.ctx;\n  st.q.push([q.d>0?0:1,()=>{ctx.save();ctx.globalAlpha=q.d>0?0.45:1;ctx.fillStyle=color;\n    if(o.glow){ctx.shadowColor=color;ctx.shadowBlur=12;}\n    ctx.beginPath();ctx.arc(q.x,q.y,r,0,TAU);ctx.fill();ctx.restore();}]);\n  return q;\n}\nfunction label(st,text,p,o={}){\n  const q=proj(st,p),ctx=st.ctx;\n  st.q.push([2,()=>{\n    ctx.save();ctx.font=(o.weight||700)+' '+(o.size||12)+'px '+UIFONT;\n    const w=ctx.measureText(text).width;\n    const right=o.side?o.side==='r':q.x>=st.w/2,off=o.dx!==undefined?o.dx:9;\n    let x=q.x+(right?off:-off),y=q.y+(o.dy!==undefined?o.dy:-9);\n    ctx.textAlign=right?'left':'right';\n    if(right&&x+w>st.w-4)x=st.w-4-w;\n    if(!right&&x-w\u003c4)x=4+w;\n    y=clamp(y,14,st.h-6);\n    ctx.globalAlpha=q.d>0?0.55:1;ctx.lineJoin='round';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(6,9,26,.92)';\n    ctx.strokeText(text,x,y);ctx.fillStyle=o.color||C.white;ctx.fillText(text,x,y);ctx.restore();\n  }]);\n}\nfunction shell(st,fill){\n  st.q.push([0,()=>{\n    const ctx=st.ctx,cx=st.w/2,cy=st.h/2,R=st.scale;\n    if(fill!==false){const g=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,'rgba(120,150,255,.17)');g.addColorStop(1,'rgba(60,80,200,.03)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();}\n    ctx.strokeStyle='rgba(150,172,255,.55)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();\n  }]);\n}\nfunction star5(ctx,x,y,R,r){ctx.beginPath();for(let i=0;i\u003c10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}\nfunction icon(ctx,kind,x,y,R){\n  ctx.save();\n  if(kind==='star'){ctx.shadowColor=C.gold;ctx.shadowBlur=12;ctx.fillStyle=C.gold;star5(ctx,x,y,R*1.15,R*.5);ctx.fill();}\n  else if(kind==='sun'){ctx.shadowColor='#ffb43a';ctx.shadowBlur=14;ctx.fillStyle='#ffb43a';ctx.strokeStyle='#ffb43a';ctx.lineWidth=1.8;\n    ctx.beginPath();ctx.arc(x,y,R*.58,0,TAU);ctx.fill();\n    for(let i=0;i\u003c8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*R*.85,y+Math.sin(a)*R*.85);ctx.lineTo(x+Math.cos(a)*R*1.2,y+Math.sin(a)*R*1.2);ctx.stroke();}}\n  else if(kind==='moon'){ctx.beginPath();ctx.rect(x-3*R,y-3*R,6*R,6*R);ctx.arc(x+R*.5,y-R*.3,R*.78,0,TAU);ctx.clip('evenodd');\n    ctx.beginPath();ctx.arc(x,y,R*.92,0,TAU);ctx.fillStyle='#eef1ff';ctx.fill();}\n  else if(kind==='planet'){ctx.fillStyle='#e49a6a';ctx.beginPath();ctx.arc(x,y,R*.6,0,TAU);ctx.fill();\n    ctx.strokeStyle='#f3d7a8';ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(x,y,R*1.15,R*.38,-0.45,0,TAU);ctx.stroke();}\n  ctx.restore();\n}\nfunction arrowHead(st,p0,p1,color){\n  const q0=proj(st,p0),q1=proj(st,p1),ctx=st.ctx;\n  st.q.push([1,()=>{const ang=Math.atan2(q1.y-q0.y,q1.x-q0.x);ctx.save();ctx.translate(q1.x,q1.y);ctx.rotate(ang);ctx.fillStyle=color;\n    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-6,-5.5);ctx.lineTo(-6,5.5);ctx.closePath();ctx.fill();ctx.restore();}]);\n}\n\n/* ---------- horizon world (sections 1, 2 and hero) ---------- */\nfunction drawHorizon(st,S){\n  const ctx=st.ctx;ctx.clearRect(0,0,st.w,st.h);\n  const F=S.flags,phi=S.phi,ph=phi*D2R,c=Math.cos(ph),s=Math.sin(ph);\n  const foc=k=>S.focus===k,lw=(k,b)=>foc(k)?b+1.8:b;\n  const NP=[0,c,s],SP=[0,-c,-s],labels=S.labels!==false;\n  if(F.sfera)shell(st);\n  st.q.push([0,()=>{\n    ctx.save();\n    for(const b of BG){const p=eqToHor(b.t+S.phase,b.d,phi),q=proj(st,p);\n      ctx.globalAlpha=(p[2]\u003c0?.25:.85)*(q.d>0?.6:1)*(0.4+b.m*0.6);ctx.fillStyle='#dfe6ff';ctx.fillRect(q.x,q.y,1+b.m*1.2,1+b.m*1.2);}\n    ctx.restore();\n  }]);\n  if(F.gorizont){const hz=circ([1,0,0],[0,1,0]);fillPoly(st,hz,'rgba(245,189,84,.08)');curve(st,hz,C.amber,lw('gorizont',1.8),{glow:foc('gorizont')});}\n  if(F.ekvator)curve(st,circ([1,0,0],[0,s,-c]),C.teal,lw('ekvator',1.9),{glow:foc('ekvator')});\n  if(F.meridian)curve(st,circ([0,1,0],[0,0,1]),C.rose,lw('meridian',1.9),{glow:foc('meridian')});\n  if(F.qutblar)curve(st,[scale3(NP,-1.18),scale3(NP,1.18)],C.blue,lw('qutblar',1.4),{dash:[6,5],alpha:.85});\n  if(F.zenit||F.nadir)curve(st,[[0,0,-1],[0,0,1]],C.violet,lw(F.zenit?'zenit':'nadir',1.2),{dash:[2,4],alpha:.75});\n  if(F.yulduz){\n    const dM=35,tM=40+S.phase;\n    const par=[];for(let i=0;i\u003c=120;i++)par.push(eqToHor(i*3,dM,phi));\n    curve(st,par,C.gold,1.3,{dash:[5,5],alpha:.75});\n    const p=eqToHor(tM,dM,phi);dot(st,p,C.gold,5.5,{glow:true});\n    if(labels)label(st,'Yulduz M',p,{color:C.gold,dy:-10});\n  }\n  const Re=0.27;\n  const earthFn=()=>{\n    if(!F.yer)return;\n    const cx=st.w/2,cy=st.h/2,R=Re*st.scale;ctx.save();\n    const g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);\n    g.addColorStop(0,'#5aa0ff');g.addColorStop(.6,'#2459b8');g.addColorStop(1,'#0e2a63');\n    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();\n    ctx.strokeStyle='rgba(180,210,255,.5)';ctx.lineWidth=1;ctx.stroke();ctx.restore();\n  };\n  if(F.yer){\n    const eq=circ([Re,0,0],[0,Re*s,-Re*c],72),P=eq.map(p=>proj(st,p));\n    st.q.push([1,()=>{ctx.save();ctx.beginPath();let pen=false;\n      for(let i=0;i\u003cP.length-1;i++){if((P[i].d+P[i+1].d)/2>0){pen=false;continue;}if(!pen){ctx.moveTo(P[i].x,P[i].y);pen=true;}ctx.lineTo(P[i+1].x,P[i+1].y);}\n      ctx.strokeStyle=C.teal;ctx.lineWidth=1.6;ctx.stroke();ctx.restore();}]);\n    curve(st,[scale3(NP,Re),scale3(NP,0.42)],'#cfe0ff',1.4);\n    curve(st,[scale3(SP,Re),scale3(SP,0.42)],'#cfe0ff',1.4);\n  }\n  if(F.kuzatuvchi){\n    const O=[0,0,Re],H=[0,0,Re+0.11],qo=proj(st,O),qh=proj(st,H);\n    st.q.push([1,()=>{ctx.save();ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.lineCap='round';\n      if(foc('kuzatuvchi')){ctx.shadowColor='#fff';ctx.shadowBlur=12;}\n      ctx.beginPath();ctx.moveTo(qo.x,qo.y);ctx.lineTo(qh.x,qh.y);ctx.stroke();\n      ctx.beginPath();ctx.arc(qh.x,qh.y,3.4,0,TAU);ctx.fill();ctx.restore();}]);\n    if(labels)label(st,'Kuzatuvchi',[0,0,Re+0.12],{color:'#fff',size:11,side:'r',dy:-4});\n  }\n  const big=k=>foc(k)?7:4.5;\n  if(F.zenit){dot(st,[0,0,1],C.violet,big('zenit'),{glow:foc('zenit')});if(labels)label(st,'Zenit (Z)',[0,0,1],{color:C.violet,dy:-10});}\n  if(F.nadir){dot(st,[0,0,-1],C.violet,big('nadir'),{glow:foc('nadir')});if(labels)label(st,'Nadir (Z′)',[0,0,-1],{color:C.violet,dy:16});}\n  if(F.qutblar){\n    dot(st,NP,C.blue,big('qutblar'),{glow:foc('qutblar')});dot(st,SP,C.blue,big('qutblar'),{glow:foc('qutblar')});\n    if(labels){label(st,'P (shimoliy qutb)',NP,{color:C.blue,dy:-10});label(st,'P′ (janubiy qutb)',SP,{color:C.blue,dy:16});}\n  }\n  if(F.gorizont&&labels&&S.cardinal!==false){\n    [['shimol',[0,1,0]],['janub',[0,-1,0]],['sharq',[1,0,0]],['g‘arb',[-1,0,0]]].forEach(([n,p])=>{\n      dot(st,p,C.amber,3);label(st,n,p,{color:C.amber,size:11,weight:600,dy:14});});\n  }\n  if(S.extra)S.extra(st);\n  flushLayer(st,0);earthFn();flushLayer(st,1);flushLayer(st,2);\n}\n\n/* ---------- Hero ---------- */\nconst HERO={phi:41,phase:0,labels:false,focus:null,v:0,flags:{yer:true,kuzatuvchi:true,sfera:true,ekvator:true,qutblar:true,gorizont:true,meridian:true,zenit:true,nadir:false,yulduz:true}};\ncreateStage($('#cHero'),{yaw:0.5,pitch:0.4,auto:0.00011,zoom:0.4,watch:[HERO],draw:st=>drawHorizon(st,HERO)});\nhooks.push(dt=>{if(!reduce){HERO.phase=(HERO.phase+dt*0.004)%360;touch(HERO);}});\n\n/* ---------- chips ---------- */\nfunction buildChips(el,items,S,defEl){\n  items.forEach(it=>{\n    const lab=document.createElement('label');lab.className='chip';\n    lab.innerHTML='\u003cinput type=\"checkbox\"'+(S.flags[it.k]?' checked':'')+'>\u003cspan class=\"sw\" style=\"background:'+it.c+'\">\u003c/span>'+it.n;\n    const inp=lab.querySelector('input');\n    inp.addEventListener('change',()=>{\n      S.flags[it.k]=inp.checked;S.focus=it.d?it.k:null;\n      if(it.d&&defEl)defEl.innerHTML='\u003cstrong>'+it.n+'\u003c/strong>'+it.d;\n      touch(S);\n    });\n    el.appendChild(lab);\n  });\n}\n\n/* ---------- Section 1 ---------- */\nconst S1={phi:41,phase:0,v:0,playing:false,focus:null,labels:true,flags:{yer:true,kuzatuvchi:true,sfera:true,ekvator:true,qutblar:true,gorizont:true,meridian:true,zenit:true,nadir:true,yulduz:true}};\nconst st1=createStage($('#c1'),{yaw:0.55,pitch:0.4,watch:[S1],draw:st=>drawHorizon(st,S1)});\nhooks.push(dt=>{if(S1.playing){S1.phase=(S1.phase+dt*0.009)%360;touch(S1);}});\nbuildChips($('#chips1'),[\n  {k:'yer',n:'Yer',c:'#5aa0ff',d:'Yer sfera markazida nuqtadek kichik. Rasmda ko‘rinishi uchun kattalashtirib chizilgan.'},\n  {k:'kuzatuvchi',n:'Kuzatuvchi',c:'#ffffff',d:'Kuzatuvchi Yer sirtida turadi, lekin yulduzlargacha masofa juda katta bo‘lgani uchun uni sfera markazida deb hisoblaymiz.'},\n  {k:'sfera',n:'Osmon sferasi',c:'#96acff',d:'Markazi kuzatuvchida bo‘lgan xayoliy sfera. Radiusi ixtiyoriy: muhimi — jismga yo‘nalish.'},\n  {k:'ekvator',n:'Osmon ekvatori',c:C.teal,d:'Dunyo o‘qiga perpendikulyar katta aylana. Gorizontni sharq va g‘arb nuqtalarida kesadi.'},\n  {k:'qutblar',n:'Osmon qutblari',c:C.blue,d:'Dunyo o‘qining sferani kesish nuqtalari: shimoliy P va janubiy P′. Shimoliy qutb Qutb yulduzi yaqinida.'},\n  {k:'gorizont',n:'Matematik gorizont',c:C.amber,d:'Otves chizig‘iga perpendikulyar, markazdan o‘tuvchi katta aylana. Osmonni ko‘rinadigan va ko‘rinmaydigan yarim sharga ajratadi.'},\n  {k:'meridian',n:'Meridian',c:C.rose,d:'Zenit, nadir va osmon qutblaridan o‘tuvchi katta aylana. Gorizontni shimol va janub nuqtalarida kesadi.'},\n  {k:'zenit',n:'Zenit',c:C.violet,d:'Kuzatuvchi boshi tepasidagi nuqta (otves chizig‘ining yuqoridagi davomi).'},\n  {k:'nadir',n:'Nadir',c:C.violet,d:'Zenitga qarama-qarshi nuqta, kuzatuvchi oyog‘i ostida.'},\n  {k:'yulduz',n:'Yulduz va uning yo‘li',c:C.gold,d:'Yulduz sutkalik aylanishda osmon ekvatoriga parallel kichik aylana chizadi. Uning o‘rnini ikki burchak bilan aniqlash mumkin.'}\n],S1,$('#def1'));\nfunction setPhi1(v){S1.phi=v;$('#phi1').value=v;$('#phi1o').textContent='φ = '+v+'°, qutb balandligi h = '+v+'°';touch(S1);}\n$('#phi1').addEventListener('input',e=>setPhi1(+e.target.value));\ndocument.querySelectorAll('#phiPresets .btn').forEach(b=>b.addEventListener('click',()=>setPhi1(+b.dataset.phi)));\nsetPhi1(41);\n$('#play1').addEventListener('click',e=>{S1.playing=!S1.playing;S1.flags.yulduz=true;e.currentTarget.setAttribute('aria-pressed',S1.playing);e.currentTarget.textContent=(S1.playing?'❚❚ ':'▶ ')+'Sutkalik aylanish';touch(S1);});\n$('#reset1').addEventListener('click',()=>{st1.rot.yaw=0.55;st1.rot.pitch=0.4;st1.rot.follow=null;st1.rot.v++;});\n\n/* ---------- Section 2 ---------- */\nconst bodies=[\n  {id:'star',name:'Yulduz A',kind:'star',icon:'⭐',a:18.617,d:38.8},\n  {id:'sun',name:'Quyosh',kind:'sun',icon:'☀️',a:12.87,d:-5.1},\n  {id:'moon',name:'Oy',kind:'moon',icon:'🌙',a:3.33,d:18},\n  {id:'planet',name:'Sayyora',kind:'planet',icon:'🪐',a:1.67,d:9}\n];\nconst S2={phi:41,s:21,phase:315,v:0,sel:'star',mode:'eq',playing:false,focus:null,labels:true,cardinal:true,\n  flags:{yer:true,kuzatuvchi:true,sfera:true,ekvator:true,qutblar:false,gorizont:true,meridian:true,zenit:true,nadir:false,yulduz:false,hor:true,eq:true}};\nconst selBody=()=>bodies.find(b=>b.id===S2.sel);\nconst bodyVec=b=>eqToHor(S2.s*15-b.a*15,b.d,S2.phi);\n\nfunction s2extra(st){\n  const ctx=st.ctx,ph=S2.phi,sel=selBody(),sv=bodyVec(sel),ah=vecToAh(sv);\n  if(S2.flags.hor){\n    const A=ah.A*D2R,nA=Math.max(2,Math.ceil(ah.A/4)),arcA=[];\n    for(let i=0;i\u003c=nA;i++){const th=A*i/nA;arcA.push([-Math.sin(th),-Math.cos(th),0]);}\n    curve(st,arcA,'#ffffff',3,{glow:true});\n    const hr=ah.h*D2R,nh=Math.max(2,Math.ceil(Math.abs(ah.h)/4)),arcH=[];\n    for(let i=0;i\u003c=nh;i++){const e=hr*i/nh;arcH.push([-Math.cos(e)*Math.sin(A),-Math.cos(e)*Math.cos(A),Math.sin(e)]);}\n    curve(st,arcH,C.sky,3,{glow:true});\n    dot(st,[-Math.sin(A),-Math.cos(A),0],'#fff',3.2);\n    label(st,'A',arcA[Math.floor(arcA.length/2)],{color:'#fff',size:14,dy:16});\n    label(st,'h',arcH[Math.floor(arcH.length/2)],{color:C.sky,size:14,dx:8});\n  }\n  if(S2.flags.eq){\n    const tg=S2.s*15,al=sel.a*15,n=Math.max(2,Math.ceil(al/4)),arcAl=[];\n    for(let i=0;i\u003c=n;i++)arcAl.push(eqToHor(tg-al*i/n,0,ph));\n    curve(st,arcAl,C.lime,3,{glow:true});\n    const t=tg-al,nd=Math.max(2,Math.ceil(Math.abs(sel.d)/4)),arcD=[];\n    for(let i=0;i\u003c=nd;i++)arcD.push(eqToHor(t,sel.d*i/nd,ph));\n    curve(st,arcD,C.pink,3,{glow:true});\n    const g=eqToHor(tg,0,ph);dot(st,g,C.lime,4);label(st,'γ',g,{color:C.lime,size:15});\n    label(st,'α',arcAl[Math.floor(arcAl.length/2)],{color:C.lime,size:14,dy:16});\n    label(st,'δ',arcD[Math.floor(arcD.length/2)],{color:C.pink,size:14,dx:8});\n  }\n  for(const b of bodies){\n    const v=bodyVec(b),q=proj(st,v),below=v[2]\u003c0;\n    st.hits.push({id:b.id,x:q.x,y:q.y});\n    st.q.push([2,()=>{ctx.save();ctx.globalAlpha=(below?0.5:1)*(q.d>0?0.8:1);\n      if(b.id===S2.sel){ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(q.x,q.y,18,0,TAU);ctx.stroke();ctx.setLineDash([]);}\n      icon(ctx,b.kind,q.x,q.y,10);ctx.restore();}]);\n    if(b.id===S2.sel)label(st,b.name,v,{color:'#fff',size:12,dy:-24});\n  }\n}\nS2.extra=s2extra;\nconst st2=createStage($('#c2'),{yaw:0.35,pitch:0.42,watch:[S2],draw:st=>drawHorizon(st,S2),\n  onPick:(x,y)=>{let best=null,bd=28;for(const h of st2.hits){const d=Math.hypot(h.x-x,h.y-y);if(d\u003cbd){bd=d;best=h;}}if(best)selectBody(best.id);}});\n\nconst bodiesEl=$('#bodies2');\nbodies.forEach(b=>{const btn=document.createElement('button');btn.type='button';btn.className='btn';btn.dataset.id=b.id;btn.innerHTML='\u003cspan aria-hidden=\"true\">'+b.icon+'\u003c/span>'+b.name;btn.addEventListener('click',()=>selectBody(b.id));bodiesEl.appendChild(btn);});\nbuildChips($('#chips2'),[\n  {k:'hor',n:'Gorizontal koordinatalar (A, h)',c:'#ffffff'},\n  {k:'eq',n:'Ekvatorial koordinatalar (α, δ)',c:C.lime},\n  {k:'gorizont',n:'Gorizont',c:C.amber},\n  {k:'meridian',n:'Meridian',c:C.rose},\n  {k:'ekvator',n:'Osmon ekvatori',c:C.teal}\n],S2,null);\n\nconst el=id=>document.getElementById(id);\nfunction flash(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}\nfunction upd2(fl){\n  const sel=selBody(),v=bodyVec(sel),ah=vecToAh(v),t=mod(S2.s*15-sel.a*15,360);\n  el('selName').textContent=sel.icon+' Tanlangan obyekt: '+sel.name;\n  el('vA').textContent=num(ah.A,1)+'°';\n  el('vh').textContent=fmtDeg(ah.h,1)+(ah.h\u003c0?' (gorizont ostida)':'');\n  el('vAlpha').innerHTML=fmtRAhtml(sel.a)+' ('+num(sel.a*15,1)+'°)';\n  el('vDelta').textContent=fmtDeg(sel.d,1);\n  el('vt').innerHTML=fmtRAhtml(t/15);\n  el('sA').value=Math.round(mod(sel.a,24)*60)%1440;el('sAo').textContent=fmtRAlong(sel.a);\n  el('sD').value=Math.round(sel.d*2)/2;el('sDo').textContent=fmtDeg(sel.d,1);\n  el('sAz').value=Math.round(ah.A)%360;el('sAzo').textContent=num(ah.A,0)+'°';\n  el('sH').value=Math.round(ah.h);el('sHo').textContent=fmtDeg(ah.h,0);\n  el('sPhi').value=S2.phi;el('sPhio').textContent=S2.phi+'°';\n  el('sS').value=Math.round(mod(S2.s,24)*60)%1440;el('sSo').textContent=fmtRAlong(S2.s);\n  bodiesEl.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.id===S2.sel));\n  if(fl==='h')flash(el('cardH'));if(fl==='e')flash(el('cardE'));\n  S2.phase=S2.s*15;touch(S2);\n}\nfunction selectBody(id){S2.sel=id;upd2();}\nel('sA').addEventListener('input',e=>{selBody().a=+e.target.value/60;upd2('e');});\nel('sD').addEventListener('input',e=>{selBody().d=+e.target.value;upd2('e');});\nfunction fromHor(A,h){const r=horToEq(A,h,S2.phi),b=selBody();b.d=r.d;b.a=mod((S2.s*15-r.t)/15,24);upd2('e');}\nel('sAz').addEventListener('input',e=>{fromHor(+e.target.value,vecToAh(bodyVec(selBody())).h);});\nel('sH').addEventListener('input',e=>{fromHor(vecToAh(bodyVec(selBody())).A,+e.target.value);});\nel('sPhi').addEventListener('input',e=>{S2.phi=+e.target.value;upd2('h');});\nel('sS').addEventListener('input',e=>{S2.s=+e.target.value/60;upd2('h');});\nfunction setMode(m){S2.mode=m;el('grpEq').hidden=m!=='eq';el('grpHor').hidden=m!=='hor';\n  el('modeEq').setAttribute('aria-pressed',m==='eq');el('modeHor').setAttribute('aria-pressed',m==='hor');}\nel('modeEq').addEventListener('click',()=>setMode('eq'));el('modeHor').addEventListener('click',()=>setMode('hor'));\nel('play2').addEventListener('click',e=>{S2.playing=!S2.playing;e.currentTarget.setAttribute('aria-pressed',S2.playing);e.currentTarget.textContent=(S2.playing?'❚❚ ':'▶ ')+'Sutkalik harakat';});\nhooks.push(dt=>{if(S2.playing){S2.s=mod(S2.s+dt/1000*0.4,24);upd2();}});\nupd2();\n\n/* ---------- Section 3: coordinate sphere (earth / sky / main) ---------- */\nfunction drawCoord(st,S,mode){\n  const ctx=st.ctx;ctx.clearRect(0,0,st.w,st.h);\n  const E=mode==='earth',MN=mode==='main';\n  const a=MN?S.a:S.a,d=S.d;\n  const grid=E?'rgba(255,255,255,.32)':'rgba(150,172,255,.26)';\n  if(E){\n    st.q.push([0,()=>{const cx=st.w/2,cy=st.h/2,R=st.scale;const g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);\n      g.addColorStop(0,'#4e92f0');g.addColorStop(.65,'#1f4fae');g.addColorStop(1,'#0b2459');\n      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();ctx.strokeStyle='rgba(190,215,255,.6)';ctx.lineWidth=1.3;ctx.stroke();}]);\n  }else shell(st);\n  if(S.grid!==false){\n    for(const dd of [-60,-30,30,60]){const r=Math.cos(dd*D2R),z=Math.sin(dd*D2R);\n      curve(st,circ([r,0,0],[0,r,0],72).map(p=>[p[0],p[1],z]),grid,1);}\n    for(let k=0;k\u003c12;k++){const pts=[];for(let i=0;i\u003c=36;i++)pts.push(P3(k*30,-90+i*5));curve(st,pts,grid,1);}\n  }\n  curve(st,circ([1,0,0],[0,0,1],96),C.amber,2.4,{glow:true});\n  curve(st,circ([1,0,0],[0,1,0],96),C.teal,2.6,{glow:true});\n  const fullD=circ(P3(a,0),[0,0,1],96);curve(st,fullD,C.rose,1.3,{alpha:.55});\n  const half=[];for(let i=0;i\u003c=36;i++)half.push(P3(a,-90+i*5));curve(st,half,C.rose,2.2);\n  if(MN){\n    for(let k=0;k\u003c24;k++){const p=P3(k*15,0);curve(st,[p,scale3(p,1.04)],C.teal,1.2);}\n    for(let k=0;k\u003c24;k+=3)label(st,k+'h',scale3(P3(k*15,0),1.13),{color:C.teal,size:11,weight:600,dx:2,dy:4});\n    arrowHead(st,P3(-50,0),P3(-42,0),C.lime);\n    label(st,'α o‘sish yo‘nalishi',P3(-46,0),{color:C.lime,size:11,weight:600,dy:16});\n  }\n  if(a>0.3){const n=Math.max(3,Math.ceil(a/4)),arc=[];for(let i=0;i\u003c=n;i++)arc.push(P3(a*i/n,0));\n    curve(st,arc,C.lime,4,{glow:true});if(a>6)arrowHead(st,P3(a-4,0),P3(a,0),C.lime);\n    label(st,E?'λ':'α',P3(a/2,0),{color:C.lime,size:16,dy:18});}\n  const foot=P3(a,0),pt=P3(a,d);\n  if(Math.abs(d)>0.3){const n=Math.max(3,Math.ceil(Math.abs(d)/4)),arc=[];for(let i=0;i\u003c=n;i++)arc.push(P3(a,d*i/n));\n    curve(st,arc,C.pink,4,{glow:true});label(st,E?'φ':'δ',P3(a,d/2),{color:C.pink,size:16,dx:10});}\n  dot(st,foot,C.lime,3.5);\n  const poleN=MN?'P (shimoliy osmon qutbi)':(E?'Shimoliy qutb':'P');\n  const poleS=MN?'P′ (janubiy osmon qutbi)':(E?'Janubiy qutb':'P′');\n  dot(st,[0,0,1],C.blue,4.5);dot(st,[0,0,-1],C.blue,4.5);\n  label(st,poleN,[0,0,1],{color:C.blue,dy:-10});label(st,poleS,[0,0,-1],{color:C.blue,dy:16});\n  const g0=[1,0,0];dot(st,g0,C.amber,4.5);\n  label(st,E?'Grinvich':(MN?'γ (bahorgi tengkunlik nuqtasi)':'γ'),g0,{color:C.amber,size:12,dy:16});\n  if(E){\n    const q=proj(st,pt);st.q.push([2,()=>{if(q.d>0.15)return;ctx.save();ctx.fillStyle='#ff4d5e';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,7,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}]);\n    if(S.city)label(st,S.city,pt,{color:'#fff',size:12,dy:-12});\n  }else{\n    const q=proj(st,pt);st.q.push([2,()=>{ctx.save();ctx.globalAlpha=q.d>0?0.6:1;icon(ctx,'star',q.x,q.y,10);ctx.restore();}]);\n    label(st,'Yulduz',pt,{color:C.gold,size:12,dy:-14});\n    if(!MN)dot(st,[0,0,0],'#5aa0ff',5);\n  }\n  if(MN){\n    st.q.push([2,()=>{ctx.save();ctx.font='800 15px '+UIFONT;ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(6,9,26,.9)';\n      const t1='α = '+fmtRAtext(S.ta/15),t2='δ = '+fmtDeg(S.td,0);\n      ctx.strokeText(t1,12,24);ctx.strokeText(t2,12,45);ctx.fillStyle=C.lime;ctx.fillText(t1,12,24);ctx.fillStyle=C.pink;ctx.fillText(t2,12,45);ctx.restore();}]);\n  }\n  flushLayer(st,0);flushLayer(st,1);flushLayer(st,2);\n}\nfunction ease(S,pairs,dt){\n  const k=reduce?1:1-Math.exp(-dt/120);let ch=false;\n  for(const [c,t,w] of pairs){\n    let df=S[t]-S[c];if(w)df=((df+180)%360+360)%360-180;\n    if(Math.abs(df)>0.004){S[c]+=df*k;if(w)S[c]=mod(S[c],360);ch=true;}\n    else if(S[c]!==S[t]){S[c]=S[t];ch=true;}\n  }\n  if(ch)touch(S);\n}\nconst yawFor=a=>-Math.PI/2-(a*D2R)/2;\n\n/* analogy */\nconst A3={a:69.3,d:41.3,ta:69.3,td:41.3,v:0,city:'Toshkent'};\nconst rot3={yaw:yawFor(69.3),pitch:0.35,v:0,user:false,drag:false,follow:null};\ncreateStage($('#cEarth'),{rot:rot3,watch:[A3],draw:st=>drawCoord(st,A3,'earth'),zoom:0.38});\ncreateStage($('#cSky'),{rot:rot3,watch:[A3],draw:st=>drawCoord(st,A3,'sky'),zoom:0.38});\nhooks.push(dt=>ease(A3,[['a','ta',true],['d','td',false]],dt));\nfunction lonText(l){l=Math.round(l);return l===0?'0° (Grinvich meridiani)':(l\u003c=180?l+'° sharqiy uzunlik':(360-l)+'° g‘arbiy uzunlik');}\nfunction latText(p){p=Math.round(p);return p===0?'0° (ekvator)':(p>0?p+'° shimoliy kenglik':(-p)+'° janubiy kenglik');}\nfunction setA3(l,p,city){\n  A3.ta=mod(l,360);A3.td=clamp(p,-90,90);A3.city=city||'';rot3.follow=yawFor(A3.ta);rot3.user=false;\n  el('lam').value=Math.round(A3.ta);el('lat').value=Math.round(A3.td);\n  el('lamo').textContent=Math.round(A3.ta)+'°';el('lato').textContent=fmtDeg(A3.td,0);\n  el('roEarth').innerHTML='\u003cspan class=\"l\">Yer:\u003c/span> λ = '+lonText(A3.ta)+', φ = '+latText(A3.td)+(city?' · '+city:'');\n  el('roSky').innerHTML='\u003cspan class=\"l\">Osmon:\u003c/span> α = '+fmtRAlong(A3.ta/15)+' ('+num(A3.ta,1)+'°), δ = '+fmtDeg(A3.td,0);\n  touch(A3);\n}\nel('lam').addEventListener('input',e=>setA3(+e.target.value,A3.td,''));\nel('lat').addEventListener('input',e=>setA3(A3.ta,+e.target.value,''));\ndocument.querySelectorAll('#cityRow .btn').forEach(b=>b.addEventListener('click',()=>setA3(+b.dataset.l,+b.dataset.p,b.dataset.n)));\nsetA3(69.3,41.3,'Toshkent');\n\n/* main equatorial simulation */\nconst M={a:82.5,d:20,ta:82.5,td:20,v:0,grid:true};\nconst rotM={yaw:yawFor(82.5),pitch:0.36,v:0,user:false,drag:false,follow:null};\nconst stM=createStage($('#c3'),{rot:rotM,watch:[M],draw:st=>drawCoord(st,M,'main'),zoom:0.34});\nhooks.push(dt=>ease(M,[['a','ta',true],['d','td',false]],dt));\nfunction setM(aDeg,d,follow){\n  M.ta=mod(aDeg,360);M.td=clamp(d,-90,90);\n  if(follow!==false){rotM.follow=yawFor(M.ta);}\n  el('mA').value=Math.round(M.ta/15*60)%1440;el('mD').value=Math.round(M.td);\n  el('mAo').textContent=fmtRAlong(M.ta/15);el('mDo').textContent=fmtDeg(M.td,0);\n  el('roMain').innerHTML='α = '+fmtRAhtml(M.ta/15)+' \u003cspan class=\"l\">('+num(M.ta,1)+'°)\u003c/span>\u003cbr>δ = '+fmtDeg(M.td,0);\n  touch(M);\n}\nel('mA').addEventListener('input',e=>setM(+e.target.value/60*15,M.td));\nel('mD').addEventListener('input',e=>setM(M.ta,+e.target.value));\nconst stars=[['Sirius',6+45/60,-16.7],['Betelgeyze',5+55/60,7.4],['Rigel',5+14/60,-8.2],['Aldebaran',4+36/60,16.5],['Arktur',14+16/60,19.2],['Vega',18+37/60,38.8],['Altair',19+51/60,8.9],['Deneb',20+41/60,45.3],['Qutb yulduzi',2+32/60,89.3]];\nstars.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=s[0];b.addEventListener('click',()=>setM(s[1]*15,s[2]));el('starRow').appendChild(b);});\nbuildChips($('#chips3'),[{k:'grid',n:'Koordinata to‘ri',c:'rgba(150,172,255,.8)'}],{flags:{grid:true},get focus(){return null;},set focus(v){},get v(){return M.v;},set v(x){M.v=x;}},null);\n$('#chips3').querySelector('input').addEventListener('change',e=>{M.grid=e.target.checked;touch(M);});\nsetM(5.5*15,20,true);\nrotM.yaw=yawFor(82.5);\n\n/* tasks */\nconst tasks=[\n  {t:'Yulduzni osmon ekvatoriga qo‘ying, to‘g‘ri chiqishi 12 soat bo‘lsin: α = 12 soat, δ = 0°.',ok:(a,d)=>Math.abs(a-12)\u003c=0.25&&Math.abs(d)\u003c=2},\n  {t:'Yulduzni shimoliy osmon qutbiga juda yaqin joylashtiring: δ ≥ +85°.',ok:(a,d)=>d>=85},\n  {t:'Vega yulduzining o‘rnini kiriting: α = 18 soat 37 daqiqa, δ ≈ +39°.',ok:(a,d)=>Math.abs(a-18.617)\u003c=0.15&&Math.abs(d-38.8)\u003c=1.5},\n  {t:'Janubiy yarimsharda yulduz toping: α = 6 soat, δ = −30°.',ok:(a,d)=>Math.abs(a-6)\u003c=0.25&&Math.abs(d+30)\u003c=3},\n  {t:'Yulduzni boshlang‘ich og‘ish doirasiga qo‘ying (α = 0 soat), og‘ishi δ = +45° bo‘lsin.',ok:(a,d)=>(a\u003c=0.2||a>=23.8)&&Math.abs(d-45)\u003c=3}\n];\nconst tl=el('tasks');\ntasks.forEach((t,i)=>{\n  const li=document.createElement('li');\n  li.innerHTML='\u003cdiv>\u003cb>'+(i+1)+'-topshiriq.\u003c/b> '+t.t+'\u003c/div>\u003cdiv class=\"row\" style=\"margin:0\">\u003cbutton class=\"btn\" type=\"button\">Tekshirish\u003c/button>\u003cspan class=\"res\" aria-live=\"polite\">\u003c/span>\u003c/div>';\n  li.querySelector('button').addEventListener('click',()=>{\n    const r=li.querySelector('.res'),a=M.ta/15,d=M.td;\n    if(t.ok(a,d)){r.className='res ok';r.textContent='To‘g‘ri!';}\n    else{r.className='res bad';r.innerHTML='Hozircha α = '+fmtRAhtml(a)+', δ = '+fmtDeg(d,0)+'. Sliderlarni sozlab, qayta urinib ko‘ring.';}\n  });\n  tl.appendChild(li);\n});\n\n/* quiz */\nconst quiz=[\n  {q:'Osmon qutbining gorizontdan balandligi nimaga teng?',o:['Kuzatuvchining geografik uzunligiga','Kuzatuvchining geografik kengligiga','90° − φ ga','Har doim 45° ga'],a:1,e:'Osmon qutbining balandligi geografik kenglikka teng: h(P) = φ. Slayderda kenglikni o‘zgartirib, buni ko‘rdingiz.'},\n  {q:'Osmon ekvatori gorizontni qaysi nuqtalarda kesadi?',o:['Shimol va janub nuqtalarida','Zenit va nadirda','Sharq va g‘arb nuqtalarida','Osmon qutblarida'],a:2,e:'Ekvator tekisligi meridian tekisligiga perpendikulyar, shuning uchun u gorizontni sharq va g‘arb nuqtalarida kesadi.'},\n  {q:'Qaysi koordinatalar kuzatuvchi joyiga va sutka vaqtiga bog‘liq emas?',o:['A va h','Faqat azimut A','α va δ','Hech qaysisi'],a:2,e:'To‘g‘ri chiqish va og‘ish yulduzlar bilan birga aylanadi, shuning uchun kataloglarda ishlatiladi.'},\n  {q:'3 soat 20 daqiqa necha gradusga teng?',o:['45°','50°','60°','33°20′'],a:1,e:'3 soat = 45°, 20 daqiqa = 20 × 15′ = 5°. Jami 50°.'},\n  {q:'Yulduzning og‘ishi δ = −90° bo‘lsa, u qayerda joylashgan?',o:['Shimoliy osmon qutbida','Osmon ekvatorida','Zenitda','Janubiy osmon qutbida'],a:3,e:'δ = −90° janubiy osmon qutbiga mos keladi.'},\n  {q:'Yerdagi qaysi tushuncha osmon sferasidagi to‘g‘ri chiqishga mos keladi?',o:['Geografik kenglik','Geografik uzunlik','Ekvator','Qutb'],a:1,e:'Uzunlik Grinvich meridianidan, to‘g‘ri chiqish γ nuqtadan o‘tuvchi doiradan sharq tomon o‘lchanadi.'},\n  {q:'Osmon sferasining radiusi haqida qaysi fikr to‘g‘ri?',o:['Aniq 1 million km','Yer radiusiga teng','Ixtiyoriy deb olinadi: muhimi — yo‘nalish','Quyoshgacha masofaga teng'],a:2,e:'Osmon sferasi shartli model, uning radiusi ahamiyatsiz.'}\n];\nlet answered=0,correct=0;\nconst qb=el('quizBox');\nquiz.forEach((it,i)=>{\n  const d=document.createElement('div');d.className='q';\n  d.innerHTML='\u003cp>'+(i+1)+'. '+it.q+'\u003c/p>\u003cdiv class=\"opts\">\u003c/div>\u003cdiv class=\"exp\" hidden>\u003c/div>';\n  const opts=d.querySelector('.opts');\n  it.o.forEach((txt,j)=>{\n    const b=document.createElement('button');b.type='button';b.textContent=txt;\n    b.addEventListener('click',()=>{\n      if(d.dataset.done)return;d.dataset.done='1';answered++;\n      const btns=opts.querySelectorAll('button');\n      btns[it.a].classList.add('right');\n      if(j===it.a)correct++;else b.classList.add('wrong');\n      const ex=d.querySelector('.exp');ex.hidden=false;ex.textContent=(j===it.a?'To‘g‘ri. ':'Noto‘g‘ri. ')+it.e;\n      el('score').textContent=answered===quiz.length?'Natija: '+correct+' / '+quiz.length:'Javob berilgan: '+answered+' / '+quiz.length;\n    });\n    opts.appendChild(b);\n  });\n  qb.appendChild(d);\n});\n\n/* ---------- page chrome ---------- */\nel('themeBtn').addEventListener('click',()=>{\n  const r=document.documentElement,dark=window.matchMedia('(prefers-color-scheme: dark)').matches;\n  const cur=r.dataset.theme||(dark?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';\n});\nconst bar=el('prog');\naddEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;bar.style.transform='scaleX('+(m>0?clamp(h.scrollTop/m,0,1):0)+')';},{passive:true});\nconst navLinks=[...document.querySelectorAll('.top nav a')];\nconst spy=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){navLinks.forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+en.target.id?'true':'false'));}});},{rootMargin:'-35% 0px -55% 0px'});\ndocument.querySelectorAll('section.lesson').forEach(s=>spy.observe(s));\n\nrequestAnimationFrame(frame);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]</script>
<script>
(function(){
  var T=JSON.parse(document.getElementById('d').textContent);
  var stage=document.getElementById('stage'),home=document.getElementById('home');
  var list=document.getElementById('list'),cards=document.getElementById('cards');
  var side=document.getElementById('side'),shade=document.getElementById('shade'),burger=document.getElementById('burger');
  var frames={},btns=[];
  function item(icon,text,i){
    var b=document.createElement('button');
    var n=document.createElement('span');n.className='n';n.textContent=icon;
    var s=document.createElement('span');s.textContent=text;
    b.appendChild(n);b.appendChild(s);
    b.onclick=function(){go(i);toggle(false)};
    list.appendChild(b);btns[i]=b;
  }
  item('🏠','Bosh sahifa',0);
  T.forEach(function(t,k){
    item(t.icon,(k+1)+'. '+t.title,k+1);
    var c=document.createElement('button');c.className='card';
    c.innerHTML='<span class="e"></span><b></b><span></span>';
    c.children[0].textContent=t.icon;c.children[1].textContent=t.title;c.children[2].textContent=(k+1)+'-mavzu';
    c.onclick=function(){go(k+1)};cards.appendChild(c);
  });
  function toggle(open){
    side.classList.toggle('open',open);shade.classList.toggle('open',open);
    burger.setAttribute('aria-expanded',open);
  }
  burger.onclick=function(){toggle(true)};
  document.getElementById('close').onclick=function(){toggle(false)};
  shade.onclick=function(){toggle(false)};
  document.getElementById('brand').onclick=function(){go(0)};
  addEventListener('keydown',function(e){if(e.key==='Escape')toggle(false)});
  function go(i,noHash){
    if(i<0||i>T.length)i=0;
    if(i>0&&!frames[i]){
      var f=document.createElement('iframe');
      f.title=T[i-1].title;f.srcdoc=T[i-1].html;
      stage.appendChild(f);frames[i]=f;
    }
    home.classList.toggle('on',i===0);
    for(var k in frames)frames[k].classList.toggle('on',+k===i);
    btns.forEach(function(b,k){b.classList.toggle('on',k===i)});
    document.title=(i?T[i-1].title+' — ':'')+'Astronomiya';
    btns[i].scrollIntoView({block:'nearest'});
    if(!noHash)history.replaceState(null,'','#'+(i||'home'));
  }
  function fromHash(){var n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n}
  go(fromHash(),true);
  addEventListener('hashchange',function(){go(fromHash(),true)});
})();
</script>
