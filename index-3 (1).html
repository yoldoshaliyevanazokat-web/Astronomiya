n ikki rejimni solishtiring: ko'rinma (sfera aylanadi) va haqiqiy (Yer aylanadi).\u003c/p>`,\nbox:[\"Osmon sferasi — yo'nalishlarni o'rganish uchun kiritilgan xayoliy soha; radiusi ixtiyoriy.\",\"Yulduzlarning sutkalik harakati — Yer aylanishining ko'rinishi.\",\"Yulduzlar parallellar bo'ylab, dunyo o'qi atrofida aylanadi.\",\"Yulduz sutkasi 23 s 56 daq.\"],\nquiz:[{q:\"Osmon sferasining radiusi qanday olinadi?\",o:[\"Yulduzgacha masofaga teng\",\"Ixtiyoriy (xayoliy)\",\"Yer radiusiga teng\"],a:1,e:\"Faqat yo'nalish muhim, shuning uchun radius ixtiyoriy.\"},{q:\"Yulduz sutkasi qancha davom etadi?\",o:[\"24 soat\",\"23 soat 56 daqiqa\",\"24 soat 4 daqiqa\"],a:1,e:\"Yer yulduzlarga nisbatan 23 s 56 daq da to'liq aylanadi; Quyosh sutkasi esa 24 soat.\"},{q:\"Yulduzlarning sutkalik harakatiga nima sabab?\",o:[\"Yulduzlarning Yer atrofida aylanishi\",\"Yerning o'z o'qi atrofida aylanishi\",\"Quyoshning harakati\"],a:1,e:\"Yerning aylanishi tufayli osmon teskari yo'nalishda aylanayotgandek tuyuladi.\"},{q:\"Yulduz sferada qanday yo'l chizadi?\",o:[\"Dunyo o'qiga perpendikulyar aylana (parallel)\",\"Meridian bo'ylab\",\"To'g'ri chiziq\"],a:0,e:\"Har bir yulduz o'z parallelida harakatlanadi.\"}],\ntask:\"Simulyatsiyada ikkala rejimni yoqing. Ikkala holda kuzatuvchi nimani ko'radi? 3–4 jumlada yozing: nega olimlar hisoblarda ko'rinma rejimdan foydalanadi?\"},\n{title:\"2-bo'lim. Asosiy nuqta va chiziqlar\",\nth:`\u003cp>Sferadagi nuqta yoki chiziqni bosing yoki tugmalardan tanlang — izoh tepada chiqadi. Rang izohi tugmalarning chizig'ida ko'rinadi.\u003c/p>\u003cp>\u003cb>Tik chiziq\u003c/b> kuzatuvchi joyida yer tortishi yo'nalishini beradi. Unga perpendikulyar tekislik — \u003cb>haqiqiy ufq\u003c/b>. \u003cb>Meridian\u003c/b> — qutblar va zenitdan o'tuvchi aylana.\u003c/p>\u003cp>\u003cb>Asosiy qonun:\u003c/b> dunyo qutbining ufqdan balandligi kuzatuvchi kengligiga teng. Kenglik slayderini 0° dan 90° gacha suring va kuzating.\u003c/p>`,\nbox:[\"Zenit — tik chiziqning tepadagi nuqtasi; nadir — pastdagisi.\",\"Tush chizig'i — meridian va ufq tekisliklarining kesishgan chizig'i (shimol–janub).\",\"Dunyo qutbi balandligi = joy kengligi: h = φ.\",\"Toshkent uchun φ ≈ 41°, qutb ufqdan 41° balandda.\"],\nquiz:[{q:\"Zenit nima?\",o:[\"Boshimiz ustidagi nuqta\",\"Shimol nuqtasi\",\"Dunyo qutbi\"],a:0,e:\"Zenit — tik chiziqning yuqoridagi osmon sferasi bilan kesishgan nuqtasi.\"},{q:\"φ = 41° joyda dunyo qutbining balandligi qancha?\",o:[\"49°\",\"41°\",\"90°\"],a:1,e:\"h = φ.\"},{q:\"Tush chizig'i qaysi tekisliklarning kesishmasi?\",o:[\"Ufq va ekvator\",\"Meridian va haqiqiy ufq\",\"Ekliptika va meridian\"],a:1,e:\"Meridian tekisligi ufqni shimol–janub chizig'i bo'ylab kesadi.\"},{q:\"Shimoliy qutbda (φ = 90°) dunyo qutbi qayerda?\",o:[\"Ufqda\",\"Zenitda\",\"Nadirda\"],a:1,e:\"h = 90° — qutb boshimiz ustida.\"}],\ntask:\"φ ni 0°, 41° va 90° ga qo'ying. Har birida yulduzlar ufqqa nisbatan qanday harakatlanishini (3-bo'limda yulduzni aylantirib) izohlang.\"},\n{title:\"3-bo'lim. Asosiy aylanalar va ulardan foydalanish\",\nth:`\u003cp>Qatlamlarni yoqib-o'chiring. \u003cb>Osmon ekvatori\u003c/b> — dunyo o'qiga perpendikulyar katta aylana. \u003cb>Almukantarat\u003c/b> — ufqqa parallel kichik aylana. \u003cb>Vertikal doira\u003c/b> — zenit va nadir orqali o'tadi; sharq va g'arbdan o'tgani \u003cb>birinchi vertikal\u003c/b>. \u003cb>Og'ish (soat) doirasi\u003c/b> — ikkala qutb orqali o'tadi. \u003cb>Ekliptika\u003c/b> — Quyoshning yillik ko'rinma yo'li, ekvatorga 23,5° og'ma.\u003c/p>\u003cp>Tengkunlik va kunburilish: bahorgi tengkunlik (21-mart, δ☉ = 0°), yozgi kunburilish (22-iyun, δ☉ = +23,5°), kuzgi tengkunlik (23-sentabr), qishki kunburilish (22-dekabr, δ☉ = −23,5°).\u003c/p>\u003cp>\u003cb>Koordinatalar:\u003c/b> ufq tizimida \u003cb>azimut A\u003c/b> (janub nuqtasidan g'arbga) va \u003cb>balandlik h\u003c/b>; ekvator tizimida \u003cb>og'ish δ\u003c/b> (ekvatordan burchak masofasi) va \u003cb>soat burchagi t\u003c/b> (meridiandan g'arbga). Yulduzni bosing, burchaklar sferada chiziladi.\u003c/p>`,\nbox:[\"Ufq koordinatalari: A va h; ekvator koordinatalari: δ va t.\",\"Kulminatsiya — yulduzning meridiandan o'tishi (yuqori: eng baland, quyi: eng past).\",\"Yuqori kulminatsiyada h = 90° − φ + δ (δ \u003c φ).\",\"Shundan φ = 90° − h + δ — joy kengligini aniqlash formulasi.\"],\nquiz:[{q:\"Og'ish δ nima?\",o:[\"Yulduzning osmon ekvatoridan burchak masofasi\",\"Yulduzning ufqdan balandligi\",\"Yulduzning janub nuqtasidan masofasi\"],a:0,e:\"δ ekvatordan shimolga musbat (+), janubga manfiy (−) hisoblanadi.\"},{q:\"δ = +20°, φ = 41° bo'lsa, yuqori kulminatsiyada h = ?\",o:[\"69°\",\"61°\",\"110°\"],a:0,e:\"h = 90° − 41° + 20° = 69°.\"},{q:\"Ekliptikaning ekvatorga og'maligi qancha?\",o:[\"23,5°\",\"41°\",\"66,5°\"],a:0,e:\"Bu Yer o'qining og'ishi bilan bog'liq.\"},{q:\"Bahorgi tengkunlik nuqtasi qaysi?\",o:[\"Quyosh ekvatordan shimolga o'tadigan nuqta\",\"Quyosh eng baland chiqadigan nuqta\",\"Meridian va ufq kesishmasi\"],a:0,e:\"Bu nuqtada δ☉ = 0°, sana 21-mart atrofida.\"},{q:\"Yulduz qachon botmaydi?\",o:[\"δ > 90° − φ\",\"δ \u003c φ\",\"δ = 0°\"],a:0,e:\"Quyi kulminatsiyada ham h = φ + δ − 90° > 0 bo'ladi.\"}],\nex:`\u003cdiv class=\"card\">\u003cb>Amaliy misol: joy kengligini aniqlash\u003c/b>\u003cp>Yulduz janubdan kulminatsiyaga chiqqanda: h = 90° − φ + δ, demak \u003cb>φ = 90° − h + δ\u003c/b>. Misol: δ = +20° yulduz h = 69° da kulminatsiya qilsa, φ = 90° − 69° + 20° = 41°.\u003c/p>\u003clabel>h \u003cinput type=\"number\" id=\"ch\" value=\"69\" step=\"any\">°\u003c/label> \u003clabel>δ \u003cinput type=\"number\" id=\"cd\" value=\"20\" step=\"any\">°\u003c/label>\u003cp id=\"cr\">\u003c/p>\u003c/div>`,\ntask:\"Toshkentda (φ ≈ 41°) qaysi yulduzlar hech qachon botmaydi? Shart δ > 49° ni qanoatlantiruvchi yulduzlarni ro'yxatdan toping va Capella (δ = +46°) nega botishini tushuntiring.\"}];\nfunction render(){const s=S[tab];$('#sec').innerHTML=`\u003ch2>${s.title}\u003c/h2>${s.th}\u003cdiv class=\"box\">\u003cb>Eslab qoling\u003c/b>\u003cul>${s.box.map(x=>'\u003cli>'+x+'\u003c/li>').join('')}\u003c/ul>\u003c/div>\u003ch3>Test\u003c/h3>${s.quiz.map((q,i)=>`\u003cdiv class=\"q\">\u003cb>${i+1}. ${q.q}\u003c/b>${q.o.map((o,j)=>`\u003cbutton class=\"o\" data-q=\"${i}\" data-o=\"${j}\">${o}\u003c/button>`).join('')}\u003cp class=\"fb\">\u003c/p>\u003c/div>`).join('')}${s.ex||''}\u003cdiv class=\"task\">\u003cb>Mustaqil topshiriq.\u003c/b> ${s.task}\u003c/div>`;\n if($('#ch')){const f=()=>{$('#cr').innerHTML=`φ = 90° − ${$('#ch').value}° + ${$('#cd').value}° = \u003cb>${f1(90-$('#ch').value-(-$('#cd').value))}°\u003c/b>`};$('#ch').oninput=$('#cd').oninput=f;f()}}\n$('#sec').onclick=e=>{const b=e.target.closest('.o');if(!b)return;const q=S[tab].quiz[+b.dataset.q],ok=+b.dataset.o===q.a,p=b.parentNode;p.querySelectorAll('.o').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');p.querySelector('.fb').textContent=(ok?\"✅ To'g'ri. \":\"❌ Noto'g'ri. To'g'ri javob: \"+q.o[q.a]+\". \")+q.e};\nfunction legend(){const l=$('#leg');\n if(tab==0){l.innerHTML=[['Dunyo o\\'qi',C.ax],['Osmon ekvatori',C.eq],['Yulduz parallellari','#aab'],['Zenit chizig\\'i',C.zen]].map(a=>`\u003cspan class=\"sp\" style=\"--c:${a[1]}\">${a[0]}\u003c/span>`).join('');return}\n if(tab==1){const A=[['zen','Zenit',C.zen],['nad','Nadir',C.zen],['plumb','Tik chiziq',C.zen],['hor','Haqiqiy gorizont',C.hor],['axis',\"Dunyo o'qi\",C.ax],['pn','Shim. qutb',C.ax],['ps','Jan. qutb',C.ax],['cp',\"Sh·J·Sq·G'\",'#fff'],['noon',\"Tush chizig'i\",C.noon],['mer','Osmon meridiani',C.mer]];\n  l.innerHTML=A.map(a=>`\u003cbutton class=\"chip\" style=\"--c:${a[2]}\" data-k=\"${a[0]}\">${a[1]}\u003c/button>`).join('');return}\n const B=[['eq','Ekvator, parallellar',C.eq],['hor','Ufq, almukantaratlar',C.hor],['mer','Meridian, vertikallar',C.mer],['hr',\"Og'ish doiralari\",C.hr],['ecl','Ekliptika, nuqtalar',C.ecl]];\n l.innerHTML=B.map(a=>`\u003cbutton class=\"chip ${L[a[0]]?'on':''}\" style=\"--c:${a[2]}\" data-l=\"${a[0]}\">${a[1]}\u003c/button>`).join('')+[['A azimut','#00f5d4'],['h balandlik','#fff'],['δ og\\'ish','#ff9f1c'],['t soat burchagi','#f4a6d7']].map(a=>`\u003cspan class=\"sp\" style=\"--c:${a[1]}\">${a[0]}\u003c/span>`).join('')}\n$('#leg').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.k)selItem=b.dataset.k;if(b.dataset.l){L[b.dataset.l]^=1;b.classList.toggle('on')}};\nfunction setTab(i){tab=i;goal=null;roS='';[...$('#tabs').children].forEach((b,j)=>b.classList.toggle('on',i==j));document.querySelectorAll('.row').forEach(r=>r.hidden=!r.dataset.t.split(' ').includes(''+i));legend();render();if(i==2)playing=false,$('#play').textContent='▶ Boshlash'}\n[...$('#tabs').children].forEach((b,i)=>b.onclick=()=>setTab(i));\nrs();setTab(0);requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"title": "Quyoshning yillik ko'rinma harakati. Ekliptika", "icon": "☀️", "html": "\u003c!DOCTYPE html>\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003ctitle>Quyoshning yillik ko‘rinma harakati. Ekliptika\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#070b1a;--sf:#0f1730;--ln:#25325c;--tx:#e9eefc;--mu:#a3b2da;--sun:#ffc94a;--eq:#4cc9f0;--ok:#5fd38d;--no:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:radial-gradient(ellipse at 20% 0,#13204a 0,var(--bg) 55%) fixed,var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader,main,nav{max-width:980px;margin:auto;padding-left:16px;padding-right:16px}header{padding-top:20px}\nh1{font:700 clamp(1.4rem,5vw,2.2rem)/1.2 Georgia,serif;margin:0 0 6px}.sub{color:var(--mu);margin:0}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding-top:10px;padding-bottom:8px;background:linear-gradient(var(--bg) 75%,transparent)}\nbutton{font:inherit;color:var(--tx);background:#18234a;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}\nbutton:hover{border-color:var(--sun)}button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}\nnav button{flex:1;font-size:.9rem}nav button.on{background:var(--sun);color:#1a1400;border-color:var(--sun);font-weight:700}\nmain{padding-bottom:40px}section[hidden]{display:none}\n.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:14px 0}\nh2{font:700 1.3rem Georgia,serif;margin:0 0 8px}h3{font:600 1.05rem Georgia,serif;margin:0 0 6px;color:var(--sun)}p{margin:0 0 8px}\n.goal{border-left:3px solid var(--sun);padding-left:12px;color:var(--mu)}.mu{color:var(--mu);font-size:.88rem}\n.cvw{max-width:520px;margin:auto}canvas{width:100%;display:block}\n.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}.ctl label{display:flex;flex-direction:column;gap:2px;flex:1;min-width:150px;font-size:.9rem}\ninput[type=range]{width:100%;accent-color:var(--sun)}\n.out{background:#0a1128;border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:.92rem}\ntable{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--ln);padding:6px 4px;text-align:left;vertical-align:top}\n.warn{border-left:3px solid var(--no);background:#1e1424}.sum{border-left:3px solid var(--ok);background:#0f2020}\n.q{margin:12px 0}.o{display:block;width:100%;text-align:left;margin:6px 0}.o.ok{border-color:var(--ok);background:#143324}.o.no{border-color:var(--no);background:#3a1a22}\n.fb{min-height:1.2em;font-size:.9rem;color:var(--mu)}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>Quyoshning yillik ko‘rinma harakati. Ekliptika\u003c/h1>\u003cp class=\"sub\">11-sinf astronomiya · interaktiv o‘quv vosita\u003c/p>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\u003cmain id=\"main\">\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),R=Math.PI/180,T=365.2422,f=(v,n=1)=>v.toFixed(n).replace(\".\",\",\");\nconst MN=[\"yanvar\",\"fevral\",\"mart\",\"aprel\",\"may\",\"iyun\",\"iyul\",\"avgust\",\"sentabr\",\"oktabr\",\"noyabr\",\"dekabr\"],MD=[31,28,31,30,31,30,31,31,30,31,30,31];\nconst dstr=d=>{d=Math.floor(d);let m=0;while(m\u003c11&&d>MD[m]){d-=MD[m];m++}return d+\"-\"+MN[m]};\nconst lam=d=>{const M=360*(d-3)/T*R,l=360*(d-81.9)/T+1.915*Math.sin(M)+.02*Math.sin(2*M);return((l%360)+360)%360};\nconst dec=(l,e)=>Math.asin(Math.sin(e*R)*Math.sin(l*R))/R;\nconst C=[[\"Tog‘ echkisi\",\"Echki\",20],[\"Dalv\",\"Dalv\",47],[\"Baliqlar\",\"Baliq\",70],[\"Qo‘y\",\"Qo‘y\",108],[\"Buzoq\",\"Buzoq\",133],[\"Egizaklar\",\"Egiz\",173],[\"Qisqichbaqa\",\"Qisqich\",202],[\"Sher\",\"Sher\",222],[\"Parizod\",\"Parizod\",259],[\"Tarozi\",\"Tarozi\",304],[\"Chayon\",\"Chayon\",327],[\"Ilonchi (Ophiuchus)\",\"Ilonch\",334],[\"O‘qotar\",\"O‘qotar\",352]];\nconst B=C.map(c=>lam(c[2])),cons=d=>{d=Math.floor(d);let k=12;if(d\u003c20)return 12;C.forEach((c,i)=>{if(d>=c[2])k=i});return k};\nconst LD=(p,de)=>{const t=Math.tan(p*R)*Math.tan(de*R);return t>=1?0:t\u003c=-1?24:2*Math.acos(-t)/R/15};\nfunction calc(d,p){const l=lam(d),de=dec(l,23.44),L=LD(p,de),h=90-Math.abs(p-de);let az=null;if(L>0&&L\u003c24)az=Math.acos(Math.max(-1,Math.min(1,Math.sin(de*R)/Math.cos(p*R))))/R;return{l,de,L,h,az}}\nconst hm=L=>L==0?\"Quyosh chiqmaydi (qutb kechasi)\":L==24?\"Quyosh botmaydi (qutb kuni)\":Math.floor(Math.round(L*60)/60)+\" soat \"+Math.round(L*60)%60+\" daq.\";\nconst S=[{day:80,play:0,sp:20},{day:80,play:0,sp:20,eps:23.44},{day:172,play:0,sp:20,phi:41.3}];let cur=0;\nfunction cv(id){const c=$(id),w=c.clientWidth,h=w*c.dataset.r,k=devicePixelRatio||1;if(c.width!=Math.round(w*k)||c.height!=Math.round(h*k)){c.width=Math.round(w*k);c.height=Math.round(h*k);c.style.height=h+\"px\"}const x=c.getContext(\"2d\");x.setTransform(k,0,0,k,0,0);x.clearRect(0,0,w,h);return[x,w,h]}\nconst ctl=(i,ex=\"\")=>`\u003cdiv class=\"ctl\">\u003cbutton id=\"p${i}\">▶ Boshlash\u003c/button>\u003cbutton id=\"r${i}\">↺ Qayta boshlash\u003c/button>\u003clabel>Tezlik: kuniga \u003cspan id=\"vl${i}\">20\u003c/span> sutka/s\u003cinput type=\"range\" id=\"v${i}\" min=\"1\" max=\"60\" value=\"20\">\u003c/label>\u003c/div>\u003cdiv class=\"ctl\">\u003clabel>Sana: \u003cb id=\"dl${i}\">\u003c/b>\u003cinput type=\"range\" id=\"d${i}\" min=\"1\" max=\"365\" value=\"${S[i].day}\">\u003c/label>${ex}\u003c/div>`;\nconst QZ=[[{t:\"Quyosh yulduzlar fonida qaysi yo‘nalishda siljiydi?\",o:[\"Sharqdan g‘arbga\",\"G‘arbdan sharqqa\",\"Shimoldan janubga\"],a:1,w:\"Yillik harakat g‘arbdan sharqqa; sutkalik harakat esa sharqdan g‘arbga.\"},{t:\"Quyoshning yulduzlar fonidagi kunlik siljishi taxminan qancha?\",o:[\"~15°\",\"~0,1°\",\"~1°\"],a:2,w:\"360° ÷ 365,2422 sutka ≈ 0,99°.\"}],\n[{t:\"Ekliptikaning ekvatorga og‘ish burchagi?\",o:[\"5,14°\",\"23,44°\",\"66,56°\"],a:1,w:\"Bu burchak Yer o‘qining og‘ishiga teng.\"},{t:\"Bahorgi tengkunlikda Quyosh deklinatsiyasi qancha?\",o:[\"+23,44°\",\"−23,44°\",\"0°\"],a:2,w:\"Quyosh shu paytda ekliptika va ekvator kesishgan nuqtada bo‘ladi.\"}],\n[{t:\"Fasllar almashinuvining asosiy sababi nima?\",o:[\"Yer o‘qining og‘ishi\",\"Quyoshgacha masofaning o‘zgarishi\",\"Oy tortishi\"],a:0,w:\"Og‘ish tufayli nurlar tushish burchagi va kun uzunligi o‘zgaradi.\"},{t:\"41° sh.k.da 21-iyun tush paytida Quyosh balandligi? (h = 90° − φ + δ)\",o:[\"90°\",\"72,4°\",\"48,6°\"],a:1,w:\"90° − 41° + 23,44° = 72,44°.\"},{t:\"Yer perigeliyda (Quyoshga eng yaqin) qachon bo‘ladi?\",o:[\"~4-iyul\",\"~21-iyun\",\"~3-yanvar\"],a:2,w:\"Shimoliy yarimsharda o‘shanda qish — demak fasl sababi masofa emas.\"}]];\nconst quiz=i=>`\u003cdiv class=\"card\">\u003ch3>Nazorat savollari\u003c/h3>`+QZ[i].map((q,k)=>`\u003cdiv class=\"q\">\u003cp>\u003cb>${q.t}\u003c/b>\u003c/p>`+q.o.map((o,j)=>`\u003cbutton class=\"o\" data-s=\"${i}\" data-k=\"${k}\" data-j=\"${j}\">${o}\u003c/button>`).join(\"\")+`\u003cdiv class=\"fb\" id=\"fb${i}${k}\">\u003c/div>\u003c/div>`).join(\"\")+`\u003c/div>`;\nconst sum=t=>`\u003cdiv class=\"card sum\">\u003ch3>Xulosa\u003c/h3>${t}\u003c/div>`;\nconst SEC=[\n`\u003cdiv class=\"card\">\u003ch2>1. Quyoshning yillik ko‘rinma harakati va uning sabablari\u003c/h2>\u003cp class=\"goal\">Maqsad: Quyoshning yulduzlar fonidagi yillik siljishi sababini Yerning orbital harakati bilan bog‘lab tushuntirish.\u003c/p>\n\u003cp>Quyosh kun bo‘yi sharqdan g‘arbga suzadi — bu Yerning o‘z o‘qi atrofida aylanishi natijasi. Bundan tashqari, Quyosh yulduzlar fonida har kuni taxminan 1° ga g‘arbdan sharqqa siljiydi, bir yilda esa ~360° ga. Bu ko‘rinma harakat: aslida Yer Quyosh atrofida aylanadi, biz esa Quyoshni har oy boshqa yo‘nalishdagi yulduzlar fonida ko‘ramiz. Kunduzi yulduzlar yo‘qolmaydi, ularni Quyoshning sochilgan yorug‘ligi bosib ketadi. Yil (tropik) 365,2422 sutka.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiya va simulyatsiya\u003c/h3>\u003cdiv class=\"cvw\">\u003ccanvas id=\"c1\" data-r=\"1\">\u003c/canvas>\u003c/div>${ctl(0)}\u003cdiv class=\"out\" id=\"o1\">\u003c/div>\u003cp class=\"mu\">Soddalashtirilgan model: orbita aylana qilib chizilgan (aslida ellips, ekssentrisitet 0,017), masshtab saqlanmagan, turkum chegaralari taxminiy.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Taqqoslash\u003c/h3>\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Sutkalik\u003c/th>\u003cth>Yillik\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Yo‘nalish\u003c/td>\u003ctd>sharqdan g‘arbga\u003c/td>\u003ctd>g‘arbdan sharqqa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sababi\u003c/td>\u003ctd>Yerning o‘z o‘qi atrofida aylanishi\u003c/td>\u003ctd>Yerning Quyosh atrofida aylanishi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Davri\u003c/td>\u003ctd>~24 soat\u003c/td>\u003ctd>365,2422 sutka\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tezligi\u003c/td>\u003ctd>~15°/soat\u003c/td>\u003ctd>~1°/sutka\u003c/td>\u003c/tr>\u003c/table>\u003c/div>${quiz(0)}${sum(\"\u003cp>Quyoshning yillik harakati ko‘rinma bo‘lib, Yerning orbital harakati oqibatidir. Quyosh yulduzlar fonida kuniga ~1° g‘arbdan sharqqa siljiydi va bir yilda to‘liq doira chizadi.\u003c/p>\")}`,\n`\u003cdiv class=\"card\">\u003ch2>2. Ekliptika, uning osmon sferasidagi o‘rni va xususiyatlari\u003c/h2>\u003cp class=\"goal\">Maqsad: ekliptikani, tengkunlik va quyosh turish nuqtalarini hamda og‘ish burchagining ahamiyatini tushunish.\u003c/p>\n\u003cp>Ekliptika — Quyoshning osmon sferasidagi yillik ko‘rinma yo‘li; u Yer orbitasi tekisligining osmon sferasi bilan kesishuvi. U osmon ekvatori bilan ikki nuqtada kesishadi: bahorgi (21-mart) va kuzgi (23-sentabr) tengkunlik nuqtalari. Ulardan 90° narida quyosh turish nuqtalari joylashgan (21–22-iyun va 21–22-dekabr). Ekliptika bilan ekvator orasidagi burchak 23,44°; ekliptika qutblari osmon qutblaridan shu burchak qadar uzoqda. Oy va sayyoralar yo‘llari ekliptikaga yaqin (Oy orbitasi ~5,1° og‘gan), shuning uchun ular zodiak turkumlari orasida ko‘rinadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiya va simulyatsiya\u003c/h3>\u003cdiv class=\"cvw\">\u003ccanvas id=\"c2\" data-r=\"1\">\u003c/canvas>\u003c/div>\u003cp class=\"mu\">Havorang — ekvator, oltin — ekliptika, binafsha uzuq chiziq — Oy yo‘li, sariq nuqta — Quyosh.\u003c/p>${ctl(1,`\u003clabel>Og‘ish burchagi ε: \u003cb id=\"el2\">\u003c/b>\u003cinput type=\"range\" id=\"e2\" min=\"0\" max=\"45\" step=\"0.01\" value=\"23.44\">\u003c/label>\u003cbutton id=\"e2b\">Haqiqiy: 23,44°\u003c/button>`)}\u003cdiv class=\"out\" id=\"o2\">\u003c/div>\u003cp class=\"mu\">Soddalashtirilgan model: Quyosh ekliptika bo‘ylab deyarli tekis harakatlanadi deb olingan.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Koordinatalar haqida qisqacha\u003c/h3>\u003cp>\u003cb>Ekvatorial:\u003c/b> α (to‘g‘ri chiqish — bahorgi tengkunlik nuqtasidan ekvator bo‘ylab sharqqa) va δ (og‘ish — ekvatordan ±90°). \u003cb>Ekliptik:\u003c/b> λ (ekliptik uzunlik — shu nuqtadan ekliptika bo‘ylab) va β (ekliptik kenglik). Quyosh uchun β ≈ 0, bog‘lanish: sin δ = sin ε · sin λ.\u003c/p>\u003c/div>${quiz(1)}${sum(\"\u003cp>Ekliptika Quyoshning yillik yo‘li bo‘lib, ekvator bilan 23,44° burchak ostida kesishadi. Quyosh deklinatsiyasi +23,44° dan −23,44° gacha o‘zgaradi; og‘ish burchagi qancha katta bo‘lsa, fasllar farqi shuncha kuchli.\u003c/p>\")}`,\n`\u003cdiv class=\"card\">\u003ch2>3. Yillik harakatning fasllar, zodiak va Yerga ta’siri\u003c/h2>\u003cp class=\"goal\">Maqsad: sana va kenglikka qarab Quyosh balandligi hamda kun uzunligini hisoblash, fasllar va zodiak sabablarini tushunish.\u003c/p>\n\u003cp>Yer o‘qi orbita tekisligiga ~23,44° og‘gan va yil bo‘yi bir tomonga qaragan. Shuning uchun yilning turli nuqtalarida Quyosh nurlari Yer yuzasiga turli burchak ostida tushadi va kun uzunligi o‘zgaradi. Yozda nurlar tikroq tushadi va kun uzun, qishda esa nurlar qiyaroq va kun qisqa. Tush paytidagi Quyosh balandligi h = 90° − φ + δ formulasi bilan topiladi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Animatsiya: orbitaning 4 nuqtasi\u003c/h3>\u003cdiv class=\"cvw\">\u003ccanvas id=\"c3\" data-r=\"1\">\u003c/canvas>\u003c/div>\u003cp class=\"mu\">Qizil nuqta — tanlangan kenglik; ramka — sanangizga eng yaqin nuqta. Soddalashtirilgan model: masshtab saqlanmagan, yon tomondan ko‘rinish.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Simulyatsiya\u003c/h3>${ctl(2,`\u003clabel>Geografik kenglik φ: \u003cb id=\"pl3\">\u003c/b>\u003cinput type=\"range\" id=\"e3\" min=\"-90\" max=\"90\" step=\"0.1\" value=\"41.3\">\u003c/label>`)}\u003cdiv class=\"ctl\">\u003cbutton id=\"k1\">Toshkent 41,3°\u003c/button>\u003cbutton id=\"k2\">Ekvator 0°\u003c/button>\u003cbutton id=\"k3\">Qutbga yaqin 80°\u003c/button>\u003c/div>\u003cdiv class=\"out\">\u003ctable id=\"t3\">\u003c/table>\u003c/div>\u003ccanvas id=\"c3b\" data-r=\"0.55\" style=\"margin-top:10px\">\u003c/canvas>\u003cp class=\"mu\">Grafik: tanlangan kenglikda yil davomida kun uzunligi (soat); nuqta — tanlangan sana. Azimut shimoldan sharq tomonga hisoblangan, taxminiy.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Zodiak turkumlari\u003c/h3>\u003cp>Quyosh ekliptika bo‘ylab 13 ta turkumdan o‘tadi: 12 ta an’anaviy zodiak turkumiga Ilonchi (Ophiuchus, ~30-noyabr – 18-dekabr) ham qo‘shiladi. Tarixiy 12 belgi har biri 30° qilib teng bo‘lingan, aslida esa turkum chegaralari teng emas: Quyosh Chayonda ~7 kun, Parizodda ~45 kun bo‘ladi. Pretsessiya tufayli belgi nomlari bilan turkumlar bugun mos tushmaydi. Astrologiya ilmiy asosga ega emas va yulduzlar inson taqdirini belgilamaydi; astronomiya esa kuzatuv va hisobga tayanuvchi fandir. Turkum sanalari taxminiy.\u003c/p>\u003c/div>\n\u003cdiv class=\"card warn\">\u003ch3>Xato tushuncha\u003c/h3>\u003cp>“Yoz — Yer Quyoshga yaqin bo‘lgani uchun.” Bu noto‘g‘ri. Yer perigeliyda (~3-yanvar, ~147 mln km) shimoliy yarimsharda qish, afeliyda (~4-iyul, ~152 mln km) yoz bo‘ladi. Fasllar sababi — Yer o‘qining og‘ishi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Yerga ta’siri\u003c/h3>\u003cp>\u003cb>Qutb kuni va kechasi:\u003c/b> φ &gt; 66,56° da yozda Quyosh botmaydi, qishda chiqmaydi. \u003cb>Iqlim mintaqalari:\u003c/b> issiq (tropiklar, ±23,44° gacha), mo‘tadil, sovuq (qutb doiralari ±66,56° dan keyin). \u003cb>Qishloq xo‘jaligi:\u003c/b> ekish va hosil muddatlari fasllarga bog‘liq. \u003cb>Kalendar:\u003c/b> tropik yil 365,2422 sutka bo‘lgani uchun kabisa yili kiritiladi.\u003c/p>\u003c/div>${quiz(2)}${sum(\"\u003cp>Fasllar Yer o‘qining og‘ishidan kelib chiqadi, masofadan emas. Kenglik va sanaga qarab Quyosh balandligi va kun uzunligi o‘zgaradi. Quyosh 13 ta turkumdan o‘tadi, astrologiya esa ilm emas.\u003c/p>\")}`];\n$(\"nav\").innerHTML=[\"1. Ko‘rinma harakat\",\"2. Ekliptika\",\"3. Fasllar va zodiak\"].map((t,i)=>`\u003cbutton data-t=\"${i}\">${t}\u003c/button>`).join(\"\");\n$(\"main\").innerHTML=SEC ,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Manrope:wght@500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#e9edf6; --surface:#ffffff; --surface2:#f3f5fb; --ink:#141a35; --muted:#566086; --line:#cfd6ea;\n  --brand:#2b3fb8; --brand-ink:#ffffff; --brand-soft:rgba(43,63,184,.10);\n  --teal:#0b8f86; --amber:#b7791f; --rose:#c43d5a; --violet:#6d45c9; --lime:#3f8f2a;\n  --ok:#17803d; --bad:#b3261e;\n  --ui:Manrope,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --serif:Literata,Georgia,\"Times New Roman\",serif;\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0a0e22; --surface:#121833; --surface2:#182040; --ink:#e8ebfa; --muted:#9aa4cf; --line:#2a3362;\n    --brand:#8fa2ff; --brand-ink:#0a0e22; --brand-soft:rgba(143,162,255,.14);\n    --teal:#44d9c6; --amber:#f4bf5a; --rose:#ff7f93; --violet:#bb9bff; --lime:#9cf27d;\n    --ok:#6fdc97; --bad:#ff8c84; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0a0e22; --surface:#121833; --surface2:#182040; --ink:#e8ebfa; --muted:#9aa4cf; --line:#2a3362;\n  --brand:#8fa2ff; --brand-ink:#0a0e22; --brand-soft:rgba(143,162,255,.14);\n  --teal:#44d9c6; --amber:#f4bf5a; --rose:#ff7f93; --violet:#bb9bff; --lime:#9cf27d;\n  --ok:#6fdc97; --bad:#ff8c84; color-scheme:dark;\n}\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}\n*,*::before,*::after{box-sizing:inherit}\n[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--serif);overflow-x:hidden}\n.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}\na{color:var(--brand)}\nsup{font-size:.68em;line-height:0;vertical-align:.45em}\n\n/* header */\n.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:colo
