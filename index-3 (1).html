<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astronomiya</title>
<style>
:root{--bg:#0b1226;--nav:#111b3a;--nav2:#18254d;--ink:#e8eeff;--soft:#9fb0d6;--acc:#ffc93c;--acc-ink:#14213d;--line:#263666;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Telefon uchun yuqori panel */
#top{display:none;flex:none;align-items:center;justify-content:space-between;background:var(--nav);border-bottom:3px solid var(--acc);
padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;z-index:20}
#brand{border:0;background:none;font-weight:800;font-size:1.05rem;padding:6px 4px}
#burger{border:1px solid var(--line);background:var(--nav2);border-radius:10px;width:42px;height:40px;font-size:1.3rem;line-height:1}

#app{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
iframe,#home{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.on{display:block}
#home{background:var(--bg);overflow-y:auto;padding:28px 22px 40px}
#home.on{display:block}
.wrap{max-width:900px;margin:0 auto}
#home h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:8px 0;line-height:1.2}
#home p.lead{color:var(--soft);margin:0 0 24px;max-width:60ch;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;background:var(--nav);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .e{font-size:1.9rem}
.card b{font-size:.98rem;line-height:1.3}
.card span{color:var(--soft);font-size:.82rem}

/* O'ng tomondagi menyu */
#side{flex:none;width:310px;background:var(--nav);border-left:3px solid var(--acc);display:flex;flex-direction:column;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#side header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;font-weight:800;font-size:1.05rem}
#side header small{display:block;font-weight:500;color:var(--soft);font-size:.78rem;margin-top:3px}
#close{display:none;border:0;background:none;font-size:1.3rem;padding:6px 10px}
#list{display:flex;flex-direction:column;gap:3px;padding:4px 10px 16px;overflow-y:auto}
#list button{border:0;background:none;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-size:.92rem;line-height:1.3;color:var(--ink)}
#list button .n{flex:none;width:1.7rem;text-align:center;font-size:1.2rem}
#list button:hover{background:var(--nav2)}
#list button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#shade.open{opacity:1;pointer-events:auto}

@media (max-width:820px){
 #top{display:flex}
 #close{display:block}
 #side{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);z-index:31;border-left:3px solid var(--acc);
  transform:translateX(100%);transition:transform .22s}
 #side.open{transform:none}
}
@media (prefers-reduced-motion:reduce){#side,#shade,.card{transition:none}}
</style>
</head>
<body>
<header id="top">
  <button id="brand">⚛️ Astronomiya</button>
  <button id="burger" aria-label="Mavzular ro'yxatini ochish" aria-expanded="false">☰</button>
</header>
<div id="shade"></div>
<div id="app">
  <main id="stage">
    <section id="home">
      <div class="wrap">
        <h1>Astronomiya: interaktiv darslar</h1>
        <p class="lead">Kerakli mavzuni o'ng tomondagi ro'yxatdan (telefonda ☰ tugmasi orqali) yoki quyidagi kartochkalardan tanlang.</p>
        <div class="grid" id="cards"></div>
      </div>
    </section>
  </main>
  <aside id="side" aria-label="Mavzular ro'yxati">
    <header><div>Mavzular<small>Bosib tezda o'ting</small></div><button id="close" aria-label="Yopish">✕</button></header>
    <nav id="list"></nav>
  </aside>
</div>

d);font-weight:600;}\n.tl-label{font-size:.82rem;color:var(--text-muted);margin-top:2px;line-height:1.3;}\n.tl-item.active .tl-label{color:var(--text);}\n#tl-info{\n  margin-top:22px;background:var(--bg-panel);border:1px solid var(--line);\n  border-radius:10px;padding:20px 24px;max-width:760px;min-height:110px;\n}\n#tl-info h4{margin:0 0 8px;color:var(--gold);font-size:1.05rem;}\n#tl-info p{margin:0;color:var(--text-muted);line-height:1.6;font-size:.92rem;}\n\n/* ---------- geo vs helio ---------- */\n.compare-wrap{display:flex;gap:36px;flex-wrap:wrap;margin-top:30px;}\n.compare-box{\n  background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;\n  padding:20px;width:260px;text-align:center;\n}\n.compare-box h4{margin:0 0 4px;font-size:.95rem;color:var(--text);}\n.compare-box .sub{font-size:.76rem;color:var(--text-muted);margin-bottom:14px;}\n.mini-stage{position:relative;width:200px;height:200px;margin:0 auto;}\n.mini-center{\n  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);\n  border-radius:50%;z-index:4;\n}\n.mini-center.earth{width:22px;height:22px;background:#5aa6dd;box-shadow:0 0 8px #5aa6dd;}\n.mini-center.sun{width:26px;height:26px;background:radial-gradient(circle at 35% 35%,#fff2c8,var(--sun) 60%,#b9741f);box-shadow:0 0 16px rgba(247,185,85,.7);}\n.mini-orbit{position:absolute;top:50%;left:50%;border:1px solid rgba(255,255,255,.14);border-radius:50%;transform:translate(-50%,-50%);}\n.mini-orbiter{position:absolute;top:0;left:50%;width:100%;height:100%;animation:spin linear infinite;}\n.mini-dot{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);border-radius:50%;}\n\n/* ---------- mindmap ---------- */\n.mindmap-wrap{\n  position:relative;width:100%;max-width:680px;height:480px;margin:10px auto 0;\n}\n.mm-center{\n  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);\n  width:130px;height:130px;border-radius:50%;\n  background:radial-gradient(circle at 35% 32%, #1c2450, var(--bg-panel-2));\n  border:1px solid var(--gold);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n  font-weight:600;font-size:1rem;color:var(--gold);\n  box-shadow:0 0 30px rgba(232,196,104,.25);\n  z-index:3;\n}\n.mm-node{\n  position:absolute;transform:translate(-50%,-50%);\n  width:118px;padding:12px 10px;text-align:center;\n  background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;\n  cursor:pointer;font-size:.86rem;font-weight:600;color:var(--text);z-index:3;\n  transition:border-color .2s, background .2s;\n}\n.mm-node:hover, .mm-node.active{border-color:var(--cyan);background:var(--bg-panel-2);color:var(--cyan);}\n.mm-svg{position:absolute;inset:0;z-index:1;}\n.mm-svg line{stroke:rgba(255,255,255,.15);stroke-width:1.4;transition:stroke .2s;}\n.mm-svg line.lit{stroke:var(--cyan);}\n#mm-info{\n  max-width:620px;margin:16px auto 0;text-align:center;\n  background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;\n  padding:16px 22px;color:var(--text-muted);font-size:.92rem;line-height:1.6;min-height:56px;\n}\n#mm-info b{color:var(--text);}\n\n/* ---------- quiz ---------- */\n.quiz-list{max-width:760px;display:flex;flex-direction:column;gap:16px;}\n.q-item{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}\n.q-item .q-title{font-weight:600;margin-bottom:12px;font-size:.98rem;}\n.q-opts{display:flex;flex-direction:column;gap:8px;}\n.q-opt{\n  text-align:left;background:var(--bg-panel-2);border:1px solid var(--line);\n  color:var(--text-muted);padding:10px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;\n  transition:all .15s;\n}\n.q-opt:hover{border-color:rgba(255,255,255,.3);}\n.q-opt.correct{border-color:#6fcf97;background:rgba(111,207,151,.12);color:#bdf0d3;}\n.q-opt.wrong{border-color:#e08585;background:rgba(224,133,133,.1);color:#f3c9c9;}\n.q-fb{margin-top:10px;font-size:.85rem;color:var(--cyan);min-height:18px;}\n\nfooter.section{min-height:auto;padding:40px 8vw 60px;text-align:center;border-bottom:none;}\nfooter .fnote{color:var(--text-muted);font-size:.8rem;}\n\n@media(max-width:720px){\n  .hero-wrap{flex-direction:column-reverse;}\n  #navdots{right:8px;}\n  .dot span{display:none;}\n  .compare-wrap{justify-content:center;}\n  .mindmap-wrap{height:560px;}\n}\n@media (prefers-reduced-motion: reduce){\n  .orbiter,.mini-orbiter,#stars-fixed .s1,#stars-fixed .s2{animation:none !important;}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"stars-fixed\">\u003cdiv class=\"stars-layer s1\">\u003c/div>\u003cdiv class=\"stars-layer s2\">\u003c/div>\u003c/div>\n\u003cdiv id=\"progress\">\u003c/div>\n\u003cdiv id=\"topbar\">\u003cdiv class=\"brand\">11-sinf · \u003cb>Astronomiya\u003c/b> · 1-mavzu\u003c/div>\u003c/div>\n\n\u003cnav id=\"navdots\">\n  \u003cdiv class=\"dot\" data-target=\"hero\">\u003cspan>Bosh sahifa\u003c/span>\u003c/div>\n  \u003cdiv class=\"dot\" data-target=\"sec1\">\u003cspan>1. Fan va obyekt\u003c/span>\u003c/div>\n  \u003cdiv class=\"dot\" data-target=\"sec2\">\u003cspan>2. Rivojlanish tarixi\u003c/span>\u003c/div>\n  \u003cdiv class=\"dot\" data-target=\"sec3\">\u003cspan>3. Fanlararo aloqa\u003c/span>\u003c/div>\n  \u003cdiv class=\"dot\" data-target=\"sec4\">\u003cspan>Nazorat savollari\u003c/span>\u003c/div>\n\u003c/nav>\n\n\u003c!-- HERO -->\n\u003csection class=\"section\" id=\"hero\">\n  \u003cdiv class=\"hero-wrap\">\n    \u003cdiv class=\"hero-text\">\n      \u003cdiv class=\"eyebrow\">1-mavzu\u003c/div>\n      \u003ch1>Astronomiya nimani o'rganadi?\u003c/h1>\n      \u003cp>Boshingizni ko'tarib osmonga qarang — u yerda ko'rgan har bir yorqin nuqta o'z tarixiga, o'lchamiga va qonuniyatlariga ega. Ushbu darsda biz astronomiya fani bilan tanishamiz, uning necha ming yillik rivojlanish yo'lini kuzatamiz va u boshqa fanlar bilan qanday bog'langanini bilib olamiz.\u003c/p>\n      \u003cdiv class=\"scrolldown\" onclick=\"goTo('sec1')\">Darsni boshlash ↓\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"solar-stage\" id=\"heroSolar\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- SECTION 1 -->\n\u003csection class=\"section\" id=\"sec1\">\n  \u003cdiv class=\"kicker\">1-bo'lim\u003c/div>\n  \u003ch2>Astronomiya fani va uning o'rganish obyekti\u003c/h2>\n  \u003cp class=\"lead\">\u003cb>Astronomiya\u003c/b> — koinotdagi barcha jismlar: yulduzlar, sayyoralar, ularning yo'ldoshlari, kometalar, asteroidlar, galaktikalar hamda butun Koinotning tuzilishi, harakati, kelib chiqishi va rivojlanishini o'rganuvchi fandir. So'z qadimgi yunoncha \"astron\" — yulduz va \"nomos\" — qonun so'zlaridan olingan bo'lib, \"yulduzlar qonuni\" degan ma'noni bildiradi.\u003c/p>\n\n  \u003cdiv class=\"cards-grid\" style=\"margin-bottom:10px;\">\n    \u003cdiv class=\"card\" data-desc=\"Osmon jismlarining fizik tabiati, tarkibi, harorati va nurlanishini o'rganadi. Masalan, yulduzning nima uchun porlashini shu bo'lim tushuntiradi.\">\n      \u003ch3>Astrofizika \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Osmon jismlarining fizik tabiati, tarkibi va nurlanishini o'rganadi.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" data-desc=\"Yoritqichlarning osmondagi aniq o'rnini, koordinatalarini va harakatini juda katta aniqlik bilan o'lchaydi.\">\n      \u003ch3>Astrometriya \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Yoritqichlarning osmondagi o'rnini va harakatini aniq o'lchaydi.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" data-desc=\"Quyosh sistemasi, sayyoralar va boshqa osmon jismlarining qanday paydo bo'lganini o'rganadi.\">\n      \u003ch3>Kosmogoniya \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Osmon jismlarining kelib chiqishini o'rganadi.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" data-desc=\"Butun Koinotning umumiy tuzilishi, kengayishi va rivojlanish qonuniyatlarini o'rganadi.\">\n      \u003ch3>Kosmologiya \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Koinotning umumiy tuzilishi va rivojlanishini o'rganadi.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" data-desc=\"Boshqa yulduzlar atrofida hayot mavjud bo'lish ehtimolini va uning shartlarini tadqiq qiladi.\">\n      \u003ch3>Astrobiologiya \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Koinotda hayot mavjudligi shartlarini tadqiq qiladi.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" data-desc=\"Osmon jismlarining harakat qonunlarini matematik hisob-kitoblar asosida aniqlaydi va bashorat qiladi.\">\n      \u003ch3>Sferik astronomiya \u003cspan class=\"plus\">+\u003c/span>\u003c/h3>\n      \u003cp>Osmon jismlari harakatini matematik jihatdan hisoblaydi.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cp class=\"lead\" style=\"font-size:.85rem;margin-top:4px;\">Kartochkaga bosing — qisqacha izoh ochiladi.\u003c/p>\n\u003c/section>\n\n\u003c!-- SECTION 2 -->\n\u003csection class=\"section\" id=\"sec2\">\n  \u003cdiv class=\"kicker\">2-bo'lim\u003c/div>\n  \u003ch2>Astronomiyaning rivojlanish tarixi\u003c/h2>\n  \u003cp class=\"lead\">Astronomiya insoniyat yaratgan eng qadimgi fanlardan biri. Dehqonchilik uchun fasllarni, dengizda yo'l topish uchun yulduzlarni kuzatish zarurati bu fanga asos solgan. Quyidagi vaqt chizig'idagi har bir davrga bosib, tarixiy jarayon bilan tanishing.\u003c/p>\n\n  \u003cdiv class=\"timeline-wrap\">\n    \u003cdiv class=\"timeline\" id=\"timeline\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"tl-info\">\n    \u003ch4 id=\"tlTitle\">—\u003c/h4>\n    \u003cp id=\"tlText\">Yuqoridagi davrlardan birini tanlang.\u003c/p>\n  \u003c/div>\n\n  \u003ch3 style=\"margin:44px 0 4px;font-size:1.15rem;color:var(--text);\">Geotsentrik va geliotsentrik modellar\u003c/h3>\n  \u003cp class=\"lead\" style=\"margin-bottom:10px;\">Ikki dunyoqarashni solishtiring: qadimgi model Yerni markazga qo'yadi, zamonaviy model esa Quyoshni.\u003c/p>\n  \u003cdiv class=\"compare-wrap\">\n    \u003cdiv class=\"compare-box\">\n      \u003ch4>Geotsentrik model\u003c/h4>\n      \u003cdiv class=\"sub\">Ptolemey, mil. II asr — Yer markazda\u003c/div>\n      \u003cdiv class=\"mini-stage\" id=\"geoStage\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"compare-box\">\n      \u003ch4>Geliotsentrik model\u003c/h4>\n      \u003cdiv class=\"sub\">Kopernik, 1543-yil — Quyosh markazda\u003c/div>\n      \u003cdiv class=\"mini-stage\" id=\"helioStage\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- SECTION 3 -->\n\u003csection class=\"section\" id=\"sec3\">\n  \u003cdiv class=\"kicker\">3-bo'lim\u003c/div>\n  \u003ch2>Astronomiyaning boshqa fanlar bilan aloqasi\u003c/h2>\n  \u003cp class=\"lead\">Astronomiya alohida holda rivojlanmaydi — u ko'plab fanlar bilan chambarchas bog'liq. Quyidagi sxemadagi fan nomiga bosing va astronomiya bilan bog'liqligini bilib oling.\u003c/p>\n\n  \u003cdiv class=\"mindmap-wrap\" id=\"mindmap\">\n    \u003csvg class=\"mm-svg\" id=\"mmSvg\">\u003c/svg>\n    \u003cdiv class=\"mm-center\">Astronomiya\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"mm-info\">\u003cb>Maslahat:\u003c/b> pastdagi fan nomlaridan birini tanlang.\u003c/div>\n\u003c/section>\n\n\u003c!-- SECTION 4 -->\n\u003csection class=\"section\" id=\"sec4\">\n  \u003cdiv class=\"kicker\">Mustahkamlash\u003c/div>\n  \u003ch2>Nazorat savollari\u003c/h2>\n  \u003cp class=\"lead\">O'tilgan mavzu bo'yicha bilimingizni tekshiring. Javobni tanlang.\u003c/p>\n  \u003cdiv class=\"quiz-list\" id=\"quizList\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"footer-sec\" style=\"border-bottom:none;min-height:auto;padding-bottom:60px;\">\n  \u003cp class=\"fnote\" style=\"text-align:center;color:var(--text-muted);font-size:.82rem;\">11-sinf Astronomiya · 1-mavzu · Interaktiv dars ishlanmasi\u003c/p>\n\u003c/section>\n\n\u003cscript>\n/* ============ NAV ============ */\nconst sections = [\"hero\",\"sec1\",\"sec2\",\"sec3\",\"sec4\"];\nfunction goTo(id){ document.getElementById(id).scrollIntoView({behavior:\"smooth\"}); }\ndocument.querySelectorAll('.dot').forEach(d=>{\n  d.addEventListener('click',()=>goTo(d.dataset.target));\n});\nconst dots = document.querySelectorAll('.dot');\nconst observer = new IntersectionObserver((entries)=>{\n  entries.forEach(e=>{\n    if(e.isIntersecting){\n      dots.forEach(d=>d.classList.toggle('active', d.dataset.target===e.target.id));\n    }\n  });\n},{threshold:0.5});\nsections.forEach(id=>observer.observe(document.getElementById(id)));\n\nwindow.addEventListener('scroll',()=>{\n  const h = document.documentElement;\n  const pct = (h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;\n  document.getElementById('progress').style.width = pct+\"%\";\n});\n\n/* ============ SOLAR SYSTEM (hero) ============ */\nfunction buildSolar(container, sizeScale){\n  const stage = document.getElementById(container);\n  const cx = stage.clientWidth || 380;\n  stage.innerHTML = '\u003cdiv class=\"sun\">\u003c/div>';\n  const planets = [\n    {name:\"Merkuriy\",r:0.30,size:8,dur:4,color:\"p-mercury\"},\n    {name:\"Venera\",r:0.44,size:11,dur:7,color:\"p-venus\"},\n    {name:\"Yer\",r:0.58,size:12,dur:10,color:\"p-earth\"},\n    {name:\"Mars\",r:0.72,size:9,dur:15,color:\"p-mars\"},\n    {name:\"Yupiter\",r:0.86,size:20,dur:24,color:\"p-jupiter\"},\n    {name:\"Saturn\",r:1.0,size:17,dur:34,color:\"p-saturn\"},\n  ];\n  planets.forEach(p=>{\n    const orbitSize = cx*p.r;\n    const orbit = document.createElement('div');\n    orbit.className='orbit';\n    orbit.style.width=orbitSize+\"px\";\n    orbit.style.height=orbitSize+\"px\";\n    const orbiter = document.createElement('div');\n    orbiter.className='orbiter';\n    orbiter.style.animationDuration=p.dur+\"s\";\n    const planet = document.createElement('div');\n    planet.className='planet '+p.color;\n    planet.style.width=p.size+\"px\";\n    planet.style.height=p.size+\"px\";\n    planet.title=p.name;\n    orbiter.appendChild(planet);\n    orbit.appendChild(orbiter);\n    stage.appendChild(orbit);\n  });\n  const legend = document.createElement('div');\n  legend.className='legend';\n  legend.textContent = 'Quyosh sistemasi (nisbiy tezlik va masofa, shartli miqyosda)';\n  stage.appendChild(legend);\n}\nbuildSolar('heroSolar');\nwindow.addEventListener('resize', ()=>{ buildSolar('heroSolar'); });\n\n/* ============ TIMELINE ============ */\nconst timelineData = [\n  {year:\"Qad. 3000 y.o.\", label:\"Bobil\", title:\"Bobil astronomiyasi\", text:\"Bobilliklar osmon jismlarining harakatini muntazam kuzatib, birinchi taqvimlarni va yulduz jadvallarini tuzishgan. Ular Oy tutilishlarini oldindan bashorat qila olishgan.\"},\n  {year:\"Qad. 2000 y.o.\", label:\"Qadimgi Misr\", title:\"Qadimgi Misr astronomiyasi\", text:\"Misrliklar Nil daryosi toshqinlarini bashorat qilish uchun yulduzlar, ayniqsa Sirius yulduzini kuzatib, quyosh taqvimini yaratishgan.\"},\n  {year:\"mil. II asr\", label:\"Ptolemey (geotsentrik)\", title:\"Klavdiy Ptolemey — geotsentrik model\", text:\"Qadimgi yunon olimi Ptolemey Yerni Koinot markazi deb hisoblab, Quyosh va sayyoralar Yer atrofida aylanadi degan geotsentrik nazariyani yaratdi. Bu model 1400 yildan ortiq hukmron bo'ldi.\"},\n  {year:\"1543-yil\", label:\"Kopernik (geliotsentrik)\", title:\"Nikolay Kopernik — geliotsentrik model\", text:\"Polyak olimi Kopernik Quyoshni Koinot markaziga qo'ygan geliotsentrik nazariyani ilgari surdi: Yer va boshqa sayyoralar Quyosh atrofida aylanadi.\"},\n  {year:\"1609-yil\", label:\"Galiley\", title:\"Galileo Galiley\", text:\"Teleskopni birinchi bo'lib osmonni kuzatishga qo'llagan olim. U Yupiterning yo'ldoshlarini, Oydagi tog'larni va Quyoshdagi dog'larni kashf etib, geliotsentrik nazariyani tasdiqladi.\"},\n  {year:\"1609–1619\", label:\"Kepler\", title:\"Iogann Kepler\", text:\"Sayyoralarning Quyosh atrofida ellips shaklidagi orbita bo'yicha harakatlanish qonunlarini (Kepler qonunlari) matematik jihatdan isbotladi.\"},\n  {year:\"1687-yil\", label:\"Nyuton\", title:\"Isaak Nyuton\", text:\"Butun olam tortishish qonunini kashf etib, sayyoralar nima uchun aynan shunday harakatlanishini fizik jihatdan tushuntirib berdi.\"},\n  {year:\"XX–XXI asr\", label:\"Zamonaviy kosmik tadqiqotlar\", title:\"Zamonaviy davr\", text:\"Sun'iy yo'ldoshlar, kosmik teleskoplar (Hubble, James Webb) va kosmik missiyalar yordamida olimlar Koinotni undan-da chuqurroq o'rganmoqda.\"},\n];\nconst tlEl = document.getElementById('timeline');\ntimelineData.forEach((d,i)=>{\n  const item = document.createElement('div');\n  item.className='tl-item'+(i===0?' active':'');\n  item.innerHTML = `\u003cdiv class=\"tl-dot\">\u003c/div>\u003cdiv class=\"tl-year\">${d.year}\u003c/div>\u003cdiv class=\"tl-label\">${d.label}\u003c/div>`;\n  item.addEventListener('click',()=>{\n    document.querySelectorAll('.tl-item').forEach(x=>x.classList.remove('active'));\n    item.classList.add('active');\n    document.getElementById('tlTitle').textContent = d.title;\n    document.getElementById('tlText').textContent = d.text;\n  });\n  tlEl.appendChild(item);\n});\ndocument.getElementById('tlTitle').textContent = timelineData[0].title;\ndocument.getElementById('tlText').textContent = timelineData[0].text;\n\n/* ============ GEO vs HELIO mini animations ============ */\nfunction buildMini(containerId, mode){\n  const stage = document.getElementById(containerId);\n  const size = stage.clientWidth || 200;\n  const centerCls = mode==='geo' ? 'earth' : 'sun';\n  stage.innerHTML = `\u003cdiv class=\"mini-center ${centerCls}\">\u003c/div>`;\n  let bodies;\n  if(mode==='geo'){\n    bodies=[\n      {r:0.42,size:14,dur:5,color:'#f7b955',isSun:true},\n      {r:0.62,size:8,dur:8,color:'#c96a45'},\n      {r:0.82,size:10,dur:12,color:'#d8b48f'},\n    ];\n  } else {\n    bodies=[\n      {r:0.36,size:7,dur:3,color:'#b7b0a6'},\n      {r:0.5,size:8,dur:5,color:'#e3c08a'},\n      {r:0.64,size:9,dur:7,color:'#5aa6dd'},\n      {r:0.82,size:8,dur:10,color:'#c96a45'},\n    ];\n  }\n  bodies.forEach(b=>{\n    const orbitSize = size*b.r;\n    const orbit=document.createElement('div');\n    orbit.className='mini-orbit';\n    orbit.style.width=orbitSize+\"px\";\n    orbit.style.height=orbitSize+\"px\";\n    const orbiter=document.createElement('div');\n    orbiter.className='mini-orbiter';\n    orbiter.style.animationDuration=b.dur+\"s\";\n    const dot=document.createElement('div');\n    dot.className='mini-dot';\n    dot.style.width=b.size+\"px\";\n    dot.style.height=b.size+\"px\";\n    dot.style.background=b.color;\n    if(b.isSun){ dot.style.boxShadow='0 0 10px '+b.color; }\n    orbiter.appendChild(dot);\n    orbit.appendChild(orbiter);\n    stage.appendChild(orbit);\n  });\n}\nbuildMini('geoStage','geo');\nbuildMini('helioStage','helio');\n\n/* ============ CARDS (section 1) ============ */\ndocument.querySelectorAll('.card').forEach(card=>{\n  card.addEventListener('click',()=>{\n    const wasOpen = card.classList.contains('open');\n    document.querySelectorAll('.card').forEach(c=>{\n      c.classList.remove('open');\n      c.querySelector('p').textContent = c.querySelector('p').dataset.short || c.querySelector('p').textContent;\n    });\n    if(!wasOpen){\n      card.classList.add('open');\n      const p = card.querySelector('p');\n      if(!p.dataset.short) p.dataset.short = p.textContent;\n      p.textContent = card.dataset.desc;\n    }\n  });\n});\n\n/* ============ MINDMAP (section 3) ============ */\nconst mmData = [\n  {name:\"Fizika\", angle:-90, text:\"\u003cb>Fizika\u003c/b> — osmon jismlarining harakat qonunlari, tortishish kuchi va nurlanish tabiati fizika qonunlari asosida tushuntiriladi.\"},\n  {name:\"Matematika\", angle:-18, text:\"\u003cb>Matematika\u003c/b> — sayyoralar orbitasini hisoblash, masofa va tezliklarni aniqlashda matematik usullardan foydalaniladi.\"},\n  {name:\"Kimyo\", angle:54, text:\"\u003cb>Kimyo\u003c/b> — yulduzlar va sayyoralar tarkibini spektral tahlil (spektroskopiya) yordamida kimyoviy elementlar asosida aniqlanadi.\"},\n  {name:\"Geografiya\", angle:126, text:\"\u003cb>Geografiya\u003c/b> — Yerning shakli, iqlim mintaqalari va kun-tun almashinuvi osmon jismlarining harakati bilan bog'liq holda o'rganiladi.\"},\n  {name:\"Biologiya\", angle:198, text:\"\u003cb>Biologiya\u003c/b> — boshqa sayyoralarda hayot mavjudligi shartlarini (astrobiologiya) o'rganishda biologik bilimlar zarur bo'ladi.\"},\n];\nfunction layoutMindmap(){\n  const wrap = document.getElementById('mindmap');\n  const W = wrap.clientWidth, H = wrap.clientHeight;\n  const cx = W/2, cy = H/2;\n  const radius = Math.min(W,H)/2 - 70;\n  const svg = document.getElementById('mmSvg');\n  svg.setAttribute('width', W); svg.setAttribute('height', H);\n  svg.innerHTML='';\n  document.querySelectorAll('.mm-node').forEach(n=>n.remove());\n  mmData.forEach((d,i)=>{\n    const rad = d.angle*Math.PI/180;\n    const x = cx + radius*Math.cos(rad);\n    const y = cy + radius*Math.sin(rad);\n    d._x=x; d._y=y;\n    const line = document.createElementNS('http://www.w3.org/2000/svg','line');\n    line.setAttribute('x1',cx); line.setAttribute('y1',cy);\n    line.setAttribute('x2',x); line.setAttribute('y2',y);\n    line.id = 'mmline-'+i;\n    svg.appendChild(line);\n    const node = document.createElement('div');\n    node.className='mm-node';\n    node.style.left=x+'px'; node.style.top=y+'px';\n    node.textContent=d.name;\n    node.addEventListener('click',()=>{\n      document.querySelectorAll('.mm-node').forEach(n=>n.classList.remove('active'));\n      document.querySelectorAll('.mm-svg line').forEach(l=>l.classList.remove('lit'));\n      node.classList.add('active');\n      document.getElementById('mmline-'+i).classList.add('lit');\n      document.getElementById('mm-info').innerHTML = d.text;\n    });\n    wrap.appendChild(node);\n  });\n}\nlayoutMindmap();\nwindow.addEventListener('resize', layoutMindmap);\n\n/* ============ QUIZ ============ */\nconst quizData = [\n  {q:\"Astronomiya so'zi qadimgi yunon tilidan tarjima qilinganda qanday ma'noni bildiradi?\", opts:[\"Yulduzlar qonuni\",\"Osmon xaritasi\",\"Koinot fani\",\"Sayyoralar tizimi\"], correct:0},\n  {q:\"Geotsentrik model bo'yicha Koinot markazida nima turadi?\", opts:[\"Quyosh\",\"Oy\",\"Yer\",\"Yulduz\"], correct:2},\n  {q:\"Geliotsentrik nazariyani birinchi bo'lib kim ilgari surgan?\", opts:[\"Ptolemey\",\"Nikolay Kopernik\",\"Isaak Nyuton\",\"Galileo Galiley\"], correct:1},\n  {q:\"Yulduzlarning kimyoviy tarkibini o'rganishda qaysi fan bilan aloqa muhim?\", opts:[\"Geografiya\",\"Biologiya\",\"Kimyo\",\"Tarix\"], correct:2},\n  {q:\"Osmon jismlarining kelib chiqishini qaysi astronomiya bo'limi o'rganadi?\", opts:[\"Astrometriya\",\"Kosmogoniya\",\"Astrofizika\",\"Kosmologiya\"], correct:1},\n];\nconst quizList = document.getElementById('quizList');\nquizData.forEach((qd,qi)=>{\n  const item = document.createElement('div');\n  item.className='q-item';\n  const optsHtml = qd.opts.map((o,oi)=>`\u003cdiv class=\"q-opt\" data-i=\"${oi}\">${o}\u003c/div>`).join('');\n  item.innerHTML = `\u003cdiv class=\"q-title\">${qi+1}. ${qd.q}\u003c/div>\u003cdiv class=\"q-opts\">${optsHtml}\u003c/div>\u003cdiv class=\"q-fb\">\u003c/div>`;\n  quizList.appendChild(item);\n  item.querySelectorAll('.q-opt').forEach(opt=>{\n    opt.addEventListener('click',()=>{\n      if(item.dataset.answered) return;\n      item.dataset.answered='1';\n      const idx = parseInt(opt.dataset.i);\n      item.querySelectorAll('.q-opt').forEach((o,oi)=>{\n        if(oi===qd.correct) o.classList.add('correct');\n        else if(oi===idx) o.classList.add('wrong');\n      });\n      item.querySelector('.q-fb').textContent = idx===qd.correct ? \"To'g'ri javob! ✓\" : \"Noto'g'ri. To'g'ri javob yashil rangda belgilandi.\";\n    });\n  });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Yoritgichlarning sutkalik ko'rinma harakati", "icon": "🌗", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Yoritgichlarning sutkalik ko'rinma harakati\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#9aa6c8;--ac:#ffc94a;--ac2:#6fb4ff}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.55}\n.w{max-width:980px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:clamp(1.6rem,5vw,2.4rem);margin:.2em 0}\nh2{color:var(--ac);font-size:1.3rem;margin:1.6em 0 .5em}\n.tag{color:var(--ac2);font-family:system-ui,sans-serif;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}\np{margin:.5em 0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}\n.card{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid #26305a}\n.card b{color:var(--ac)}\n.stage{background:var(--card);border:1px solid #26305a;border-radius:14px;padding:12px;margin-top:12px}\ncanvas{width:100%;max-width:560px;aspect-ratio:1;display:block;margin:0 auto;border-radius:50%;background:#000}\n.ctl{font-family:system-ui,sans-serif;font-size:.92rem;margin:10px 0}\n.ctl label{display:flex;justify-content:space-between;gap:8px;color:var(--mut)}\n.ctl b{color:var(--tx)}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\nbutton{font:inherit;font-family:system-ui,sans-serif;font-size:.9rem;background:#22305f;color:var(--tx);border:1px solid #3a4a8a;border-radius:20px;padding:8px 14px;cursor:pointer}\nbutton:hover,button.on{background:var(--ac);color:#111;border-color:var(--ac)}\n.out{font-family:system-ui,sans-serif;font-size:.95rem;background:#0e1430;border-radius:10px;padding:10px 12px;margin-top:8px}\n.out span{color:var(--ac)}\n.two{display:grid;grid-template-columns:1fr;gap:12px}\n@media(min-width:820px){.two{grid-template-columns:1.1fr 1fr;align-items:start}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"w\">\n\u003cdiv class=\"tag\">11-sinf · Astronomiya · 2-mavzu\u003c/div>\n\u003ch1>Yoritgichlarning sutkalik ko'rinma harakatlari\u003c/h1>\n\u003cp>1-bo'lim: Osmon gumbazi qanday «aylanadi»?\u003c/p>\n\n\u003ch2>Asosiy g'oya\u003c/h2>\n\u003cp>Yer o'z o'qi atrofida g'arbdan sharqqa \u003cb>24 soatda\u003c/b> (soatiga 15°) aylanadi. Shuning uchun kuzatuvchiga Quyosh, Oy va yulduzlar \u003cb>sharqdan chiqib, janub tomonda eng baland nuqtaga ko'tarilib, g'arbda botayotgandek\u003c/b> tuyuladi. Bu haqiqiy harakat emas — \u003cb>ko'rinma\u003c/b> harakat.\u003c/p>\n\n\u003ch2>Asosiy tushunchalar\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003cb>Osmon sferasi\u003c/b>\u003cbr>Kuzatuvchi markazida turgan, yoritgichlar «yopishgan» xayoliy sfera.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Zenit\u003c/b>\u003cbr>Kuzatuvchi tepasidagi nuqta (qo'rg'oshin chizig'ining yuqoriga davomi).\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Matematik gorizont\u003c/b>\u003cbr>Zenitdan 90° uzoqdagi katta aylana; osmonning ko'rinadigan va ko'rinmaydigan qismini ajratadi.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Dunyo o'qi\u003c/b>\u003cbr>Osmon sferasi aylanadigandek tuyulgan o'q — Yer o'qining davomi.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Dunyo qutblari\u003c/b>\u003cbr>Dunyo o'qining sferani kesgan nuqtalari. Shimoliy qutb yaqinida \u003cb>Qutb yulduzi\u003c/b> (Polyaris) turadi.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Avj nuqtasi\u003c/b>\u003cbr>Yoritgich meridianni kesib o'tadigan, eng baland turgan payti (kulminatsiya).\u003c/div>\n\u003c/div>\n\n\u003ch2>Simulyatsiya: osmon gumbazi\u003c/h2>\n\u003cp>Gumbaz tepadan (zenitdan) qaralmoqda: markaz — zenit, tashqi aylana — gorizont. Sariq nuqta — Quyosh (yoki tanlangan yoritgich), oq nuqtalar — yulduzlar.\u003c/p>\n\u003cdiv class=\"stage two\">\n\u003cdiv>\n\u003ccanvas id=\"c\" width=\"700\" height=\"700\">\u003c/canvas>\n\u003c/div>\n\u003cdiv>\n\u003cdiv class=\"btns\">\n\u003cbutton id=\"play\" class=\"on\">⏸ To'xtatish\u003c/button>\n\u003cbutton id=\"trail\">Trayektoriya: yoqilgan\u003c/button>\n\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>Vaqt (mahalliy soat) \u003cb id=\"tv\">\u003c/b>\u003c/label>\u003cinput id=\"time\" type=\"range\" min=\"0\" max=\"24\" step=\"0.01\" value=\"9\">\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>Tezlik \u003cb id=\"sv\">\u003c/b>\u003c/label>\u003cinput id=\"speed\" type=\"range\" min=\"0.2\" max=\"12\" step=\"0.1\" value=\"2\">\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>Kuzatuvchi geografik kengligi φ \u003cb id=\"lv\">\u003c/b>\u003c/label>\u003cinput id=\"lat\" type=\"range\" min=\"0\" max=\"90\" step=\"1\" value=\"41\">\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton data-l=\"0\">Ekvator 0°\u003c/button>\u003cbutton data-l=\"41\">Toshkent 41°\u003c/button>\u003cbutton data-l=\"60\">Yuqori kenglik 60°\u003c/button>\u003cbutton data-l=\"90\">Shimoliy qutb 90°\u003c/button>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>Yoritgich og'ishi δ (Quyosh) \u003cb id=\"dv\">\u003c/b>\u003c/label>\u003cinput id=\"dec\" type=\"range\" min=\"-23.5\" max=\"23.5\" step=\"0.5\" value=\"0\">\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton data-d=\"0\">Tengkunlik 0°\u003c/button>\u003cbutton data-d=\"23.5\">Yoz 23,5°\u003c/button>\u003cbutton data-d=\"-23.5\">Qish −23,5°\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"out\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003ch2>Kenglikka qarab nima o'zgaradi?\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003cb>Ekvatorda (φ = 0°)\u003c/b>\u003cbr>Dunyo o'qi gorizontda yotadi, qutblar gorizont ustida. Yoritgichlar gorizontga tik chiqib, tik botadi; har bir yoritgich 12 soat ko'rinadi.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>O'rta kengliklarda\u003c/b>\u003cbr>Qutb balandligi = φ. Yoritgichlar gorizontga qiya burchak ostida chiqadi. Qutb atrofidagi yulduzlar hech botmaydi.\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Qutbda (φ = 90°)\u003c/b>\u003cbr>Qutb zenitda. Yoritgichlar gorizontga parallel aylanadi: yo chiqmaydi, yo botmaydi.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\" style=\"margin-top:12px\">\u003cb>Muhim qoida:\u003c/b> qutbning gorizontdan balandligi kuzatuvchining geografik kengligiga teng. Yulduzning balandligi: sin h = sin φ · sin δ + cos φ · cos δ · cos t (t — soat burchagi).\u003c/div>\n\n\u003ch2>Savollar\u003c/h2>\n\u003cdiv class=\"card\">1. Nima uchun Quyosh sharqdan chiqadi? · 2. Toshkentda Qutb yulduzi qanday balandlikda ko'rinadi? · 3. Ekvatorda yulduzlar nima uchun tik chiqadi? · 4. Qutbda Quyosh yarim yil botmaydi — nega?\u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst cv=document.getElementById('c'),g=cv.getContext('2d'),W=700,cx=350,cy=350,R=320;\nconst $=id=>document.getElementById(id);\nconst rad=Math.PI/180;\nlet t=9,playing=true,trail=true,lat=41,dec=0,last=0;\n// yulduzlar (tasodifiy, doimiy)\nlet s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};\nconst stars=[];for(let i=0;i\u003c320;i++)stars.push({a:rnd()*360,d:Math.asin(2*rnd()-1)/rad,m:.6+rnd()*1.6});\n// Katta Ayiq (Ursa Major) taxminiy kengliklari va Polyaris\nconst polaris={a:0,d:89.3};\nfunction horiz(H,d,f){ // H, d gradusda; -> N,E,U\n H*=rad;d*=rad;f*=rad;\n return{N:Math.cos(f)*Math.sin(d)-Math.sin(f)*Math.cos(d)*Math.cos(H),\n E:-Math.cos(d)*Math.sin(H),U:Math.sin(f)*Math.sin(d)+Math.cos(f)*Math.cos(d)*Math.cos(H)}}\nfunction pos(v){const h=Math.asin(Math.max(-1,Math.min(1,v.U)))/rad;const rho=(90-h)/90*R;\n const n=Math.hypot(v.N,v.E)||1;return{x:cx-v.E/n*rho,y:cy-v.N/n*rho,h}}\nfunction draw(){\n const sun=horiz(t*15-180,dec,lat);const sh=Math.asin(sun.U)/rad;\n const k=Math.max(0,Math.min(1,(sh+8)/14)); // kunduz koeffitsiyenti\n g.clearRect(0,0,W,W);\n g.save();g.beginPath();g.arc(cx,cy,R,0,7);g.clip();\n const gr=g.createRadialGradient(cx,cy,0,cx,cy,R);\n const m=(a,b)=>Math.round(a+(b-a)*k);\n gr.addColorStop(0,`rgb(${m(5,70)},${m(8,150)},${m(25,225)})`);gr.addColorStop(1,`rgb(${m(10,150)},${m(15,200)},${m(40,240)})`);\n g.fillStyle=gr;g.fillRect(0,0,W,W);\n // almukantaratlar\n g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;\n [30,60].forEach(h=>{g.beginPath();g.arc(cx,cy,(90-h)/90*R,0,7);g.stroke()});\n g.beginPath();g.moveTo(cx,cy-R);g.lineTo(cx,cy+R);g.moveTo(cx-R,cy);g.lineTo(cx+R,cy);g.stroke();\n // yulduzlar\n stars.forEach(o=>{const p=pos(horiz(t*15-180-o.a+180,o.d,lat));\n  if(p.h\u003c0)return;g.fillStyle=`rgba(255,255,255,${(1-k)*.9})`;g.beginPath();g.arc(p.x,p.y,o.m,0,7);g.fill()});\n // qutb yulduzi va qutb\n const pp=pos(horiz(0,90,lat));\n if(pp.h>=0){g.strokeStyle='#6fb4ff';g.lineWidth=1.5;g.beginPath();g.arc(pp.x,pp.y,7,0,7);g.stroke();\n  g.fillStyle='#6fb4ff';g.font='18px system-ui';g.fillText('Qutb yulduzi',pp.x+10,pp.y-8)}\n // Quyosh trayektoriyasi\n if(trail){g.lineWidth=2;let prev=null;\n  for(let x=0;x\u003c=360;x+=2){const p=pos(horiz(x,dec,lat));\n   if(prev){g.strokeStyle=p.h>=0&&prev.h>=0?'rgba(255,201,74,.9)':'rgba(255,201,74,.0)';\n    if(p.h>=0&&prev.h>=0){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke()}}\n   prev=p}}\n // Quyosh\n const sp=pos(sun);\n if(sp.h>=-2){g.shadowColor='#ffc94a';g.shadowBlur=25;g.fillStyle='#ffc94a';g.beginPath();g.arc(sp.x,sp.y,13,0,7);g.fill();g.shadowBlur=0}\n g.restore();\n g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();\n g.fillStyle='#fff';g.font='bold 24px system-ui';g.textAlign='center';\n g.fillText('Sh',cx,cy-R+30);g.fillText('J',cx,cy+R-14);g.fillText('Sharq',cx-R+42,cy+8);g.fillText('G\\'arb',cx+R-38,cy+8);\n g.fillStyle='#e33';g.beginPath();g.arc(cx,cy,4,0,7);g.fill();g.fillStyle='#fff';g.font='16px system-ui';g.fillText('zenit',cx,cy-10);g.textAlign='left';\n info(sh)}\nfunction info(sh){\n const l=lat*rad,d=dec*rad;let c=-Math.tan(l)*Math.tan(d),txt;\n const hmax=90-Math.abs(lat-dec);\n if(c>=1)txt='Yoritgich butun sutka gorizont \u003cspan>ostida\u003c/span> (qutb tuni).';\n else if(c\u003c=-1)txt='Yoritgich butun sutka gorizont \u003cspan>ustida\u003c/span> (qutb kuni).';\n else{const H0=Math.acos(c)/rad;txt=`Kunduz uzunligi: \u003cspan>${(2*H0/15).toFixed(1)} soat\u003c/span>`}\n $('out').innerHTML=`Qutb balandligi: \u003cspan>${lat}°\u003c/span>\u003cbr>Quyosh hozirgi balandligi: \u003cspan>${sh.toFixed(0)}°\u003c/span>\u003cbr>Avj nuqtasidagi balandligi: \u003cspan>${hmax.toFixed(1)}°\u003c/span>\u003cbr>${txt}`}\nfunction hh(x){const H=Math.floor(x)%24,M=Math.floor((x%1)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')}\nfunction ui(){$('tv').textContent=hh(t);$('lv').textContent=lat+'°';$('dv').textContent=dec+'°';$('sv').textContent='×'+$('speed').value;$('time').value=t}\nfunction loop(ts){const dt=(ts-last)/1000;last=ts;\n if(playing){t=(t+dt*parseFloat($('speed').value))%24;ui()}\n draw();requestAnimationFrame(loop)}\n$('time').oninput=e=>{t=parseFloat(e.target.value);ui()};\n$('speed').oninput=ui;\n$('lat').oninput=e=>{lat=+e.target.value;ui()};\n$('dec').oninput=e=>{dec=+e.target.value;ui()};\ndocument.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lat=+b.dataset.l;$('lat').value=lat;ui()});\ndocument.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dec=+b.dataset.d;$('dec').value=dec;ui()});\n$('play').onclick=e=>{playing=!playing;e.target.classList.toggle('on',playing);e.target.textContent=playing?\"⏸ To'xtatish\":'▶ Davom ettirish'};\n$('trail').onclick=e=>{trail=!trail;e.target.textContent='Trayektoriya: '+(trail?'yoqilgan':\"o'chirilgan\")};\nui();requestAnimationFrame(ts=>{last=ts;loop(ts)});\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"title": "Yerning o'z o'qi atrofida aylanishi. Fuko mayatnigi", "icon": "🌍", "html": "\u003c!DOCTYPE html>\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003ctitle>Yerning oʻz oʻqi atrofida aylanishi. Fuko mayatnigi\u003c/title>\n\u003cstyle>\n:root{--bg:#eef2f6;--card:#fff;--fg:#0e1726;--mut:#52607a;--ac:#b36200;--ln:#cfd8e3;--ok:#16794a;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0b1220;--card:#131d33;--fg:#e8eefc;--mut:#9fb0cf;--ac:#f2a93b;--ln:#26344f;--ok:#4cc38a;--no:#ff7b72}}\n:root[data-theme=\"dark\"]{--bg:#0b1220;--card:#131d33;--fg:#e8eefc;--mut:#9fb0cf;--ac:#f2a93b;--ln:#26344f;--ok:#4cc38a;--no:#ff7b72}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\nmain{max-width:780px;margin:auto;padding:12px 14px 40px}\nh1,h2{font-family:\"Iowan Old Style\",Georgia,serif;line-height:1.2}h1{font-size:1.6rem;margin:.4rem 0}h2{font-size:1.4rem;margin:.2rem 0 .6rem}h3{font-size:1.05rem;margin:1.2rem 0 .4rem;color:var(--ac)}\nheader{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}\np.sub{margin:0;color:var(--mut);font-size:.92rem}\nnav{display:flex;gap:6px;margin:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}\nbutton,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 11px;cursor:pointer}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}\nnav button{flex:1;font-size:.9rem}nav button.on,.row button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nsection{display:none;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}section.on{display:block}\ncanvas{width:100%;height:auto;display:block;background:#0d1830;border-radius:10px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.row label{display:flex;flex-direction:column;gap:2px;font-size:.9rem;flex:1;min-width:160px}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.out{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.95rem}.out b{color:var(--ac)}\n.f{font-family:Georgia,serif;font-size:1.1rem;background:var(--bg);padding:6px 10px;border-radius:8px;display:inline-block}\nul{padding-left:1.2rem;margin:.4rem 0}li{margin:.2rem 0}\n.q{border-top:1px solid var(--ln);padding:10px 0}.q p{margin:.2rem 0}.q button{display:block;width:100%;text-align:left;margin:5px 0}\n.q button.ok{border-color:var(--ok);color:var(--ok)}.q button.no{border-color:var(--no);color:var(--no)}.fb{font-size:.9rem;color:var(--mut)}\n.box{margin-top:16px;border:1px solid var(--ac);border-radius:12px;padding:14px 16px;background:var(--card)}\n@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cdiv>\u003cp class=\"sub\">11-sinf · Astronomiya · 3-mavzu\u003c/p>\u003ch1>Yerning oʻz oʻqi atrofida aylanishiga dalillar. Fuko mayatnigi\u003c/h1>\u003c/div>\u003cbutton id=\"th\" aria-label=\"Mavzuni almashtirish\">Quyuq/yorugʻ\u003c/button>\u003c/header>\n\u003cnav>\u003cbutton class=\"on\">1. Aylanish va dalillar\u003c/button>\u003cbutton>2. Fuko mayatnigi\u003c/button>\u003cbutton>3. Natijalar\u003c/button>\u003c/nav>\n\n\u003csection class=\"on\" id=\"s1\">\u003ch2>Yerning oʻz oʻqi atrofida aylanishi\u003c/h2>\n\u003cp>Yer oʻz oʻqi atrofida gʻarbdan sharqqa, yaʼni Shimoliy qutbdan qaralganda soat strelkasiga qarshi aylanadi. Aylanish oʻqi orbita tekisligiga perpendikulyardan ≈23,5° ogʻgan.\u003c/p>\n\u003cul>\u003cli>\u003cb>Yulduz sutkasi\u003c/b> ≈ 23 s 56 daq 4 s: Yerning yulduzlarga nisbatan bir toʻliq aylanishi.\u003c/li>\n\u003cli>\u003cb>Quyosh sutkasi\u003c/b> = 24 soat (oʻrtacha): Yer orbita boʻylab ham siljiydi, shuning uchun Quyoshga nisbatan ≈4 daqiqa ortiq burilish kerak.\u003c/li>\n\u003cli>\u003cb>Burchak tezlik\u003c/b> ω = 2π/T ≈ 7,29·10⁻⁵ rad/s, Yerning hamma nuqtasida bir xil.\u003c/li>\n\u003cli>\u003cb>Chiziqli tezlik\u003c/b> v = ωR·cosφ (m/s). R ≈ 6371 km. Qutbga yaqinlashgan sari parallel aylanasi kichrayadi, nuqta bir sutkada qisqa yoʻl bosadi, shuning uchun v kamayadi.\u003c/li>\u003c/ul>\n\u003ch3>Dalillar\u003c/h3>\u003cul>\u003cli>\u003cb>Fuko mayatnigi:\u003c/b> tebranish tekisligi buriladi (2-boʻlim).\u003c/li>\u003cli>\u003cb>Erkin tushish:\u003c/b> jism sharqqa ogʻadi (100 m balandlikdan taxminan 1–2 sm), chunki balandlikda joy tezligi kattaroq.\u003c/li>\u003cli>\u003cb>Koriolis kuchi:\u003c/b> siklonlar, passat shamollari va daryo qirgʻoqlari yuvilishida sezilarli tendensiya.\u003c/li>\u003cli>\u003cb>Siqiqlik:\u003c/b> ekvatorial radius ≈6378 km, qutbiy ≈6357 km.\u003c/li>\u003cli>\u003cb>Yulduzlarning kunlik harakati\u003c/b> va \u003cb>sunʼiy yoʻldoshlarni sharqqa uchirish.\u003c/b>\u003c/li>\u003c/ul>\n\u003ch3>Animatsiya: kecha va kunduz\u003c/h3>\u003ccanvas id=\"c1\" width=\"640\" height=\"340\">\u003c/canvas>\n\u003ch3>Simulyatsiya: chiziqli tezlik\u003c/h3>\n\u003cdiv class=\"row\">\u003clabel>Kenglik φ = \u003cb id=\"l1v\">41\u003c/b>°\u003cinput id=\"l1\" type=\"range\" min=\"0\" max=\"90\" value=\"41\">\u003c/label>\u003cbutton id=\"k1\">Yer aylanish tezligini oʻzgartir (×1)\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"o1\">\u003c/div>\n\u003cdiv id=\"q1\">\u003c/div>\u003ch3>Mustaqil ishlash\u003c/h3>\u003col>\u003cli>Toshkent (φ≈41°) nuqtasining chiziqli tezligini formuladan hisoblang va simulyatsiya bilan solishtiring.\u003c/li>\u003cli>Nega yer sirtidagi biz bu tezlikni sezmaymiz?\u003c/li>\u003cli>Quyosh va yulduz sutkasi orasidagi farq nimadan kelib chiqadi?\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection id=\"s2\">\u003ch2>Fuko mayatnigi\u003c/h2>\n\u003cp>1851-yil Leon Fuko Parij Panteonida uzunligi 67 m, yuki ≈28 kg boʻlgan mayatnik osdi. Mayatnikka tebranish tekisligini burishga undaydigan kuch taʼsir etmaydi, shuning uchun tekislik inertsial fazoda oʻz yoʻnalishini saqlaydi, uning ostida esa Yer aylanib oʻtadi. Kuzatuvchiga tekislik buriladigandek tuyuladi: Shimoliy yarim sharda soat strelkasi boʻyicha, Janubiyda unga qarshi.\u003c/p>\n\u003cp>\u003cspan class=\"f\">T = 24 soat / sinφ\u003c/span> (aniqrogʻi, 24 soat oʻrniga yulduz sutkasi ≈23,93 soat). Qutbda (φ=90°) T ≈ 24 soat, ekvatorda (φ=0°) tekislik aylanmaydi. Burilish tezligi ≈15°/soat·sinφ. Tebranish davri T₀ = 2π√(L/g), g ≈ 9,81 m/s².\u003c/p>\n\u003ch3>Animatsiya va simulyatsiya (yuqoridan koʻrinish)\u003c/h3>\u003ccanvas id=\"c2\" width=\"640\" height=\"340\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003clabel>Kenglik φ = \u003cb id=\"l2v\">41\u003c/b>°\u003cinput id=\"l2\" type=\"range\" min=\"0\" max=\"90\" value=\"41\">\u003c/label>\u003clabel>Uzunlik L = \u003cb id=\"L2v\">67\u003c/b> m\u003cinput id=\"L2\" type=\"range\" min=\"1\" max=\"70\" value=\"67\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton data-sp=\"1\">×1\u003c/button>\u003cbutton data-sp=\"100\">×100\u003c/button>\u003cbutton data-sp=\"1000\" class=\"on\">×1000\u003c/button>\u003cselect id=\"h2\">\u003coption value=\"1\">Shimoliy yarim shar\u003c/option>\u003coption value=\"-1\">Janubiy yarim shar\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton id=\"tk\">Toshkent (41°)\u003c/button>\u003cbutton id=\"qt\">Qutb (90°)\u003c/button>\u003cbutton id=\"ek\">Ekvator (0°)\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"o2\">\u003c/div>\n\u003cdiv id=\"q2\">\u003c/div>\u003ch3>Mustaqil ishlash\u003c/h3>\u003col>\u003cli>Toshkent uchun T ni hisoblang va sinφ qiymatidan foydalaning.\u003c/li>\u003cli>Nega mayatnik uzun va yuki ogʻir qilinadi?\u003c/li>\u003cli>Janubiy yarim sharda burilish yoʻnalishi qanday va nega?\u003c/li>\u003c/ol>\u003c/section>\n\n\u003csection id=\"s3\">\u003ch2>Kuzatiladigan natijalar va ahamiyati\u003c/h2>\n\u003cul>\u003cli>\u003cb>Kecha-kunduz:\u003c/b> Yerning yarmi Quyoshga qaragan, aylanish tufayli ular almashadi.\u003c/li>\u003cli>\u003cb>Vaqt mintaqalari:\u003c/b> 360°/24 soat = 15° ga 1 soat, 24 ta mintaqa.\u003c/li>\u003cli>\u003cb>Koriolis effekti:\u003c/b> Shimoliy yarim sharda harakat oʻngga, Janubiyda chapga ogʻadi. Siklon Shimolda soat strelkasiga qarshi, Janubda uning boʻyicha aylanadi.\u003c/li>\u003cli>\u003cb>Siqiqlik:\u003c/b> aylanish natijasida ekvatorda Yer kengaygan.\u003c/li>\u003cli>\u003cb>Kunlik harakat:\u003c/b> yulduzlar Qutb yulduzi atrofida soatiga 15° buriladi.\u003c/li>\u003cli>\u003cb>Kosmik uchirishlar:\u003c/b> ekvatorda sirt tezligi ≈465 m/s, Baykonurda (45,6°) ≈325 m/s. Sharqqa uchirilganda bu tezlik raketaga qoʻshiladi, shuning uchun kosmodromlar (masalan, Kuru, 5° sh.k.) ekvatorga yaqin joylashtiriladi.\u003c/li>\u003cli>\u003cb>Navigatsiya:\u003c/b> uchish va suzishda Koriolis taʼsiri hisobga olinadi.\u003c/li>\u003c/ul>\n\u003ch3>Animatsiya: kun/tun chegarasi va vaqt mintaqalari\u003c/h3>\u003ccanvas id=\"c3\" width=\"720\" height=\"360\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003cbutton id=\"pl3\">Toʻxtat\u003c/button>\u003cbutton id=\"rt3\">Real vaqt\u003c/button>\u003c/div>\n\u003ch3>Simulyatsiya (a): mahalliy vaqt\u003c/h3>\n\u003cdiv class=\"row\">\u003cselect id=\"ct\">\u003c/select>\u003c/div>\u003cdiv class=\"out\" id=\"o3\">\u003c/div>\n\u003ch3>Simulyatsiya (b): Koriolis va siklon\u003c/h3>\u003ccanvas id=\"c4\" width=\"640\" height=\"280\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003cbutton id=\"cy\">Siklon (past bosim)\u003c/button>\u003c/div>\n\u003ch3>Simulyatsiya (c): yulduzlarning kunlik yoʻli\u003c/h3>\u003ccanvas id=\"c5\" width=\"640\" height=\"320\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003clabel>Kuzatish vaqti: \u003cb id=\"l5v\">3\u003c/b> soat (≈\u003cb id=\"d5\">45\u003c/b>°)\u003cinput id=\"l5\" type=\"range\" min=\"0\" max=\"12\" step=\"0.25\" value=\"3\">\u003c/label>\u003cbutton id=\"pl5\">Animatsiya\u003c/button>\u003c/div>\n\u003cdiv id=\"q3\">\u003c/div>\u003ch3>Mustaqil ishlash\u003c/h3>\u003col>\u003cli>Toshkent (UTC+5) bilan Tokio (UTC+9) orasidagi vaqt farqini aniqlang.\u003c/li>\u003cli>Nega Kuru Baykonurdan afzalroq deyiladi?\u003c/li>\u003cli>Qutb yulduzi qanday topiladi va nega u deyarli joyida turadi?\u003c/li>\u003c/ol>\u003c/section>\n\n\u003cdiv class=\"box\">\u003ch3 style=\"margin-top:0\">Xulosa\u003c/h3>\u003cp>Yer sutkada bir marta gʻarbdan sharqqa aylanadi. Buni Fuko mayatnigi, erkin tushishdagi ogʻish, Koriolis kuchi, Yer siqiqligi va yulduzlarning kunlik harakati tasdiqlaydi. Aylanish kecha-kunduzni, vaqt mintaqalarini, shamollar yoʻnalishini va kosmik uchirishdagi tejamkorlikni belgilaydi.\u003c/p>\n\u003ch3>Bilasizmi?\u003c/h3>\u003cul>\u003cli>Fuko mayatnigi Parijda 1851-yilning boshida namoyish etilgan va Yer aylanishining tomosha qilsa boʻladigan isboti boʻldi.\u003c/li>\u003cli>Ekvatordagi sirt tezligi ≈1670 km/soat (465 m/s).\u003c/li>\u003cli>Qutb yulduzi Shimoliy olam qutbidan ≈0,7° uzoqda, shuning uchun deyarli qimirlamaydi.\u003c/li>\u003c/ul>\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s),PI=Math.PI,rad=d=>d*PI/180,W0=7.292e-5,R0=6371e3;\nconst cx=id=>$('#'+id).getContext('2d');\nconst tabs=[...document.querySelectorAll('nav button')];let cur=0;\ntabs.forEach((b,i)=>b.onclick=()=>{cur=i;tabs.forEach((t,j)=>t.classList.toggle('on',j==i));document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j==i));scrollTo(0,0)});\n$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0b1220';r.dataset.theme=d?'light':'dark'};\nfunction quiz(id,Q){const el=$('#'+id);el.innerHTML='\u003ch3>Test savollari\u003c/h3>';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`\u003cp>\u003cb>${i+1}.\u003c/b> ${q.q}\u003c/p>`;const r=document.createElement('p');r.className='fb';q.o.forEach((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{d.querySelectorAll('button').forEach((x,n)=>{x.disabled=1;if(n==q.a)x.classList.add('ok')});if(j!=q.a)b.classList.add('no');r.textContent=(j==q.a?'Toʻgʻri! ':'Notoʻgʻri. ')+q.e};d.append(b)});d.append(r);el.append(d)})}\nquiz('q1',[{q:'Yer qaysi yoʻnalishda aylanadi?',o:['Sharqdan gʻarbga','Gʻarbdan sharqqa','Shimoldan janubga'],a:1,e:'Shimoliy qutbdan qaralganda soat strelkasiga qarshi.'},{q:'Yulduz sutkasi qancha?',o:['24 s 00 daq','23 s 56 daq 4 s','24 s 04 daq'],a:1,e:'Yulduzlarga nisbatan bir toʻliq aylanish.'},{q:'Ekvatorda chiziqli tezlik taxminan:',o:['46,5 m/s','465 m/s','4650 m/s'],a:1,e:'v = ωR = 7,29·10⁻⁵ · 6,371·10⁶ ≈ 465 m/s.'},{q:'Qutbda (φ=90°) chiziqli tezlik:',o:['465 m/s','233 m/s','0'],a:2,e:'cos 90° = 0, nuqta oʻqda turadi.'}]);\nquiz('q2',[{q:'Fuko tajribasi qachon oʻtkazilgan?',o:['1651','1851','1951'],a:1,e:'1851-yil, Parij Panteoni.'},{q:'Qayerda tebranish tekisligi aylanmaydi?',o:['Qutbda','Toshkentda','Ekvatorda'],a:2,e:'sin 0° = 0.'},{q:'Shimoliy qutbda tekislikning toʻliq burilish davri taxminan:',o:['12 soat','24 soat','48 soat'],a:1,e:'Aniqrogʻi yulduz sutkasi, ≈23,93 soat.'},{q:'Shimoliy yarim sharda burilish:',o:['Soat strelkasi boʻyicha','Soat strelkasiga qarshi','Burilmaydi'],a:0,e:'Janubiy yarim sharda esa unga qarshi.'}]);\nquiz('q3',[{q:'Shimoliy yarim sharda siklon havosi:',o:['Soat strelkasi boʻyicha','Soat strelkasiga qarshi','Aylanmaydi'],a:1,e:'Koriolis kuchi harakatni oʻngga ogʻdiradi.'},{q:'Kosmodromlar nega ekvatorga yaqin qurilishi afzal?',o:['Sirt tezligi kattaroq','Havo sovuqroq','Gravitatsiya yoʻq'],a:0,e:'Sharqqa uchirishda Yer tezligi raketaga qoʻshiladi.'},{q:'Yulduzlar Qutb yulduzi atrofida 1 soatda necha gradusga buriladi?',o:['1°','15°','24°'],a:1,e:'360° / 24 soat = 15°/soat.'}]);\n\n/* 1-boʻlim */\nconst g1=cx('c1');let rot=0,K=1,lat1=41;const KS=[1,2,5,10,17];\nfunction d1(dt){rot+=dt*.7*K;const g=g1,cxx=320,cy=170,r=135;g.clearRect(0,0,640,340);\ng.fillStyle='#2b78b5';g.beginPath();g.arc(cxx,cy,r,0,2*PI);g.fill();\ng.save();g.translate(cxx,cy);g.rotate(rad(23.5));g.beginPath();g.arc(0,0,r,0,2*PI);g.clip();g.strokeStyle='rgba(255,255,255,.35)';\n[-60,-30,0,30,60].forEach(p=>{const y=-r*Math.sin(rad(p)),w=r*Math.cos(rad(p));g.lineWidth=p?1:2;g.beginPath();g.moveTo(-w,y);g.lineTo(w,y);g.stroke()});\ng.lineWidth=1;for(let k=0;k\u003c12;k++){const l=rot+k*PI/6;if(Math.cos(l)\u003c=0)continue;g.beginPath();for(let p=-90;p\u003c=90;p+=10){const x=r*Math.cos(rad(p))*Math.sin(l),y=-r*Math.sin(rad(p));p==-90?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}\nconst y=-r*Math.sin(rad(lat1)),w=r*Math.cos(rad(lat1));g.strokeStyle='#f2a93b';g.lineWidth=2.5;g.beginPath();g.moveTo(-w,y);g.lineTo(w,y);g.stroke();\nconst l=rot+.5;if(Math.cos(l)>0){g.fillStyle='#ff5a4f';g.beginPath();g.arc(w*Math.sin(l),y,6,0,2*PI);g.fill()}\ng.restore();g.save();g.beginPath();g.arc(cxx,cy,r,0,2*PI);g.clip();g.fillStyle='rgba(5,10,30,.62)';g.fillRect(cxx,0,320,340);g.restore();\ng.save();g.translate(cxx,cy);g.rotate(rad(23.5));g.strokeStyle='#e8eefc';g.setLineDash([5,5]);g.beginPath();g.moveTo(0,-r-30);g.lineTo(0,r+30);g.stroke();g.restore();\ng.fillStyle='#e8eefc';g.font='14px system-ui';g.fillText('☀ Quyosh nuri',14,28);g.fillText('Kun',cxx-95,cy-r-8);g.fillText('Tun',cxx+70,cy-r-8);g.fillText('Gʻarbdan sharqqa →',cxx-70,332);g.fillText('Sh',cxx+Math.sin(rad(23.5))*(r+32)-8,cy-Math.cos(rad(23.5))*(r+32)-2)}\nfunction u1(){lat1=+$('#l1').value;$('#l1v').textContent=lat1;const w=W0*K,v=w*R0*Math.cos(rad(lat1));$('#o1').innerHTML=`ω = \u003cb>${(w*1e5).toFixed(2)}·10⁻⁵ rad/s\u003c/b>\u003cbr>v = ωR·cosφ = \u003cb>${v.toFixed(0)} m/s\u003c/b> ≈ \u003cb>${(v*3.6).toFixed(0)} km/soat\u003c/b>`+(K==17?'\u003cbr>Bunda ekvatorda v ≈ 7,9 km/s (birinchi kosmik tezlik): jismlar ogʻirligini deyarli yoʻqotardi.':K>1?'\u003cbr>Bu faraziy holat: haqiqiy Yer K=1.':'')}\n$('#l1').oninput=u1;$('#k1').onclick=()=>{K=KS[(KS.indexOf(K)+1)%KS.length];$('#k1').textContent=`Yer aylanish tezligini oʻzgartir (×${K})`;u1()};u1();\n\n/* 2-boʻlim */\nconst g2=cx('c2');let ts=0,ph=0,tr=[],sp=1000,lat2=41,L2=67,hm=1;\nconst T0=()=>2*PI*Math.sqrt(L2/9.81);\nfunction res2(){tr=[];ts=0;lat2=+$('#l2').value;L2=+$('#L2').value;$('#l2v').textContent=lat2;$('#L2v').textContent=L2}\n['l2','L2'].forEach(i=>$('#'+i).oninput=res2);$('#h2').onchange=e=>{hm=+e.target.value;res2()};\ndocument.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{sp=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x==b))});\nconst setLat=v=>{$('#l2').value=v;res2()};$('#tk').onclick=()=>setLat(41);$('#qt').onclick=()=>setLat(90);$('#ek').onclick=()=>setLat(0);\nfunction d2(dt){ph+=dt*2*PI/Math.max(.8,T0()/3);ts+=dt*sp;const w=W0*Math.sin(rad(lat2))*hm,ang=w*ts,th=-PI/2+ang,c=Math.cos(th),s=Math.sin(th),A=140,d=A*Math.sin(ph),X=320+d*c,Y=170+d*s;\ntr.push([X,Y]);if(tr.length>2500)tr.shift();const g=g2;g.clearRect(0,0,640,340);g.strokeStyle='#33476e';g.beginPath();g.arc(320,170,155,0,2*PI);g.stroke();g.fillStyle='#9fb0cf';g.font='13px system-ui';g.fillText('Sh',312,12);\ng.strokeStyle='rgba(95,208,240,.7)';g.beginPath();tr.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();\ng.setLineDash([4,4]);g.strokeStyle='#e8eefc';g.beginPath();g.moveTo(320-A*c,170-A*s);g.lineTo(320+A*c,170+A*s);g.stroke();g.setLineDash([]);g.fillStyle='#f2a93b';g.beginPath();g.arc(X,Y,8,0,2*PI);g.fill();\nconst T=Math.sin(rad(lat2))>1e-6?23.934/Math.sin(rad(lat2)):0,dg=Math.abs(ang*180/PI);\n$('#o2').innerHTML=`Tebranish davri T₀ = \u003cb>${T0().toFixed(1)} s\u003c/b>\u003cbr>Burilish tezligi: \u003cb>${(15.04*Math.sin(rad(lat2))).toFixed(2)}°/soat\u003c/b>\u003cbr>Oʻtgan vaqt: \u003cb>${(ts/3600).toFixed(2)} soat\u003c/b>, burilish burchagi: \u003cb>${(dg%360).toFixed(1)}°\u003c/b> (${Math.floor(dg/360)} toʻliq aylanish)\u003cbr>Toʻliq aylanish davri: \u003cb>${T?T.toFixed(1)+' soat':'cheksiz: tekislik aylanmaydi'}\u003c/b>`}\nres2();\n\n/* 3-boʻlim: xarita */\nconst g3=cx('c3'),CT=[['Toshkent','Asia/Tashkent',41.3,69.2],['London','Europe/London',51.5,-.1],['Moskva','Europe/Moscow',55.8,37.6],['Pekin','Asia/Shanghai',39.9,116.4],['Tokio','Asia/Tokyo',35.7,139.7],['Sidney','Australia/Sydney',-33.9,151.2],['Nyu-York','America/New_York',40.7,-74]];\nCT.forEach((c,i)=>$('#ct').add(new Option(c[0],i)));let off=0,pl3=1,tNow=new Date();\n$('#pl3').onclick=()=>{pl3=!pl3;$('#pl3').textContent=pl3?'Toʻxtat':'Davom ettir'};$('#rt3').onclick=()=>{off=0;pl3=0;$('#pl3').textContent='Davom ettir'};\nfunction d3(dt){if(pl3)off+=dt*1800000;tNow=new Date(Date.now()+off);const h=tNow.getUTCHours()+tNow.getUTCMinutes()/60+tNow.getUTCSeconds()/3600,doy=(tNow-Date.UTC(tNow.getUTCFullYear(),0,0))/864e5,dl=rad(-23.44*Math.cos(2*PI*(doy+10)/365)),ls=(12-h)*15,g=g3;\ng.fillStyle='#3c78a8';g.fillRect(0,0,720,360);g.fillStyle='rgba(5,10,30,.62)';\nfor(let X=0;X\u003c720;X+=6)for(let Y=0;Y\u003c360;Y+=6){const lo=X/2-180+1.5,la=90-Y/2-1.5;if(Math.sin(rad(la))*Math.sin(dl)+Math.cos(rad(la))*Math.cos(dl)*Math.cos(rad(lo-ls))\u003c0)g.fillRect(X,Y,6,6)}\ng.strokeStyle='rgba(255,255,255,.3)';g.fillStyle='#e8eefc';g.font='10px system-ui';for(let lo=-180;lo\u003c=180;lo+=15){const x=(lo+180)*2;g.beginPath();g.moveTo(x,0);g.lineTo(x,360);g.stroke();if(lo\u003c180)g.fillText((lo>0?'+':'')+lo/15,x+3,10)}\ng.beginPath();g.moveTo(0,180);g.lineTo(720,180);g.stroke();\nCT.forEach((c,i)=>{g.fillStyle=i==$('#ct').value?'#ff5a4f':'#fff';g.beginPath();g.arc((c[3]+180)*2,(90-c[2])*2,i==$('#ct').value?6:3,0,2*PI);g.fill()});\nconst sx=((((ls+180)%360)+360)%360)*2,sy=(90-dl*180/PI)*2;g.fillStyle='#f2a93b';g.beginPath();g.arc(sx,sy,8,0,2*PI);g.fill();\nconst c=CT[$('#ct').value],alt=Math.sin(rad(c[2]))*Math.sin(dl)+Math.cos(rad(c[2]))*Math.cos(dl)*Math.cos(rad(c[3]-ls));\n$('#o3').innerHTML=`${c[0]}: \u003cb>${tNow.toLocaleTimeString('en-GB',{timeZone:c[1]})}\u003c/b> (${new Intl.DateTimeFormat('en',{timeZone:c[1],timeZoneName:'short'}).format(tNow).split(' ').pop()}). Hozir: \u003cb>${alt>0?'kun':'tun'}\u003c/b>. UTC: ${tNow.toISOString().slice(11,19)}`}\n\n/* Siklon */\nconst g4=cx('c4');let cyc=1;const PS=[...Array(26)].map((_,i)=>({a:i*2*PI/26,t:Math.random()*110}));$('#cy').onclick=()=>{cyc*=-1;$('#cy').textContent=cyc>0?'Siklon (past bosim)':'Antisiklon (yuqori bosim)'};\nfunction d4(dt){const g=g4;g.clearRect(0,0,640,280);g.font='13px system-ui';[[160,1,'Shimoliy yarim shar'],[480,-1,'Janubiy yarim shar']].forEach(([x,h,n])=>{const rd=-cyc*h;g.fillStyle='#e8eefc';g.fillText(n+': '+(rd\u003c0?'soat strelkasiga qarshi':'soat strelkasi boʻyicha'),x-100,22);g.strokeStyle='#33476e';g.beginPath();g.arc(x,150,115,0,2*PI);g.stroke();\nPS.forEach(p=>{const r=cyc>0?120-p.t:10+p.t,a=p.a+rd*p.t*.03;g.fillStyle=`rgba(95,208,240,${.3+.7*(1-Math.abs(p.t-55)/55)})`;g.beginPath();g.arc(x+r*Math.cos(a),150+r*Math.sin(a),3.2,0,2*PI);g.fill()});g.fillStyle='#f2a93b';g.font='bold 14px system-ui';g.fillText(cyc>0?'H':'Y',x-5,155);g.font='13px system-ui'});PS.forEach(p=>{p.t+=dt*25;if(p.t>110)p.t=0})}\n\n/* Yulduz izlari */\nconst g5=cx('c5');let sd=7;const rnd=()=>(sd=sd*16807%2147483647)/2147483647,ST=[...Array(70)].map(()=>({r:18+rnd()*140,a:rnd()*2*PI,s:.6+rnd()*1.4}));let h5=3,pl5=0;\nfunction d5(){const g=g5;g.clearRect(0,0,640,320);ST.forEach(s=>{g.strokeStyle='rgba(232,238,252,.75)';g.lineWidth=s.s;g.beginPath();g.arc(320,160,s.r,s.a,s.a-h5*PI/12,true);g.stroke();g.fillStyle='#fff';const e=s.a-h5*PI/12;g.beginPath();g.arc(320+s.r*Math.cos(e),160+s.r*Math.sin(e),s.s+.8,0,2*PI);g.fill()});g.fillStyle='#f2a93b';g.beginPath();g.arc(320,160,4,0,2*PI);g.fill();g.fillStyle='#e8eefc';g.font='13px system-ui';g.fillText('Qutb yulduzi',330,152)}\n$('#l5').oninput=e=>{h5=+e.target.value;$('#l5v').textContent=h5;$('#d5').textContent=h5*15;d5()};\n$('#pl5').onclick=()=>pl5=!pl5;$('#ct').onchange=()=>{};d5();\n\nlet last=performance.now();\n(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;\nif(cur==0)d1(dt);else if(cur==1)d2(dt);else{d3(dt);d4(dt);if(pl5){h5=(h5+dt*.8)%12.01;$('#l5').value=h5;$('#l5v').textContent=h5.toFixed(1);$('#d5').textContent=Math.round(h5*15);d5()}}\nrequestAnimationFrame(loop)})(last);\n\u003c/script>\u003c/main>\u003c/body>\u003c/html>\n"}, {"title": "Osmon sferasi", "icon": "🌌", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Osmon sferasi — interaktiv dars\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3fb;--fg:#14213d;--card:#fff;--bd:#c9d6ef;--ac:#2b59c3;--mut:#4a5a7a;--ok:#1b8a5a;--no:#c0392b;--sky:none}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#070b1e;--fg:#e6ecff;--card:#101a40;--bd:#27386e;--ac:#7aa2ff;--mut:#9fb0d9;--ok:#5be3a0;--no:#ff7b72;--sky:radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 120px 80px,#fff6,transparent),radial-gradient(1.5px 1.5px at 200px 150px,#fffa,transparent)}}\n:root[data-theme=\"dark\"]{--bg:#070b1e;--fg:#e6ecff;--card:#101a40;--bd:#27386e;--ac:#7aa2ff;--mut:#9fb0d9;--ok:#5be3a0;--no:#ff7b72;--sky:radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 120px 80px,#fff6,transparent),radial-gradient(1.5px 1.5px at 200px 150px,#fffa,transparent)}\n*{box-sizing:border-box}\nbody{margin:0;font:17px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg) var(--sky);background-size:auto,240px 200px;min-height:100%}\n.w{max-width:860px;margin:0 auto;padding:12px}\nh1{font-size:1.4rem;margin:.3rem 0}h2{font-size:1.25rem}h3{font-size:1.1rem}\n.sub{color:var(--mut);margin:0 0 8px}\n.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}\n.tabs button{flex:1;min-width:120px;min-height:48px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;font:inherit;font-size:.9rem;cursor:pointer}\n.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\ncanvas{width:100%;display:block;border-radius:14px;margin-top:8px;touch-action:none;cursor:grab;border:1px solid var(--bd)}\n.card,.box,.task,.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}\n.box{border-left:5px solid #ffd166}.task{border-left:5px solid var(--ac)}\n.leg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}\n.chip{min-height:42px;padding:6px 12px;border-radius:21px;border:2px solid var(--c);background:var(--card);color:var(--fg);font:inherit;font-size:.85rem;cursor:pointer}\n.chip.on{background:var(--c);color:#000}\n.sp{display:inline-block;padding:2px 10px;border-radius:12px;border:2px solid var(--c);font-size:.85rem}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}.row[hidden]{display:none}\n.btn{min-height:48px;padding:8px 18px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}\ninput[type=range]{width:100%;min-width:180px;height:32px}\nlabel{display:block;flex:1}\ninput[type=number]{width:5em;font:inherit;padding:4px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}\n.o{display:block;width:100%;text-align:left;min-height:46px;margin:5px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit;cursor:pointer}\n.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,transparent)}\n.fb{margin:4px 0 0;font-size:.95rem}\nul{padding-left:20px;margin:6px 0}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"w\">\n\u003ch1>🌌 Osmon sferasi\u003c/h1>\n\u003cp class=\"sub\">11-sinf astronomiya · 4-mavzu: Osmon sferasi, uning asosiy nuqta, aylana va chiziqlari\u003c/p>\n\u003cnav class=\"tabs\" id=\"tabs\">\u003cbutton class=\"on\">1. Osmon sferasi\u003c/button>\u003cbutton>2. Nuqta va chiziqlar\u003c/button>\u003cbutton>3. Aylanalar va koordinatalar\u003c/button>\u003c/nav>\n\u003ccanvas id=\"cv\">\u003c/canvas>\n\u003cp class=\"sub\" style=\"font-size:.85rem\">☝️ Sferani barmoq/sichqoncha bilan aylantiring. Yulduz yoki nuqtani bosing.\u003c/p>\n\u003cdiv class=\"leg\" id=\"leg\">\u003c/div>\n\u003cdiv id=\"ctl\">\n\u003cdiv class=\"row\" data-t=\"0 2\">\u003cbutton class=\"btn\" id=\"play\">▶ Boshlash\u003c/button>\u003clabel>Tezlik (1 s = \u003cspan id=\"sv\">2\u003c/span> yulduz soati)\u003cinput type=\"range\" id=\"spd\" min=\"1\" max=\"10\" value=\"2\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\" data-t=\"0\">\u003cbutton class=\"btn\" id=\"md\">Rejim: sfera aylanadi (ko'rinma)\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" data-t=\"1 2\">\u003clabel>Kuzatuvchi kengligi φ = \u003cb id=\"pv\">41°\u003c/b> (O'zbekiston ≈ 41°)\u003cinput type=\"range\" id=\"ph\" min=\"0\" max=\"90\" value=\"41\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\" data-t=\"2\">\u003cbutton class=\"btn\" id=\"cu\">↑ Yuqori kulminatsiya\u003c/button>\u003cbutton class=\"btn\" id=\"cl\">↓ Quyi kulminatsiya\u003c/button>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\" id=\"ro\">\u003c/div>\n\u003cdiv id=\"sec\">\u003c/div>\n\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),D=Math.PI/180,TAU=6.2832,cv=$('#cv'),ctx=cv.getContext('2d');\nlet tab=0,yaw=.6,pitch=.4,phi=41*D,theta=0,playing=false,earth=false,sel=0,selItem='zen',goal=null,W=300,H0=300,dpr=1,X0,Y0,R,hits=[],drag=null,last=0,roS='';\nconst L={eq:1,hor:0,mer:0,hr:0,ecl:0};\nconst C={zen:'#ff5d73',hor:'#3ddc97',ax:'#ffd166',eq:'#ff9f1c',mer:'#4cc9f0',vert:'#b8c0ff',hr:'#f4a6d7',ecl:'#e056fd',alm:'#9be564',noon:'#e8e8e8'};\n// Yulduzlar: nomi, to'g'ri chiqish a (°), og'ish d (°)\nconst named=[['Qutb yulduzi',37.95,89.26],['Vega',279.2,38.8],['Sirius',101.3,-16.7],['Arcturus',213.9,19.2],['Capella',79.2,46],['Betelgeuse',88.8,7.4],['Rigel',78.6,-8.2],['Aldebaran',69,16.5],['Altair',297.7,8.9],['Deneb',310.4,45.3],['Antares',247.4,-26.4],['Spica',201.3,-11.2],['Procyon',114.8,5.2],['Regulus',152.1,12],['Dubhe',165.9,61.8],['Fomalhaut',344.4,-29.6]].map(s=>({n:s[0],a:s[1]*D,d:s[2]*D}));\nlet sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;\nconst faint=Array.from({length:170},()=>({a:rnd()*TAU,d:Math.asin(2*rnd()-1)}));\n// Koordinata almashtirishlar\nconst inert=(a,d)=>[Math.cos(d)*Math.cos(a),Math.cos(d)*Math.sin(a),Math.sin(d)];\nconst eqv=(h,d)=>[Math.cos(d)*Math.cos(h),Math.cos(d)*Math.sin(h),Math.sin(d)];\nconst skv=(x,y,z)=>{const c=Math.cos(theta),s=Math.sin(theta);return[x*c+y*s,x*s-y*c,z]};\nconst sk=(a,d)=>skv(...inert(a,d));\nconst hv=v=>{const s=Math.sin(phi),c=Math.cos(phi);return[-v[1],-(v[0]*s-v[2]*c),v[0]*c+v[2]*s]}; // (e,n,u)\nconst P=v=>tab?hv(v):v;\nconst spos=s=>tab==0&&earth?inert(s.a,s.d):P(sk(s.a,s.d));\nconst cc=(f,n=90)=>Array.from({length:n+1},(_,i)=>f(i/n*TAU));\nlet cyw,syw,cpt,spt;\nconst pr=p=>{const x=p[0]*cyw-p[1]*syw,y=p[0]*syw+p[1]*cyw;return{x:X0+R*x,y:Y0-R*(y*spt+p[2]*cpt),d:y*cpt-p[2]*spt}};\nfunction ln(pts,c,w=1.5,dash){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash||[]);let a=pr(pts[0]);for(let i=1;i\u003cpts.length;i++){const b=pr(pts[i]);ctx.globalAlpha=(a.d+b.d)/2>0?.25:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();a=b}ctx.globalAlpha=1;ctx.setLineDash([])}\nfunction lb(p,t,c,id,dx=7,dy=-7,fs=13){const q=pr(p),on=id&&id===selItem&&tab==1;ctx.globalAlpha=q.d>0?.5:1;ctx.fillStyle=c;ctx.beginPath();ctx.arc(q.x,q.y,on?8:4,0,7);ctx.fill();ctx.font='bold '+(on?fs+3:fs)+'px system-ui';ctx.fillText(t,q.x+dx,q.y+dy);ctx.globalAlpha=1;if(id)hits.push({id,x:q.x,y:q.y})}\nconst wd=id=>selItem==id&&tab==1?5:2.2;\nconst f1=n=>n.toFixed(1).replace('.',',');\n// Tanlangan yulduz koordinatalari\nfunction calc(s){const v=sk(s.a,s.d),S=v[0]*Math.sin(phi)-v[2]*Math.cos(phi),U=v[0]*Math.cos(phi)+v[2]*Math.sin(phi);return{A:(Math.atan2(v[1],S)/D+360)%360,h:Math.asin(Math.max(-1,Math.min(1,U)))/D,t:(((theta-s.a)%TAU)+TAU)%TAU/D,d:s.d/D}}\nconst arc=(f,n=24)=>Array.from({length:n+1},(_,i)=>f(i/n));\nfunction draw(){\n const w=W,h=H0;X0=w/2;Y0=h/2;R=Math.min(w,h)*.4;cyw=Math.cos(yaw);syw=Math.sin(yaw);cpt=Math.cos(pitch);spt=Math.sin(pitch);\n ctx.setTransform(dpr,0,0,dpr,0,0);\n const g=ctx.createRadialGradient(X0,Y0,10,X0,Y0,Math.max(w,h)*.7);g.addColorStop(0,'#14235a');g.addColorStop(1,'#050816');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);\n hits=[];ctx.strokeStyle='rgba(150,180,255,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(X0,Y0,R,0,7);ctx.stroke();\n const sp=Math.sin(phi),cp=Math.cos(phi);\n if(tab==0){\n  named.forEach(s=>ln(cc(t=>eqv(t,s.d)),'rgba(255,255,255,.13)',1));\n  ln(cc(t=>[Math.cos(t),Math.sin(t),0]),C.eq,2);\n  ln([[0,0,-1.18],[0,0,1.18]],C.ax,2.5);lb([0,0,1.18],'Shim. qutb',C.ax);lb([0,0,-1.18],'Jan. qutb',C.ax);\n  const th=earth?theta:0,dir=[cp*Math.cos(th),cp*Math.sin(th),sp];\n  ctx.fillStyle='rgba(43,110,219,.85)';ctx.beginPath();ctx.arc(X0,Y0,.16*R,0,7);ctx.fill();\n  ln(cc(t=>[.16*Math.cos(t),.16*Math.sin(t),0]),'#cfe',1);\n  ln([dir.map(x=>x*.16),dir],C.zen,2,[5,4]);lb(dir.map(x=>x*1.02),'Zenit',C.zen);\n  lb(dir.map(x=>x*.16),'Kuzatuvchi','#fff',null,6,14,11);\n }\n if(tab==1){\n  ln(cc(t=>P(eqv(t,0))),C.eq,1.2);\n  ln(cc(t=>[Math.cos(t),Math.sin(t),0]),C.hor,wd('hor'));\n  ln(cc(t=>[0,Math.cos(t),Math.sin(t)]),C.mer,wd('mer'));\n  ln([[0,0,-1.15],[0,0,1.15]],C.zen,wd('plumb'),[6,4]);\n  ln([[0,1,0],[0,-1,0]],C.noon,wd('noon'),[3,3]);\n  ln([[0,-cp*1.2,-sp*1.2],[0,cp*1.2,sp*1.2]],C.ax,wd('axis'));\n  ln(arc(i=>[0,Math.cos(phi*i),Math.sin(phi*i)]),'#fff',3);\n  const m=pr([0,Math.cos(phi/2)*1.08,Math.sin(phi/2)*1.08]);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('φ',m.x+4,m.y);\n  lb([0,0,1],'Zenit',C.zen,'zen');lb([0,0,-1],'Nadir',C.zen,'nad');\n  lb([0,cp*1.2,sp*1.2],'Shim. qutb',C.ax,'pn');lb([0,-cp*1.2,-sp*1.2],'Jan. qutb',C.ax,'ps');\n  [[[0,1,0],'Shimol'],[[0,-1,0],'Janub'],[[1,0,0],'Sharq'],[[-1,0,0],\"G'arb\"]].forEach(a=>lb(a[0],a[1],'#fff','cp'));\n  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X0,Y0,4,0,7);ctx.fill();\n }\n if(tab==2){\n  if(L.eq){ln(cc(t=>P(eqv(t,0))),C.eq,2.4);[-60,-30,30,60].forEach(d=>ln(cc(t=>P(eqv(t,d*D))),C.eq,.8))}\n  if(L.hor){ln(cc(t=>[Math.cos(t),Math.sin(t),0]),C.hor,2.6);[-60,-30,30,60].forEach(a=>{const q=a*D;ln(cc(t=>[Math.cos(q)*Math.cos(t),Math.cos(q)*Math.sin(t),Math.sin(q)]),C.alm,.8)})}\n  if(L.mer){ln(cc(t=>[0,Math.cos(t),Math.sin(t)]),C.mer,2.4);ln(cc(t=>[Math.cos(t),0,Math.sin(t)]),C.vert,2.4);[45,135].forEach(a=>ln(cc(t=>[Math.cos(t)*Math.sin(a*D),Math.cos(t)*Math.cos(a*D),Math.sin(t)]),C.vert,.8))}\n  if(L.hr)for(let k=0;k\u003c6;k++)ln(cc(t=>P(eqv(k*30*D,t))),C.hr,1)\n  if(L.ecl){const ce=Math.cos(23.5*D),se=Math.sin(23.5*D);ln(cc(t=>P(skv(Math.cos(t),Math.sin(t)*ce,Math.sin(t)*se))),C.ecl,2.4);\n   [[0,'Bahorgi tengkunlik'],[90,'Yozgi kunburilish'],[180,'Kuzgi tengkunlik'],[270,'Qishki kunburilish']].forEach(a=>{const t=a[0]*D;lb(P(skv(Math.cos(t),Math.sin(t)*ce,Math.sin(t)*se)),a[1],C.ecl,null,6,-6,11)})}\n  lb([0,0,1],'Zenit',C.zen);lb([0,cp,sp],'Shim. qutb',C.ax);\n  [[[0,1,0],'Sh'],[[0,-1,0],'J'],[[1,0,0],'Sq'],[[-1,0,0],\"G'\"]].forEach(a=>lb(a[0],a[1],'#fff'));\n  // tanlangan yulduz burchaklari\n  const s=named[sel],c=calc(s),A=c.A*D,hh=c.h*D,t=c.t*D;\n  ln(arc(i=>{const k=hh*i;return[-Math.cos(k)*Math.sin(A),-Math.cos(k)*Math.cos(A),Math.sin(k)]}),'#fff',3,[5,3]);\n  ln(arc(i=>{const k=A*i;return[-Math.sin(k),-Math.cos(k),0]},40),'#00f5d4',3.5);\n  ln(arc(i=>P(eqv(t,s.d*i))),'#ff9f1c',3.5);\n  ln(arc(i=>P(eqv(t*i,0)),40),'#f4a6d7',3.5);\n }\n // yulduzlar\n faint.forEach(s=>{const q=pr(spos(s));ctx.globalAlpha=q.d>0?.2:.6;ctx.fillStyle='#cfd8ff';ctx.fillRect(q.x,q.y,1.3,1.3)});\n ctx.globalAlpha=1;\n named.forEach((s,i)=>{const q=pr(spos(s)),b=q.d>0;ctx.globalAlpha=b?.4:1;ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(q.x,q.y,i==sel&&tab==2?5:3,0,7);ctx.fill();\n  if(i==sel&&tab==2){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,10,0,7);ctx.stroke()}\n  if(tab!=1){ctx.fillStyle='#e6ecff';ctx.font='11px system-ui';ctx.fillText(s.n,q.x+6,q.y+12)}\n  if(tab==2)hits.push({id:'s'+i,x:q.x,y:q.y});ctx.globalAlpha=1});\n}\nconst I={zen:[\"Zenit\",\"boshimiz ustidagi nuqta — tik chiziqning osmon sferasi bilan yuqoridagi kesishgan joyi.\"],nad:[\"Nadir\",\"zenitga qarama-qarshi nuqta (oyoq ostimizda, ufq ostida).\"],plumb:[\"Tik (vertikal) chiziq\",\"kuzatuvchidan o'tuvchi, shovun (ipga osilgan yuk) yo'nalishidagi chiziq. Zenit va nadirni tutashtiradi.\"],hor:[\"Haqiqiy gorizont\",\"kuzatuvchidan tik chiziqqa perpendikulyar o'tgan tekislik. U osmon sferasini ustki (ko'rinadigan) va ostki (ko'rinmaydigan) yarimga ajratadi.\"],axis:[\"Dunyo o'qi\",\"kuzatuvchi orqali Yerning aylanish o'qiga parallel o'tgan to'g'ri chiziq. Osmon sferasi ko'rinma ravishda shu o'q atrofida aylanadi.\"],pn:[\"Shimoliy dunyo qutbi\",\"dunyo o'qining shimol tomondagi kesishgan nuqtasi. Qutb yulduzi unga juda yaqin turadi.\"],ps:[\"Janubiy dunyo qutbi\",\"shimoliy qutbga diametral qarama-qarshi nuqta. O'zbekistonda u ufq ostida, ko'rinmaydi.\"],cp:[\"Shimol, janub, sharq, g'arb nuqtalari\",\"tush chizig'i va unga perpendikulyar chiziqning ufq aylanasi bilan kesishgan nuqtalari: to'rt asosiy tomon.\"],noon:[\"Tush chizig'i\",\"meridian tekisligi bilan haqiqiy ufq tekisligining kesishish chizig'i; shimol va janub nuqtalarini tutashtiradi. Tushda tayoqning soyasi shu chiziq bo'ylab tushadi.\"],mer:[\"Osmon meridiani\",\"zenit, nadir va ikkala dunyo qutbidan o'tuvchi katta aylana. Yulduz meridianni kesib o'tganda kulminatsiyada bo'ladi.\"]};\nfunction ro(){let s;\n if(tab==0)s=`\u003cb>Yulduz vaqti:\u003c/b> ${f1(theta/D/15)} soat (0–24). ${earth?'\u003cb>Haqiqiy:\u003c/b> yulduzlar qo\\'zg\\'almas, Yer g\\'arbdan sharqqa aylanadi — qizil zenit
